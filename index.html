      var LAB_INDEX = {};
      LAB_PARAMS.forEach(function (p) {
        p.key = p.n;
        p.find = p.find || [p.n];
        LAB_INDEX[p.key] = p;
      });

      var lab = document.getElementById('lab');
      var labBody = document.getElementById('labBody');
      var labSearch = document.getElementById('labSearch');
      var labPeriodSel = document.getElementById('labPeriod');
      var labOut = document.getElementById('labOut');
      var labBuilt = false;
      var labSweep = null;
      var labRefreshAt = 0;

      // Reads (and, with v, writes) one of the constants above by name. They
      // are plain closure variables in this function, so a direct eval here
      // reaches them; only names in LAB_INDEX are accepted.
      function labVar(key, v) {
        var p = LAB_INDEX[key];
        if (!p || p.tune || p.shader) return undefined;
        if (arguments.length > 1) {
          v = Number(v);
          if (p.ro || !isFinite(v)) return undefined;
          eval(key + ' = ' + v);
        }
        return eval(key);
      }

      function labGet(p) {
        if (p.tune) return settings[p.n];
        if (p.shader) return p.shaderVal;
        return labVar(p.key);
      }

      function labDecimals(p) {
        var s = String(p.step || 1);
        return s.indexOf('.') < 0 ? 0 : s.length - s.indexOf('.') - 1;
      }

      function labFmt(p, v) {
        if (typeof v !== 'number') return String(v);
        return v.toFixed(labDecimals(p));
      }

      function labChanged(p, v) {
        if (p.color) return String(v).toLowerCase() !== String(p.def).toLowerCase();
        return typeof v === 'number' && Math.abs(v - p.def) > (p.step || 1e-6) * 0.5;
      }

      function labSet(p, v, fromSweep) {
        if (p.ro || p.shader) return;
        if (!fromSweep && labSweep && labSweep.p === p) labStopSweep();
        if (p.color) {
          var ci = document.getElementById(p.n);
          ci.value = v;
          ci.dispatchEvent(new Event('input', { bubbles: true }));
          labShow(p);
          return;
        }
        v = clamp(Number(v), p.min, p.max);
        if (!isFinite(v)) return;
        if (p.snap || !fromSweep) v = p.min + Math.round((v - p.min) / p.step) * p.step;
        v = +v.toFixed(6);
        if (p.tune) {
          var input = document.getElementById(p.n);
          input.value = String(v);
          input.dispatchEvent(new Event('input', { bubbles: true }));
        } else {
          labVar(p.key, v);
        }
        labShow(p);
      }

      // Put the current value into the card.
      function labShow(p) {
        var el = p.el;
        if (!el) return;
        var v = labGet(p);
        el.val.textContent = p.color || p.ro || p.shader ? String(v) : labFmt(p, v);
        if (el.range && document.activeElement !== el.range) el.range.value = String(v);
        if (el.num && document.activeElement !== el.num) el.num.value = labFmt(p, v);
        if (el.color && document.activeElement !== el.color) el.color.value = v;
        if (!p.ro && !p.shader) el.card.classList.toggle('changed', labChanged(p, v));
      }

      function labStartSweep(p) {
        labStopSweep();
        var span = p.max - p.min;
        labSweep = { p: p, u: span > 0 ? clamp((labGet(p) - p.min) / span, 0, 1) : 0, dir: 1 };
        p.el.sweep.textContent = 'stop';
        p.el.sweep.classList.add('on');
        p.el.card.classList.add('sweeping');
      }

      function labStopSweep() {
        if (!labSweep) return;
        var el = labSweep.p.el;
        el.sweep.textContent = 'sweep';
        el.sweep.classList.remove('on');
        el.card.classList.remove('sweeping');
        labSweep = null;
      }

      // Called from frame() every frame. Sweeps run on the app's own clock.
      function labTick(dt) {
        if (!labBuilt) return;
        if (labSweep) {
          var s = labSweep;
          var period = Number(labPeriodSel.value) || 6;
          s.u += s.dir * dt * 2 / period;
          if (s.u >= 1) { s.u = 2 - s.u; s.dir = -1; }
          if (s.u <= 0) { s.u = -s.u; s.dir = 1; }
          s.u = clamp(s.u, 0, 1);
          labSet(s.p, s.p.min + (s.p.max - s.p.min) * s.u, true);
        }
        // Keep tune cards in step with the tune panel, and live values current.
        labRefreshAt -= dt;
        if (labRefreshAt <= 0 && document.body.classList.contains('labbing')) {
          labRefreshAt = 0.3;
          LAB_PARAMS.forEach(function (p) { if (p.tune || p.live) labShow(p); });
        }
      }

      // --- Reading the source --------------------------------------------
      // The page's own script text, one entry per line, each with the function
      // (JS or GLSL) it sits in. Built once, the first time it is needed.
      var labSrc = null;

      function labBraces(s) {
        s = s.replace(/'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|\/\/.*$/g, '');
        var n = 0;
        for (var i = 0; i < s.length; i++) {
          if (s[i] === '{') n++;
          else if (s[i] === '}') n--;
        }
        return n;
      }

      function labScan() {
        if (labSrc) return labSrc;
        var text = '';
        for (var k = 0; k < document.scripts.length; k++) {
          if (document.scripts[k].textContent.indexOf('fragmentSource') >= 0) text = document.scripts[k].textContent;
        }
        var lines = text.split('\n');
        // File line of the script tag. The serialised DOM lacks the doctype
        // line and the newline the parser drops between <html> and <head>.
        var base = 0;
        try {
          var html = document.documentElement.outerHTML;
          base = html.slice(0, html.indexOf('<scr' + 'ipt')).split('\n').length - 1 + 3;
        } catch (e) { base = 0; }
        var BEGIN = '// ---- lab' + ': begin', END = '// ---- lab' + ': end';
        var TICK = String.fromCharCode(96);
        var ctx = [];
        var js = [], gs = [], dj = 0, dg = 0, shader = null;
        var skipFrom = lines.length, skipTo = -1;
        for (var i = 0; i < lines.length; i++) {
          var L = lines[i];
          if (L.indexOf(BEGIN) >= 0) skipFrom = i;
          if (L.indexOf(END) >= 0) skipTo = i;
          if (shader) {
            var t = L.indexOf(TICK);
            var body = t >= 0 ? L.slice(0, t) : L;
            var gm = /^\s*(?:float|vec[234]|void|mat[234]|int|bool|ivec[234])\s+(\w+)\s*\([^;]*$/.exec(body);
            if (gm) gs.push({ n: gm[1], d: dg });
            ctx.push({ lang: 'GLSL', fn: gs.length ? gs[gs.length - 1].n + '()' : 'top level', src: shader });
            dg += labBraces(body);
            while (gs.length && dg <= gs[gs.length - 1].d) gs.pop();
            if (t >= 0) { shader = null; gs.length = 0; dg = 0; }
            continue;
          }
          var open = new RegExp('(\\w+)\\s*=\\s*(?:\\w+\\s*\\+\\s*)?' + TICK).exec(L);
          var fm = /\bfunction\s+(\w+)\s*\(/.exec(L) || /(\w+\.prototype\.\w+)\s*=\s*function\b/.exec(L);
          var ev = !fm && /addEventListener\('(\w+)',\s*function\b/.exec(L);
          if (fm) js.push({ n: fm[1] + '()', d: dj });
          else if (ev) js.push({ n: 'on ' + ev[1], d: dj });
          ctx.push({ lang: 'JS', fn: js.length ? js[js.length - 1].n : 'top level', src: 'script' });
          dj += labBraces(open ? L.slice(0, L.indexOf(TICK)) : L);
          while (js.length && dj <= js[js.length - 1].d) js.pop();
          if (open) { shader = open[1]; gs.length = 0; dg = 0; }
        }
        labSrc = { lines: lines, ctx: ctx, base: base, skipFrom: skipFrom, skipTo: skipTo };
        return labSrc;
      }

      function labLineNo(i) {
        var s = labScan();
        return s.base ? s.base + i : i + 1;
      }

      function labEsc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function labPattern(p) {
        return new RegExp('(^|[^\\w.])(' + p.find.map(function (f) {
          return f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }).join('|') + ')(?![\\w])', 'g');
      }

      function labMark(line, re) {
        re.lastIndex = 0;
        return labEsc(line).replace(re, '$1<mark class="lab-hit">$2</mark>');
      }

      var LAB_PLUMB = { 'syncTuneControls()': 1, 'tuneChanged()': 1, 'resetTune()': 1, 'saveTune()': 1, 'useWritePreset()': 1 };

      // Where a parameter is declared and every line that reads it.
      function labFind(p) {
        if (p.found) return p.found;
        var s = labScan();
        var re = labPattern(p);
        var declRe = p.tune ? /TUNE_DEFAULTS\s*=/
          : new RegExp('^\\s*(?:var\\s+' + p.find[0] + '\\s*=|#define\\s+' + p.find[0] + '\\b|const\\s+\\w+\\s+' + p.find[0] + '\\s*=)');
        var decl = null, uses = [];
        for (var i = 0; i < s.lines.length; i++) {
          if (i >= s.skipFrom && i <= s.skipTo) continue;
          var L = s.lines[i];
          if (!decl && declRe.test(L)) { decl = i; continue; }
          // A name that appears only in a comment is not a use.
          re.lastIndex = 0;
          if (!re.test(L.replace(/\/\/.*$/, ''))) continue;
          var c = s.ctx[i];
          var plumb = p.tune && (LAB_PLUMB[c.fn] || c.fn === 'top level');
          uses.push({ i: i, plumb: plumb });
        }
        uses.sort(function (a, b) { return (a.plumb ? 1 : 0) - (b.plumb ? 1 : 0) || a.i - b.i; });
        p.found = { decl: decl, uses: uses, re: re };
        if (p.shader && decl !== null) {
          var dm = /#define\s+\w+\s+(\S+)/.exec(s.lines[decl]) || /=\s*([^;]+);/.exec(s.lines[decl]);
          p.shaderVal = dm ? dm[1] : '?';
        }
        return p.found;
      }

      function labLoc(i) {
        var c = labScan().ctx[i];
        return '<span class="lab-loc">line <b>' + labLineNo(i) + '</b> \u00b7 ' + c.lang + ' \u00b7 <b>' + labEsc(c.fn) + '</b>'
          + (c.lang === 'GLSL' ? ' in ' + labEsc(c.src) : '') + '</span>';
      }

      function labContext(i, re) {
        var s = labScan();
        var out = '';
        for (var k = Math.max(0, i - 3); k <= Math.min(s.lines.length - 1, i + 3); k++) {
          out += '<span class="lab-ctx' + (k === i ? ' at' : '') + '">' + String(labLineNo(k)).padStart(5, ' ') + '  '
            + (k === i ? labMark(s.lines[k], re) : labEsc(s.lines[k])) + '</span>\n';
        }
        return out;
      }

      function labFillMore(p, box) {
        var f = labFind(p);
        var s = labScan();
        var html = '<span class="lab-k">small scale</span><p class="lab-p">' + labEsc(p.small) + '</p>'
          + '<span class="lab-k">large scale</span><p class="lab-p">' + labEsc(p.large) + '</p>'
          + '<span class="lab-k">where it lives</span>';
        if (p.tune) {
          html += '<p class="lab-p">settings.' + labEsc(p.n) + ' in the settings object, defaulting from TUNE_DEFAULTS (below); its slider is <code>#' + labEsc(p.n) + '</code> in the tune panel\u2019s HTML.</p>';
        }
        if (f.decl !== null) {
          html += '<div class="lab-code">' + labLoc(f.decl) + labMark(s.lines[f.decl].trim(), f.re) + '</div>';
        } else {
          html += '<p class="lab-p">(declaration not found)</p>';
        }
        html += '<span class="lab-k">used by \u00b7 ' + f.uses.length + ' line' + (f.uses.length === 1 ? '' : 's') + ' (click one for context)</span>';
        var plumbStarted = false;
        f.uses.forEach(function (u) {
          if (u.plumb && !plumbStarted) {
            plumbStarted = true;
            html += '<span class="lab-k">plumbing: load, sync, save</span>';
          }
          html += '<div class="lab-code lab-use' + (u.plumb ? ' plumb' : '') + '" data-line="' + u.i + '">' + labLoc(u.i)
            + labMark(s.lines[u.i].trim(), f.re) + '</div>';
        });
        box.innerHTML = html;
      }

      // --- Building the drawer -------------------------------------------
      function labCard(p) {
        var tag = p.ro ? 'read-only' : (p.shader ? 'GLSL' : (p.tune ? 'tune' : ''));
        var h = '<div class="lab-top"><span class="lab-name">' + labEsc(p.n) + '</span>'
          + (tag ? '<span class="lab-tag">' + tag + '</span>' : '')
          + '<span class="lab-dot" title="changed from the file\u2019s value"></span><span class="lab-val"></span></div>';
        if (p.color) {
          h += '<div class="lab-ctl"><input type="color" data-act="color" aria-label="' + p.n + '"><span></span></div>'
            + '<div class="lab-btns"><button type="button" data-act="def">default ' + labEsc(p.def) + '</button></div>';
        } else if (!p.ro && !p.shader) {
          h += '<div class="lab-ctl"><input type="range" data-act="range" min="' + p.min + '" max="' + p.max + '" step="' + (p.snap ? p.step : 'any') + '" aria-label="' + p.n + '">'
            + '<input class="lab-num" type="number" data-act="num" min="' + p.min + '" max="' + p.max + '" step="' + p.step + '" aria-label="' + p.n + ' value"></div>'
            + '<div class="lab-btns"><button type="button" data-act="min">min ' + labFmt(p, p.min) + '</button>'
            + '<button type="button" data-act="def">default ' + labFmt(p, p.def) + '</button>'
            + '<button type="button" data-act="max">max ' + labFmt(p, p.max) + '</button>'
            + (p.noSweep ? '' : '<button type="button" data-act="sweep">sweep</button>') + '</div>';
        }
        h += '<p class="lab-what">' + labEsc(p.what) + '</p>'
          + (p.warn ? '<p class="lab-warn">' + labEsc(p.warn) + '</p>' : '')
          + '<details class="lab-more"><summary>small & large scale \u00b7 where it lives \u00b7 used by</summary><div class="lab-more-body"></div></details>';
        return h;
      }

      function labBuild() {
        if (labBuilt) return;
        LAB_PARAMS.forEach(function (p) {
          if (p.tune) {
            var input = document.getElementById(p.n);
            p.def = TUNE_DEFAULTS[p.n];
            if (!p.color) {
              p.min = Number(input.min); p.max = Number(input.max); p.step = Number(input.step);
            }
          } else if (p.shader) {
            labFind(p);
            p.def = p.shaderVal;
          } else {
            p.def = labVar(p.key);
          }
        });
        var frag = document.createDocumentFragment();
        var intro = document.createElement('p');
        intro.className = 'lab-intro';
        intro.textContent = 'Every value here is a live variable in VoidDrag.html. Change one and the next frame uses it. Constants go back to the file\u2019s values on reload; tune values save as usual. Open a card\u2019s details to see where it is declared and every line that reads it.';
        frag.appendChild(intro);
        LAB_GROUPS.forEach(function (g) {
          var sec = document.createElement('details');
          sec.className = 'lab-group';
          sec.open = g.id !== 'struct' && g.id !== 'shader';
          sec.dataset.group = g.id;
          sec.innerHTML = '<summary>' + labEsc(g.title) + '</summary><p class="lab-gnote">' + labEsc(g.note) + '</p>';
          LAB_PARAMS.forEach(function (p) {
            if (p.g !== g.id) return;
            var card = document.createElement('div');
            card.className = 'lab-card';
            card.dataset.key = p.key;
            card.innerHTML = labCard(p);
            p.el = {
              card: card,
              val: card.querySelector('.lab-val'),
              range: card.querySelector('[data-act="range"]'),
              num: card.querySelector('[data-act="num"]'),
              color: card.querySelector('[data-act="color"]'),
              sweep: card.querySelector('[data-act="sweep"]'),
              more: card.querySelector('.lab-more-body')
            };
            p.text = (p.n + ' ' + p.what + ' ' + p.small + ' ' + p.large + ' ' + g.title).toLowerCase();
            sec.appendChild(card);
            labShow(p);
          });
          frag.appendChild(sec);
        });
        labBody.appendChild(frag);
        labBuilt = true;
      }

      function labCardParam(t) {
        var card = t.closest && t.closest('.lab-card');
        return card ? LAB_INDEX[card.dataset.key] : null;
      }

      labBody.addEventListener('input', function (e) {
        var p = labCardParam(e.target);
        if (!p) return;
        var act = e.target.dataset.act;
        if (act === 'range') labSet(p, Number(e.target.value), false);
        else if (act === 'color') labSet(p, e.target.value, false);
      });
      labBody.addEventListener('change', function (e) {
        var p = labCardParam(e.target);
        if (p && e.target.dataset.act === 'num' && e.target.value !== '') labSet(p, Number(e.target.value), false);
      });
      labBody.addEventListener('click', function (e) {
        var t = e.target;
        var use = t.closest && t.closest('.lab-use');
        if (use) {
          var next = use.nextElementSibling;
          if (next && next.classList.contains('lab-ctxbox')) { next.remove(); return; }
          var p0 = labCardParam(use);
          var box = document.createElement('div');
          box.className = 'lab-code lab-ctxbox';
          box.innerHTML = labContext(Number(use.dataset.line), p0.found.re);
          use.after(box);
          return;
        }
        var act = t.dataset && t.dataset.act;
        var p = labCardParam(t);
        if (!p || !act || t.tagName !== 'BUTTON') return;
        if (act === 'min') labSet(p, p.min, false);
        else if (act === 'max') labSet(p, p.max, false);
        else if (act === 'def') labSet(p, p.def, false);
        else if (act === 'sweep') { if (labSweep && labSweep.p === p) labStopSweep(); else labStartSweep(p); }
      });
      // Details are filled the first time they open (toggle does not bubble).
      labBody.addEventListener('toggle', function (e) {
        var d = e.target;
        if (!d.classList || !d.classList.contains('lab-more') || !d.open) return;
        var p = labCardParam(d);
        var box = d.querySelector('.lab-more-body');
        if (p && box && !box.firstChild) labFillMore(p, box);
      }, true);

      labSearch.addEventListener('input', function () {
        var q = labSearch.value.trim().toLowerCase();
        LAB_GROUPS.forEach(function (g) {
          var sec = labBody.querySelector('[data-group="' + g.id + '"]');
          var any = false;
          LAB_PARAMS.forEach(function (p) {
            if (p.g !== g.id) return;
            var hit = !q || p.text.indexOf(q) >= 0;
            p.el.card.hidden = !hit;
            if (hit) any = true;
          });
          sec.hidden = !any;
          if (q && any) sec.open = true;
        });
      });

      document.getElementById('labReset').addEventListener('click', function () {
        labStopSweep();
        LAB_PARAMS.forEach(function (p) {
          if (!p.tune && !p.ro && !p.shader && labChanged(p, labGet(p))) labSet(p, p.def, false);
        });
        labOut.hidden = true;
      });

      // The changed values as lines of code for the file. Each line is valid
      // code: paste it over the line it names, or hand all of them to
      // tools\apply-defaults (by clipboard, or through a GitHub issue), which
      // finds each declaration by name and writes the new value in.
      function labChanges() {
        var out = [];
        var summary = [];
        var tuneWas = [];
        LAB_PARAMS.forEach(function (p) {
          if (p.ro || p.shader) return;
          var v = labGet(p);
          if (!labChanged(p, v)) return;
          summary.push(p.key + ' ' + (p.color ? v : labFmt(p, v)));
          if (p.tune) {
            tuneWas.push(p.n + ' was ' + (p.color ? p.def : labFmt(p, p.def)));
            return;
          }
          var f = labFind(p);
          var where = f.decl !== null ? ' (line ' + labLineNo(f.decl) + ')' : '';
          var val = +Number(v).toFixed(4);
          if (p.key.indexOf('[') >= 0) out.push(p.key + ' = ' + val + ';   // was ' + p.def + ': edit the array literal' + where);
          else out.push('var ' + p.key + ' = ' + val + ';   // was ' + p.def + where);
        });
        if (tuneWas.length) {
          // The whole TUNE_DEFAULTS line, in the file's own key order and style.
          var parts = Object.keys(TUNE_DEFAULTS).map(function (k) {
            var tp = LAB_INDEX[k];
            var tv = settings[k];
            return k + ': ' + (typeof tv === 'string' ? "'" + tv + "'" : (tp ? labFmt(tp, tv) : String(tv)));
          });
          var tf = labFind(LAB_INDEX.brush);
          out.push('var TUNE_DEFAULTS = { ' + parts.join(', ') + ' };   // ' + tuneWas.join(', ')
            + (tf.decl !== null ? ' (line ' + labLineNo(tf.decl) + ')' : ''));
        }
        return { lines: out, summary: summary };
      }

      function labShowOut(text) {
        labOut.value = text;
        labOut.hidden = false;
        labOut.select();
      }

      document.getElementById('labCopy').addEventListener('click', function () {
        var c = labChanges();
        var text = c.lines.length
          ? '// VoidDrag lab: changed values. To make them the defaults, copy this and run tools\\apply-defaults.cmd\n' + c.lines.join('\n')
          : '// nothing changed from the file\u2019s values';
        labShowOut(text);
        try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {}); } catch (e) { /* the box below still has it */ }
      });

      // "send to web": opens a new GitHub issue in the site's repository with
      // the lines filled in. A GitHub Action there applies them to the web
      // build when the repository owner files it (anyone else's issue is
      // left alone), and tools\apply-defaults brings them back into
      // VoidDrag.html and the phone app on the PC. In the Android app the
      // link opens in the phone's browser (see MainActivity).
      var LAB_REPO = 'artsaffo/voiddrag';
      document.getElementById('labSend').addEventListener('click', function () {
        var c = labChanges();
        if (!c.lines.length) { labShowOut('// nothing changed from the file\u2019s values, so there is nothing to send'); return; }
        var title = 'Lab defaults: ' + c.summary.join(', ');
        if (title.length > 120) title = title.slice(0, 117) + '...';
        var fence = String.fromCharCode(96, 96, 96);
        var body = 'Sent from the VoidDrag lab. When the repository owner files this issue, a GitHub Action makes these values the web build\u2019s defaults, comments with what changed, and closes it. Issues from anyone else are left alone.\n\n'
          + 'On the PC, tools\\apply-defaults.cmd then brings them into VoidDrag.html and can install them on the phone.\n\n'
          + fence + 'js\n' + c.lines.join('\n') + '\n' + fence + '\n';
        var url = 'https://github.com/' + LAB_REPO + '/issues/new?title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(body);
        labShowOut('// opening GitHub with these lines; press "Submit new issue" there\n' + c.lines.join('\n'));
        var w = window.open(url, '_blank');
        if (w) { try { w.opener = null; } catch (e) { /* cross-origin */ } }
      });

      document.getElementById('labOpen').addEventListener('click', function () {
        setTuneOpen(false);
        setLabOpen(true);
      });

      document.getElementById('labClose').addEventListener('click', function () { setLabOpen(false); });

      function setLabOpen(open) {
        if (open) labBuild();
        document.body.classList.toggle('labbing', open);
        lab.setAttribute('aria-hidden', open ? 'false' : 'true');
        if (open) labRefreshAt = 0;
      }

      if (/[?&]lab\b/.test(location.search)) setLabOpen(true);
      // ---- lab: end ----
    })();
  </script>
</body>
</html>
