<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <meta name="description" content="VoidDrag — a soft void where light remembers your touch.">
  <title>VoidDrag — a quiet place for light</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='g' cx='35%25' cy='28%25'><stop offset='0' stop-color='%23ece4d6'/><stop offset='.55' stop-color='%238e8981'/><stop offset='1' stop-color='%23151517'/></radialGradient></defs><circle cx='32' cy='32' r='27' fill='url(%23g)'/></svg>">
  <style>
    :root {
      --ink: #ece5d9;
      --ink-soft: rgba(236, 229, 217, 0.7);
      --ink-dim: rgba(236, 229, 217, 0.46);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: #07070a;
    }

    body {
      overflow: hidden;
      -webkit-touch-callout: none;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      -webkit-user-select: none;
      user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    :focus-visible {
      outline: 1px solid rgba(236, 229, 217, 0.85);
      outline-offset: 3px;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #07070a;
      cursor: crosshair;
      opacity: 0;
      touch-action: none;
      transition: opacity 1.8s var(--ease);
    }

    body.ready #stage { opacity: 1; }
    body.dragging #stage { cursor: grabbing; }
    body.holding-moon #stage { cursor: grabbing !important; }

    .mark {
      position: fixed;
      z-index: 3;
      top: max(19px, env(safe-area-inset-top));
      left: max(21px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .mark-main {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--serif);
      font-size: 23px;
      line-height: 1;
      letter-spacing: 0.13em;
      color: var(--ink);
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.42);
    }

    .mark-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f0e8da, #8e8981 55%, #17171a);
      box-shadow: 0 0 14px rgba(226, 216, 198, 0.4);
    }

    .mark small {
      display: block;
      margin: 9px 0 0 17px;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(236, 229, 217, 0.42);
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.45);
    }

    .top-actions {
      position: fixed;
      z-index: 4;
      top: max(16px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mood {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 8px;
      border: 1px solid rgba(236, 229, 217, 0.18);
      border-radius: 999px;
      background: rgba(8, 8, 10, 0.36);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--ink-soft);
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
    }

    .mood:hover {
      background: rgba(236, 229, 217, 0.09);
      color: var(--ink);
    }

    .sound {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      background: rgba(8, 8, 10, 0.34);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(236, 229, 217, 0.52);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: lowercase;
      transition: background 0.3s var(--ease), color 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .sound:hover {
      background: rgba(236, 229, 217, 0.09);
      color: var(--ink);
      border-color: rgba(236, 229, 217, 0.3);
    }

    .sound-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(236, 229, 217, 0.25);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      transition: background 0.5s var(--ease), box-shadow 0.5s var(--ease);
    }

    .sound[aria-pressed="true"] .sound-dot {
      background: var(--ink);
      box-shadow: 0 0 9px rgba(236, 229, 217, 0.55);
    }

    .sound:disabled { opacity: 0.35; cursor: default; }

    .mood-dot {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22), 0 1px 5px rgba(0, 0, 0, 0.25);
      transition: background 0.9s var(--ease), transform 0.3s var(--ease);
    }

    .mood:hover .mood-dot { transform: scale(1.08); }

    .mood-name {
      min-width: 25px;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: rgba(236, 229, 217, 0.58);
      text-align: left;
      text-transform: lowercase;
    }

    .hint {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      width: min(92vw, 560px);
      margin: 0;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.13em;
      line-height: 1.7;
      text-align: center;
      color: rgba(236, 229, 217, 0.62);
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.72);
      pointer-events: none;
      transition: opacity 1.4s var(--ease);
    }

    .hint.gone { opacity: 0 !important; }

    body.touch .hint { bottom: max(84px, env(safe-area-inset-bottom)); }
    body.tuning .hint { opacity: 0; }

    .mode {
      position: fixed;
      z-index: 3;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: none;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      background: rgba(8, 8, 10, 0.34);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(236, 229, 217, 0.55);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      pointer-events: none;
      transition: background 0.4s var(--ease), color 0.4s var(--ease), border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }

    body.touch .mode { display: inline-flex; }

    .mode-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(236, 229, 217, 0.3);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      transition: background 0.4s var(--ease), box-shadow 0.4s var(--ease), transform 0.4s var(--ease);
    }

    body.light-mode .mode {
      color: var(--ink);
      border-color: rgba(255, 226, 184, 0.4);
      background: rgba(236, 229, 217, 0.09);
      box-shadow: 0 0 24px rgba(255, 214, 158, 0.12);
    }

    body.light-mode .mode-dot {
      background: #ffe6bd;
      box-shadow: 0 0 11px rgba(255, 220, 170, 0.8);
      transform: scale(1.15);
    }

    .bottom-actions {
      position: fixed;
      z-index: 4;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ride-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(236, 229, 217, 0.25);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      transition: background 0.5s var(--ease), box-shadow 0.5s var(--ease);
    }

    .ride[aria-pressed="true"] {
      color: var(--ink);
      border-color: rgba(150, 190, 150, 0.38);
    }

    .ride[aria-pressed="true"] .ride-dot {
      background: #86b08a;
      box-shadow: 0 0 10px rgba(120, 180, 128, 0.6);
    }

    .sky[aria-pressed="true"] {
      border-color: rgba(170, 190, 230, 0.38);
    }

    .sky[aria-pressed="true"] .ride-dot {
      background: #c9d6f2;
      box-shadow: 0 0 10px rgba(180, 200, 245, 0.65);
    }

    .tune, .ride {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      background: rgba(8, 8, 10, 0.34);
      color: rgba(236, 229, 217, 0.55);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.3s var(--ease), color 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .tune:hover, body.tuning .tune, .ride:hover {
      background: rgba(236, 229, 217, 0.09);
      color: var(--ink);
      border-color: rgba(236, 229, 217, 0.3);
    }

    .panel {
      position: fixed;
      z-index: 5;
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 42px);
      width: min(296px, calc(100vw - 36px));
      padding: 12px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 14px;
      background: rgba(8, 8, 10, 0.82);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--ink-soft);
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: opacity 0.22s var(--ease), transform 0.22s var(--ease), visibility 0.22s;
    }

    body.tuning #panel, body.logging #log {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .panel { max-height: calc(100vh - 90px); overflow-y: auto; }

    .ink-row {
      display: grid;
      grid-template-columns: 42px repeat(3, 28px) minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      margin: 10px 2px;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--ink-dim);
    }

    .ink-row input[type="color"] {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid rgba(236, 229, 217, 0.2);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .ink-preview {
      height: 10px;
      margin-left: 2px;
      border-radius: 999px;
      border: 1px solid rgba(236, 229, 217, 0.12);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 6px;
      color: var(--ink);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .panel-close {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      color: var(--ink-dim);
      font-size: 16px;
      line-height: 1;
    }

    .panel-close:hover { background: rgba(236, 229, 217, 0.08); color: var(--ink); }

    .control {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 36px;
      align-items: center;
      gap: 8px;
      margin: 9px 2px;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--ink-dim);
    }

    .control input[type="range"] {
      width: 100%;
      height: 18px;
      margin: 0;
      accent-color: rgba(236, 229, 217, 0.72);
      cursor: pointer;
    }

    .control output {
      color: var(--ink-soft);
      font-family: var(--mono, ui-monospace, monospace);
      font-size: 10px;
      text-align: right;
    }

    .panel-actions {
      display: flex;
      gap: 7px;
      margin: 12px 2px 2px;
    }

    .panel-actions button {
      flex: 1;
      min-height: 28px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      color: var(--ink-soft);
      font-size: 10px;
      letter-spacing: 0.08em;
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
    }

    .panel-actions button:hover { background: rgba(236, 229, 217, 0.08); color: var(--ink); }

    .panel-hint {
      margin: 8px 2px 0;
      color: rgba(236, 229, 217, 0.56);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .panel-note {
      margin: 9px 2px 0;
      color: rgba(236, 229, 217, 0.32);
      font-size: 9px;
      letter-spacing: 0.05em;
    }

    @media (max-width: 520px) {
      .bottom-actions { right: max(13px, env(safe-area-inset-right)); bottom: max(15px, env(safe-area-inset-bottom)); gap: 6px; }
      .panel {
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        width: auto;
        bottom: calc(max(15px, env(safe-area-inset-bottom)) + 40px);
      }
    }

    .fallback {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: #08080b;
      text-align: center;
      font-family: var(--serif);
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1.25;
    }

    .fallback.is-open { display: grid; }

    .fallback p { max-width: 520px; margin: 0; }

    @media (max-width: 520px) {
      .mark-main { font-size: 21px; }
      .mark small { margin-top: 7px; font-size: 7px; letter-spacing: 0.2em; }
      .top-actions { top: max(13px, env(safe-area-inset-top)); right: max(13px, env(safe-area-inset-right)); gap: 6px; }
      .mood { padding: 6px 9px 6px 6px; gap: 7px; }
      .sound { padding: 6px 8px; gap: 5px; font-size: 8px; }
      .mood-dot { width: 17px; height: 17px; }
      .mood-name { font-size: 8px; }
      .hint { bottom: max(20px, env(safe-area-inset-bottom)); font-size: 9px; letter-spacing: 0.1em; }
    }

    @media (pointer: coarse) {
      .sound, .mood { min-height: 36px; }
      .mode {
        display: inline-flex;
        bottom: max(30px, env(safe-area-inset-bottom));
        min-height: 36px;
        padding: 9px 13px;
      }
      .bottom-actions { bottom: max(30px, env(safe-area-inset-bottom)); }
      .tune, .ride {
        min-height: 36px;
        padding: 9px 13px;
      }
      .panel {
        bottom: calc(max(30px, env(safe-area-inset-bottom)) + 48px);
      }
      .hint { bottom: max(84px, env(safe-area-inset-bottom)); }
    }
    /* The camera (Z): the lens button, the reticle, the shutter flash, the
       card that says what was photographed, and the logbook. */
    :root { --lens: 300px; }

    .mark { transition: opacity 0.6s var(--ease); }
    body.scoping .mark, body.scoping .mode { opacity: 0; }

    .lens-btn {
      position: fixed;
      z-index: 4;
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 44px);
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(236, 229, 217, 0.18);
      border-radius: 50%;
      background: rgba(8, 8, 10, 0.36);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(236, 229, 217, 0.6);
      transition: background 0.3s var(--ease), color 0.3s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease), opacity 0.22s var(--ease);
    }
    .lens-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; }
    .lens-btn:hover { background: rgba(236, 229, 217, 0.09); color: var(--ink); border-color: rgba(236, 229, 217, 0.3); }
    .lens-btn[aria-pressed="true"] {
      color: #ffb4a6;
      border-color: rgba(255, 120, 100, 0.45);
      box-shadow: 0 0 18px rgba(255, 110, 90, 0.18);
    }
    body.tuning .lens-btn, body.logging .lens-btn { opacity: 0; pointer-events: none; }

    .log-pill { display: none; }
    body.scoping .log-pill { display: inline-flex; }

    .scope-ui {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s var(--ease);
    }
    body.scoping .scope-ui { opacity: 1; transition: opacity 0.6s var(--ease) 0.45s; }

    .reticle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--lens) * 2);
      height: calc(var(--lens) * 2);
      transform: translate(-50%, -50%);
      overflow: visible;
    }
    .reticle circle, .reticle path {
      fill: none;
      stroke: rgba(255, 98, 80, 0.62);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .reticle .faint { stroke: rgba(255, 98, 80, 0.32); }

    .flash {
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--lens) * 2);
      height: calc(var(--lens) * 2);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 252, 244, 0.9), rgba(255, 252, 244, 0.35) 70%, transparent 100%);
      opacity: 0;
      will-change: opacity;   /* its own layer from the start, so the first flash costs nothing extra */
    }
    .flash.go { animation: shutter-flash 0.34s ease-out; }
    @keyframes shutter-flash { 0% { opacity: 0; } 10% { opacity: 0.26; } 100% { opacity: 0; } }

    .shot {
      position: fixed;
      z-index: 3;
      left: 50%;
      top: calc(50% + min(var(--lens) * 0.62, 50vh - 70px));
      max-width: calc(100vw - 32px);
      margin: 0;
      padding: 7px 14px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      background: rgba(8, 8, 10, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--ink-soft);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 6px);
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
    }
    .shot.show { opacity: 1; transform: translate(-50%, 0); }
    .shot.hit { color: var(--ink); border-color: rgba(255, 226, 184, 0.4); box-shadow: 0 0 26px rgba(255, 214, 158, 0.14); }
    .shot.creepy { color: #ffb4a6; border-color: rgba(255, 80, 60, 0.45); box-shadow: 0 0 26px rgba(255, 40, 20, 0.18); }
    .shot b { font-weight: 600; letter-spacing: 0.14em; }
    .shot .stars { color: #ffdfa6; letter-spacing: 0.06em; }

    .log-summary { margin: 0 2px 6px; color: var(--ink-dim); font-size: 10px; letter-spacing: 0.05em; }
    .log-summary:empty { display: none; }
    .log-list { list-style: none; margin: 0; padding: 0; }
    .log-list li {
      display: grid;
      grid-template-columns: 14px auto minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      column-gap: 9px;
      align-items: center;
      padding: 7px 2px;
      border-top: 1px solid rgba(236, 229, 217, 0.07);
      font-size: 10px;
      letter-spacing: 0.06em;
    }
    .log-list li:first-child { border-top: 0; }
    .log-list li.log-empty { display: block; color: var(--ink-dim); line-height: 1.6; }
    .log-swatch { grid-row: span 2; width: 12px; height: 12px; border-radius: 50%; }
    .log-name { color: var(--ink); letter-spacing: 0.12em; }
    .log-kind { color: var(--ink-dim); }
    .log-stars { color: #ffdfa6; }
    .log-when { grid-column: 2 / 5; color: rgba(236, 229, 217, 0.34); font-size: 9px; }
    .sw-double { background: linear-gradient(120deg, #ffcf86 0 48%, #9db8ff 52% 100%); box-shadow: 0 0 8px rgba(255, 210, 150, 0.4); }
    .sw-ruby { background: radial-gradient(circle at 40% 35%, #ff9a7a, #c2311e 70%); box-shadow: 0 0 8px rgba(255, 90, 60, 0.45); }
    .sw-sapphire { background: radial-gradient(circle at 40% 35%, #f2f6ff, #8fb2ff 70%); box-shadow: 0 0 8px rgba(150, 185, 255, 0.5); }
    .sw-pulsing { background: radial-gradient(circle at 40% 35%, #fffaf0, #ffe2b0 60%, #a8875a); box-shadow: 0 0 8px rgba(255, 236, 200, 0.45); }
    .sw-cluster { background: radial-gradient(circle at 30% 30%, #fff 0 12%, transparent 14%), radial-gradient(circle at 68% 40%, #ffe7c4 0 11%, transparent 13%), radial-gradient(circle at 45% 72%, #cfe0ff 0 12%, transparent 14%), rgba(236, 229, 217, 0.08); }

    @media (max-width: 520px) {
      .lens-btn { right: max(13px, env(safe-area-inset-right)); bottom: calc(max(15px, env(safe-area-inset-bottom)) + 42px); }
    }
    @media (pointer: coarse) {
      .lens-btn { width: 46px; height: 46px; bottom: calc(max(30px, env(safe-area-inset-bottom)) + 48px); }
      .lens-btn svg { width: 22px; height: 22px; }
    }

    /* The lab (L or ?lab): every parameter, live, with where it lives in the code. */
    .lab {
      --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
      --lab-hit: rgba(230, 196, 138, 0.24);
      --lab-dot: #e6c48a;
      position: fixed;
      z-index: 6;
      left: max(12px, env(safe-area-inset-left));
      top: max(12px, env(safe-area-inset-top));
      bottom: max(12px, env(safe-area-inset-bottom));
      width: min(400px, calc(100vw - 24px));
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 14px;
      background: rgba(8, 8, 10, 0.88);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.5;
      -webkit-user-select: text;
      user-select: text;
      opacity: 0;
      visibility: hidden;
      transform: translateX(-8px);
      transition: opacity 0.22s var(--ease), transform 0.22s var(--ease), visibility 0.22s;
    }
    body.labbing .lab { opacity: 1; visibility: visible; transform: none; }
    .lab-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px 6px 14px;
      color: var(--ink);
      letter-spacing: 0.08em;
    }
    .lab-title { flex: 1; }
    .lab-period { color: var(--ink-dim); font-size: 10px; display: flex; align-items: center; gap: 6px; }
    .lab-period select, .lab-search, .lab-num, .lab-out {
      font: inherit;
      color: var(--ink);
      background: rgba(236, 229, 217, 0.04);
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 7px;
    }
    .lab-period select { font-size: 10px; padding: 2px 4px; }
    .lab-period option { background: #111; }
    .lab-search { margin: 0 12px 8px; padding: 6px 9px; font-size: 11px; }
    .lab-search::placeholder { color: rgba(236, 229, 217, 0.32); }
    .lab-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 10px; }
    .lab-intro { margin: 2px 2px 8px; color: var(--ink-dim); font-size: 10px; }
    .lab-group > summary {
      padding: 10px 2px 4px;
      color: var(--ink);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .lab-gnote { margin: 0 2px 8px; color: var(--ink-dim); font-size: 10px; }
    .lab-card {
      margin: 0 0 8px;
      padding: 9px 10px 8px;
      border: 1px solid rgba(236, 229, 217, 0.10);
      border-radius: 10px;
      background: rgba(236, 229, 217, 0.025);
    }
    .lab-card.changed { border-color: rgba(230, 196, 138, 0.42); }
    .lab-card.sweeping { border-color: rgba(236, 229, 217, 0.5); }
    .lab-top { display: flex; align-items: baseline; gap: 8px; }
    .lab-name { flex: 1; min-width: 0; font-family: var(--mono); font-size: 11px; color: var(--ink); overflow-wrap: anywhere; }
    .lab-tag { font-size: 9px; letter-spacing: 0.08em; color: var(--ink-dim); }
    .lab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lab-dot); visibility: hidden; align-self: center; }
    .lab-card.changed .lab-dot { visibility: visible; }
    .lab-val { font-family: var(--mono); color: var(--ink); }
    .lab-ctl { display: grid; grid-template-columns: minmax(0, 1fr) 68px; gap: 8px; align-items: center; margin-top: 5px; }
    .lab-ctl input[type="range"] { width: 100%; height: 18px; margin: 0; accent-color: rgba(236, 229, 217, 0.72); cursor: pointer; }
    .lab-ctl input[type="color"] { width: 44px; height: 22px; padding: 0; border: 1px solid rgba(236, 229, 217, 0.2); border-radius: 6px; background: transparent; }
    .lab-num { width: 100%; padding: 2px 5px; font-family: var(--mono); font-size: 10px; }
    .lab-btns { display: flex; gap: 5px; margin-top: 6px; }
    .lab-btns button {
      flex: 1;
      min-height: 22px;
      border: 1px solid rgba(236, 229, 217, 0.14);
      border-radius: 999px;
      color: var(--ink-dim);
      font-size: 9px;
      letter-spacing: 0.06em;
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
    }
    .lab-btns button:hover, .lab-btns button.on { background: rgba(236, 229, 217, 0.09); color: var(--ink); }
    .lab-btns button.on { border-color: rgba(236, 229, 217, 0.5); }
    .lab-what { margin: 6px 0 0; color: var(--ink-soft); }
    .lab-warn { margin: 5px 0 0; color: var(--lab-dot); font-size: 10px; }
    .lab-more > summary { margin-top: 5px; color: var(--ink-dim); font-size: 10px; cursor: pointer; }
    .lab-more > summary:hover { color: var(--ink); }
    .lab-k { display: block; margin: 8px 0 2px; color: var(--ink-dim); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; }
    .lab-p { margin: 0; }
    .lab-code {
      display: block;
      margin: 3px 0 0;
      padding: 4px 7px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.32);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--ink-soft);
    }
    .lab-loc { display: block; color: var(--ink-dim); font-size: 9px; letter-spacing: 0.03em; }
    .lab-loc b { color: var(--ink-soft); font-weight: 600; }
    .lab-use { cursor: pointer; }
    .lab-use:hover { background: rgba(236, 229, 217, 0.06); }
    .lab-use.plumb { opacity: 0.55; }
    .lab-ctx { color: rgba(236, 229, 217, 0.4); }
    .lab-ctx.at { color: var(--ink); }
    mark.lab-hit { background: var(--lab-hit); color: var(--ink); border-radius: 3px; padding: 0 1px; }
    .lab-foot { display: flex; gap: 7px; padding: 8px 12px 12px; border-top: 1px solid rgba(236, 229, 217, 0.08); }
    .lab-foot button {
      flex: 1;
      min-height: 28px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      color: var(--ink-soft);
      font-size: 10px;
      letter-spacing: 0.08em;
    }
    .lab-foot button:hover { background: rgba(236, 229, 217, 0.08); color: var(--ink); }
    .lab-out { margin: 0 12px 12px; height: 110px; padding: 6px 8px; font-family: var(--mono); font-size: 10px; resize: vertical; }
    .lab-card[hidden], .lab-group[hidden] { display: none; }
    @media (max-width: 600px) and (min-height: 560px) {
      .lab {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: auto;
        height: 58vh;
        border-radius: 14px 14px 0 0;
        transform: translateY(10px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div class="mark" aria-hidden="true">
    <div class="mark-main"><span class="mark-dot"></span>VoidDrag</div>
    <small>a quiet place for light</small>
  </div>

  <div class="scope-ui" id="scopeUi" aria-hidden="true">
    <div class="flash" id="flash"></div>
    <svg class="reticle" viewBox="-100 -100 200 200" focusable="false">
      <circle id="reticleRing" cx="0" cy="0" r="9.8"></circle>
      <path id="reticleCross" d=""></path>
      <path class="faint" id="reticleTicks" d=""></path>
    </svg>
  </div>
  <p class="shot" id="shot" role="status" aria-live="polite"></p>

  <div class="top-actions">
    <button class="sound log-pill" id="logOpen" type="button" aria-label="the logbook" title="the logbook (G)">
      <span>log</span>
    </button>
    <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="sound: off" title="sound off (S)">
      <span class="sound-dot"></span><span>sound</span>
    </button>
    <button class="mood" id="mood" type="button" aria-label="change the mood" title="change the mood">
      <span class="mood-dot" id="moodDot"></span>
      <span class="mood-name" id="moodName">ash</span>
    </button>
  </div>

  <p class="hint" id="hint">left: part &middot; right: illuminate</p>

  <div class="mode" id="mode" role="status" aria-live="polite" aria-atomic="true" aria-label="brush: dark; double-tap to switch"><span class="mode-dot"></span><span id="modeName">brush &middot; dark</span></div>

  <button class="lens-btn" id="scope" type="button" aria-pressed="false" aria-label="the camera: off" title="the camera (Z)">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7.2"></circle><circle cx="12" cy="12" r="1.6"></circle><path d="M12 1.8v4.2M12 18v4.2M1.8 12H6M18 12h4.2"></path></svg>
  </button>

  <div class="bottom-actions">
    <button class="ride sky" id="sky" type="button" aria-pressed="true" aria-label="the night sky: on" title="the night sky (K)">
      <span class="ride-dot"></span><span>sky</span>
    </button>
    <button class="ride" id="ride" type="button" aria-pressed="true" aria-label="ride beneath the pines: on" title="ride beneath the pines (R)">
      <span class="ride-dot"></span><span>ride</span>
    </button>
    <button class="tune" id="tune" type="button" aria-label="tune the field" aria-expanded="false" title="tune the field">tune</button>
  </div>

  <section class="panel" id="panel" aria-hidden="true" aria-label="tune the field">
    <div class="panel-head"><span>tune</span><button class="panel-close" id="panelClose" type="button" aria-label="close tuning">&times;</button></div>
    <label class="control" title="How wide the brush is."><span>brush</span><input id="brush" type="range" min="0.4" max="1.4" step="0.05" value="1.40"><output id="brushOut">1.40</output></label>
    <label class="control" title="How long a mark persists. Raise it to write a whole word."><span>trail</span><input id="trail" type="range" min="0.3" max="8" step="0.1" value="8.0"><output id="trailOut">8.0</output></label>
    <label class="control" title="How many dust motes are active."><span>particles</span><input id="particles" type="range" min="150" max="1200" step="50" value="1200"><output id="particlesOut">1200</output></label>
    <label class="control" title="How strongly strokes move the dust."><span>velocity</span><input id="velocity" type="range" min="0" max="2.5" step="0.05" value="0.60"><output id="velocityOut">0.60</output></label>
    <label class="control" title="Brightness of the living veil."><span>veil</span><input id="veil" type="range" min="0.3" max="1.6" step="0.05" value="1.00"><output id="veilOut">1.00</output></label>
    <label class="control" title="How fast the pines pass on the ride."><span>pace</span><input id="pace" type="range" min="0.2" max="2.5" step="0.05" value="1.00"><output id="paceOut">1.00</output></label>
    <div class="ink-row" title="Three color stops for the veil, illumination and particles."><span>ink</span><input id="ink0" type="color" value="#4a4848" aria-label="ink low" title="low ink"><input id="ink1" type="color" value="#9b958b" aria-label="ink mid" title="mid ink"><input id="ink2" type="color" value="#e6dccd" aria-label="ink high" title="high ink"><span class="ink-preview" id="inkPreview"></span></div>
    <label class="control" title="Bias the ink ramp toward the low or high stops."><span>curve</span><input id="curve" type="range" min="-1" max="1" step="0.05" value="0.00"><output id="curveOut">0.00</output></label>
    <div class="panel-actions"><button id="pines" type="button" aria-pressed="true" title="pine style: fine needles or the classic silhouette (P)">pines &middot; fine</button><button id="cursor" type="button" aria-pressed="true" title="cursor: the slow moon in the sky, or the classic pearl (B)">cursor &middot; moon</button><button id="labOpen" type="button" title="the lab: every parameter, live, and where it lives in the code (L)">lab</button></div>
    <div class="panel-actions"><button id="still"type="button" title="clear the field">still</button><button id="write" type="button" title="smaller brush, longer trail">write</button><button id="reset" type="button">reset</button><button id="logTune" type="button" title="the stars you have photographed (G)">log</button></div>
    <p class="panel-hint">left &middot; part &nbsp; right &middot; light</p>
    <p class="panel-note">T tune &middot; C still &middot; M mood &middot; S sound &middot; R ride &middot; P pines &middot; K sky &middot; B cursor &middot; Z camera &middot; G log &middot; L lab</p>
  </section>

  <section class="panel logbook" id="log" aria-hidden="true" aria-label="the logbook">
    <div class="panel-head"><span>logbook</span><button class="panel-close" id="logClose" type="button" aria-label="close the logbook">&times;</button></div>
    <p class="log-summary" id="logSummary"></p>
    <ul class="log-list" id="logList"></ul>
  </section>

  <section class="lab" id="lab" aria-hidden="true" aria-label="parameter lab">
    <div class="lab-head">
      <span class="lab-title">lab</span>
      <label class="lab-period" title="How long one sweep takes, min to max and back.">sweep
        <select id="labPeriod"><option value="3">3 s</option><option value="6" selected>6 s</option><option value="12">12 s</option><option value="24">24 s</option></select>
      </label>
      <button class="panel-close" id="labClose" type="button" aria-label="close the lab">&times;</button>
    </div>
    <input class="lab-search" id="labSearch" type="search" placeholder="filter: name, function, idea" aria-label="filter parameters">
    <div class="lab-body" id="labBody"></div>
    <div class="lab-foot">
      <button id="labReset" type="button" title="Put every constant back to its value in the file (tune values have their own reset).">reset constants</button>
      <button id="labCopy" type="button" title="Copy the changed values as code you can paste into VoidDrag.html.">copy changes</button>
      <button id="labSend" type="button" title="Open a GitHub issue with the changed values. When the repository owner files it, the web build takes them as its defaults.">send to web</button>
    </div>
    <textarea class="lab-out" id="labOut" readonly aria-label="changed values" hidden></textarea>
  </section>

  <div class="fallback" id="fallback" role="alert">
    <p>VoidDrag needs WebGL2.<br>Try a recent browser.</p>
  </div>

  <script>
    (function () {
      'use strict';

      var MAX_MARKS = 512;
      var MAX_PARTICLES = 1200;

      var modeChip = document.getElementById('mode');
      var modeName = document.getElementById('modeName');
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var audio = new VoidAudio();
      var tuneButton = document.getElementById('tune');
      var panel = document.getElementById('panel');
      var panelClose = document.getElementById('panelClose');
      var brushInput = document.getElementById('brush');
      var trailInput = document.getElementById('trail');
      var particlesInput = document.getElementById('particles');
      var velocityInput = document.getElementById('velocity');
      var veilInput = document.getElementById('veil');
      var ink0Input = document.getElementById('ink0');
      var ink1Input = document.getElementById('ink1');
      var ink2Input = document.getElementById('ink2');
      var curveInput = document.getElementById('curve');
      var paceInput = document.getElementById('pace');
      var paceOut = document.getElementById('paceOut');
      var rideButton = document.getElementById('ride');
      var ride = false;
      var rideAmount = 0;
      var travel = Math.random() * 40;
      // Pine style: 'fine' (branches, needles, wind, falling needles) or the

      var pinesButton = document.getElementById('pines');

      // Cursor style: 'moon' (a waxing crescent in the sky that trails the

      var QUARRY_RESPAWN = 45;   // scene s after a photograph before that star makes way for a new one

      var resetButton = document.getElementById('reset');

      var TUNE_DEFAULTS = { brush: 1.40, trail: 8.0, particles: 1200, velocity: 0.60, veil: 1.00, ink0: '#4a4848', ink1: '#9b958b', ink2: '#e6dccd', curve: 0.00, pace: 1.00 };
      var settings = {

        trail: TUNE_DEFAULTS.trail,

        velocity: TUNE_DEFAULTS.velocity,

        ink1: TUNE_DEFAULTS.ink1,
        ink2: TUNE_DEFAULTS.ink2,

      if (/web0s|webos|smarttv|smart-tv|tizen|netcast|hbbtv/i.test(navigator.userAgent || '')) settings.particles = 600;

      try {
        var savedTune = JSON.parse(localStorage.getItem('opal.tune') || '{}');
        settings.brush = Math.max(0.4, Math.min(1.4, Number(savedTune.brush) || settings.brush));
        settings.trail = Math.max(0.3, Math.min(8, Number(savedTune.trail) || settings.trail));
        settings.particles = Math.max(150, Math.min(MAX_PARTICLES, Number(savedTune.particles) || settings.particles));

// Smooth cubic B-spline lookup built from four bilinear taps. Plain bilinear
// shows the wind grid as kinks wherever the cloud tears sharply.
vec4 texCubic(sampler2D t, vec2 uv) {

  vec2 p = uv * ts - 0.5;
  vec2 i = floor(p);
  vec2 f = p - i;
  vec2 f2 = f * f;
  vec2 f3 = f2 * f;
  vec2 w0 = (-f3 + 3.0 * f2 - 3.0 * f + 1.0) / 6.0;
  vec2 w1 = (3.0 * f3 - 6.0 * f2 + 4.0) / 6.0;
  vec2 w2 = (-3.0 * f3 + 3.0 * f2 + 3.0 * f + 1.0) / 6.0;
  vec2 w3 = f3 / 6.0;
  vec2 g0 = w0 + w1;
  vec2 g1 = w2 + w3;
  vec2 h0 = (i - 0.5 + w1 / g0) / ts;
  vec2 h1 = (i + 1.5 + w3 / g1) / ts;
  return g0.y * (g0.x * texture(t, h0) + g1.x * texture(t, vec2(h1.x, h0.y)))

float voronoiEdge(vec2 p, float t, float scale, out float cellRand, out float f1, out vec2 featureDir) {

  float d2 = 8.0;
  vec2 id1 = vec2(0.0);
  vec2 nearestR = vec2(0.0);

  for (int y = -1; y <= 1; y++) {

      vec2 g = vec2(float(x), float(y));
      vec2 h = hash22(n + g);

        sin(t * 0.24 + TAU * h.x + (n + g).x * 0.7),
        cos(t * 0.21 + TAU * h.y + (n + g).y * 0.6)

      vec2 r = g + o - f;
      float d = dot(r, r);
      if (d < d1) {
        d2 = d1;
        d1 = d;
        id1 = n + g;
        nearestR = r;
      } else if (d < d2) {
        d2 = d;
      }
    }

  f1 = sqrt(d1) / scale;
  featureDir = normalize(nearestR + 1e-4);

}

float pine(vec2 p, vec2 tip, float h, float hv, float size, float squash, vec2 rock, out float fringe) {

// through a tree branch by branch instead of bending all of it at once.

// tree per pixel inside the outline.
const int PINE_PLANES = 4;

float pineGust(vec2 wp, float t) {

float tierSway(float id, float h, float t) {

  return sin(t * (0.55 + 0.35 * r) + r * TAU);

// with a slower one beneath it, so no two passes look alike. x is the trunk
// and crown; y is the same swing a little later, for branch ends that trail.
vec2 pineRock(float h, float size, float t) {
  float ph = h * TAU;
  float amp = size * (0.030 + 0.014 * fract(h * 5.3));
  float a = 0.72 * sin(t * 0.74 + ph) + 0.28 * sin(t * 0.41 + ph * 1.9 + 1.0);
  float b = 0.72 * sin(t * 0.74 + ph - 0.75) + 0.28 * sin(t * 0.41 + ph * 1.9 + 0.45);
  return vec2(a, b) * amp;
}

// whose drooping lower edge is a branch; needles hang off its rib in
// herringbone tufts and bristle past the outline, and the crown behind is
// dense with a few holes of sky. Wind bends tips and leaves the trunk be:
// offsets grow with distance from the axis, and each tier flutters on its own.
// A tree is several of these planes crossed around its trunk; squash < 1 is a
// plane turned partway edge-on to you. h shapes the whole tree (whorl spacing,
// crown sway), so every plane's tiers ring the trunk at the same heights; hv
// is this plane's own needles, lumps and flutter.
float pineFine(vec2 p, vec2 tip, float h, float hv, float size, float t, float gust, vec2 wdir,

  shade = 0.0;

  // start would leave only a thin spike of crown poking past the tip.

  float id = floor(sf);
  float tf0 = fract(sf);

  // branch never jumps.
  float swA = tierSway(id - 1.0, hv, t);
  float swB = tierSway(id, hv, t);
  float swC = tierSway(id + 1.0, hv, t);

  sw = mix(sw, 0.5 * (swA + swB), 1.0 - smoothstep(0.0, 0.20, tf0));

  x -= (rock.y - rock.x) * rockAt * flex * 0.7 / squash;
  s -= wl.y * bend * 0.6 + sw * flex * 0.0025 * size;

  sp = max(s, 0.0);
  body = size * (0.150 * (1.0 - exp(-sp * 5.0 / size)) + 0.045 * sp);
  sf = s / tierLen + phase;
  id = floor(sf);
  float tf = fract(sf);
  float ax = abs(x);
  float ub = ax / max(body, 1e-4);
  // Across a squashed plane one screen pixel spans more of the tree.
  float px = 1.0 / (min(uRes.x, uRes.y) * sqrt(squash));
  float aa = px * 0.9;

  // Signed depth inside the tier's drooping lower edge, along the trunk.
  float ds = (tf - (ub - 0.40) / 0.60) * tierLen;
  float run = 0.60 * body;
  float slopeFix = run / sqrt(run * run + tierLen * tierLen);

  // The branch rib sits a little inside the outline; needles leave it on both
  // sides, swept toward the branch tip, shorter and thinner toward its end.
  float nl = tierLen * 0.70;
  float across = (ds - nl * 0.55) * slopeFix;
  // Needles are thinner than a pixel on most screens: draw them a crisp pixel
  // wide and let their real width set how dark they are. Two crossing sets,
  // a few missing, so the skirt reads as a brush and not a comb.
  float branchOn = 1.0 - smoothstep(1.02, 1.10, ub);
  float tipShort = 1.0 - 0.45 * smoothstep(0.70, 1.05, ub);
  float needles = 0.0;
  for (int set = 0; set < 2; set++) {
    float fs = float(set);
    float spacing = (0.012 - 0.0025 * fs) * size;
    float sweep = 0.95 - 0.38 * fs;
    float droop = (1.4 + 1.2 * fs) / size;
    float q = (ax - abs(across) * sweep - across * across * droop) / spacing + hv * 13.0 + fs * 0.37;
    float nh = hash21(vec2(floor(q), id * 7.0 + hv * 31.0 + sign(across) + fs * 17.0));
    if (nh < 0.18) continue;
    float lenN = nl * slopeFix * (0.50 + 0.40 * nh) * tipShort * (1.0 - 0.18 * fs);
    float onNeedle = 1.0 - smoothstep(lenN * 0.70, lenN, abs(across));
    float distN = abs(fract(q) - 0.5) * spacing * 0.72;
    float realW = (0.00030 + 0.00022 * size) * (1.0 - 0.6 * clamp(abs(across) / max(lenN, 1e-4), 0.0, 1.0));
    float drawW = max(realW, 0.5 * px);
    needles = max(needles, smoothstep(drawW + aa, drawW - aa * 0.5, distN) * onNeedle
                * clamp(realW / drawW * 1.4, 0.35, 1.0));
  }
  needles *= branchOn;

  float ribReal = (0.0004 + 0.0008 * size) * (1.0 - 0.6 * clamp(ub, 0.0, 1.0));
  float ribW = max(ribReal, 0.5 * px);
  float rib = smoothstep(ribW + aa, ribW - aa * 0.5, abs(across)) * (1.0 - smoothstep(0.92, 1.02, ub))
