          maskCtx.beginPath();
          maskCtx.ellipse(cx, my, rx, ry, 0, 0, Math.PI * 2);
          maskCtx.fill();
        }
        maskCtx.restore();
        maskDirty = true;
      }

      // Gusts queued by drags and taps, handed to the wind field each frame.
      var MAX_GUSTS = 16;
      var gusts = [];
      var gustA = new Float32Array(MAX_GUSTS * 4);
      var gustB = new Float32Array(MAX_GUSTS * 4);

      // How much longer parted cloud stays open: 1 with the pearl, so the moon
      // can be seen against the dark for a few moments after a hard pass.
      function healScale() {
        return 1 + (HEAL_UNDER_MOON - 1) * moonAmount;
      }

      // 1 with the pearl; BRUSH_UNDER_MOON while the moon is the cursor.
      function brushScale() {
        return 1 + (BRUSH_UNDER_MOON - 1) * moonAmount;
      }

      // The moon moves air too: its slow passage pushes the cloud along, and
      // while a finger is down it breathes the cloud back from its face, so a
      // clearing opens around it wherever it comes to rest.
      function moonGusts() {
        if (moonAmount < 0.05 || !sky || !flowOK) return;
        var sp = Math.hypot(moonVel.x, moonVel.y);
        if (sp > 0.015) {
          addGust(pointer.x, pointer.y, moonVel.x * MOON_PUSH, moonVel.y * MOON_PUSH,
            MOON_R * 1.4, 0.55 * moonAmount * Math.min(1, sp / 0.14), 0, moonLane);
          if (time - lastMoonPuff > 0.06) {
            addPuff(pointer.x, pointer.y, moonVel.x * MOON_PUSH * 0.5, moonVel.y * MOON_PUSH * 0.5, MOON_R * 1.6, 0);
            lastMoonPuff = time;
          }
        }
        if (moonGrab && moonPress > 0.05) {
          // The held moon breathes the cloud back from its face in slow swells.
          var swell = 0.80 + 0.20 * Math.sin(time * 1.7 + moonLane * 3.0);
          addGust(pointer.x, pointer.y, 0, 0, MOON_R * 1.8, 0.32 * moonPress * moonAmount * swell, 0.55, moonLane);
          if (time - lastMoonPuff > 0.10) {
            addPuff(pointer.x, pointer.y, 0, 0, MOON_R * 2.2, 0.35 * moonPress);
            lastMoonPuff = time;
          }
        } else if (moonBreath > 0.02) {
          // After a tap or a hold: the lingering breath (MOON_BREATH_*).
          addGust(pointer.x, pointer.y, 0, 0, MOON_R * 1.7, MOON_BREATH_GRIP * moonBreath * moonAmount, 0.45, moonLane);
        }
      }

      // lane: shifts the gust's streamers (see the sim's streamers()), so the
      // splats of one stroke comb the cloud into one consistent set of strands.
      function addGust(x, y, vx, vy, radius, strength, radial, lane) {
        if (gusts.length >= MAX_GUSTS) gusts.shift();
        gusts.push([x, y, radius, strength, vx, vy, radial || 0, lane || 0]);
      }

      // --- Wind brush tuning ------------------------------------------------
      var GUST_TOP = 1.5;        // fastest air a drag can push, scene units/s
      var GUST_KNEE = 1.35;        // drag speed (units/s) at which the push reaches ~63% of GUST_TOP
      var GUST_GRIP_FAST = 0.10;  // fast air grips the cloud less: grip / (1 + this * speed)
      var GUST_BREATH = 0.16;     // how much a fast stroke swells and slackens, per unit of speed (max 0.75)

      // A drag pushes air the way it moves. A slow drag barely stirs the cloud;
      // a faster one pushes harder, but the push levels off and comes in
      // breaths, swelling and slackening along the stroke, scattered a little
      // to either side, so a flick reads as a gust and not as a blade.
      function gustAt(x, y, state) {
        var now = performance.now();
        if (state.gx === undefined) {
          state.gx = x; state.gy = y; state.gt = now; state.gvx = 0; state.gvy = 0;
          state.gseed = Math.random() * 50;
          state.glane = Math.random() * 4;
          state.gpow = 0.80 + Math.random() * 0.30;
          return;
        }
        var dtg = (now - state.gt) / 1000;
        if (dtg < 0.012) return;
        var vx = (x - state.gx) / dtg;
        var vy = (y - state.gy) / dtg;
        var k = Math.min(1, dtg * 18);
        state.gvx += (vx - state.gvx) * k;
        state.gvy += (vy - state.gvy) * k;
        var sp = Math.hypot(state.gvx, state.gvy);
        // The stroke's own path, which draws the dust in and carries it along.
        streamPoint(state, x, y, state.gvx, state.gvy);
        var push = GUST_TOP * (1 - Math.exp(-sp / GUST_KNEE));
        var tt = time + state.gseed;
        var breath = clamp(0.5 + 0.5 * Math.sin(tt * 6.1) * Math.sin(tt * 2.3 + 1.1) + 0.18 * Math.sin(tt * 13.7 + 0.4), 0, 1);
        var gusty = 1 - Math.min(0.75, sp * GUST_BREATH) * (1 - breath);
        // Under the moon the finger's gust works at half strength: half the
        // grip on the air, and a softer push so flicks tear less.
        var bs = brushScale();
        var speed = push * (0.6 + 0.4 * gusty) * (0.4 + 0.6 * bs) * state.gpow;
        var grip = 0.55 * bs * gusty / (1 + GUST_GRIP_FAST * sp);
        // The air leaves a little off the line of the drag.
        var turn = 0.17 * Math.sin(tt * 4.7 + 2.0);
        var ux = sp > 1e-4 ? state.gvx / sp : 0;
        var uy = sp > 1e-4 ? state.gvy / sp : 0;
        var dx = ux * Math.cos(turn) - uy * Math.sin(turn);
        var dy = ux * Math.sin(turn) + uy * Math.cos(turn);
        var r = 0.075 * settings.brush * (0.85 + 0.30 * breath);
        var jit = r * 0.35 * Math.sin(tt * 8.3 + 0.7);
        var gap = Math.hypot(x - state.gx, y - state.gy);
        var steps = Math.min(4, Math.max(1, Math.ceil(gap / (r * 0.8))));
        for (var i = 1; i <= steps; i++) {
          var f = i / steps;
          addGust(state.gx + (x - state.gx) * f - uy * jit, state.gy + (y - state.gy) * f + ux * jit,
            dx * speed, dy * speed, r, grip, 0, state.glane + jit);
        }
        // The dust feels the same air for a moment after the finger has passed.
        if (now - (state.gpuff || 0) > 45) {
          addPuff(x, y, dx * speed, dy * speed, r * 1.5, 0, true);
          state.gpuff = now;
        }
        state.gx = x; state.gy = y; state.gt = now;
      }

      function stepFlow(dt) {
        if (!flowOK || skyAmount <= 0 || dt <= 0) { gusts.length = 0; return; }
        var dims = flowDims();
        if (dims[0] !== flow.w || dims[1] !== flow.h) {
          FLOW_W = dims[0];
          FLOW_H = dims[1];
          flow.rebuild();
        }
        var aspect = canvas.width / Math.max(1, canvas.height);
        var ex = Math.max(1, aspect);
        var ey = Math.max(1, 1 / aspect);
        var n = gusts.length;
        gustA.fill(0);
        gustB.fill(0);
        for (var i = 0; i < n; i++) {
          var g = gusts[i];
          gustA[i * 4] = g[0]; gustA[i * 4 + 1] = g[1]; gustA[i * 4 + 2] = g[2]; gustA[i * 4 + 3] = g[3];
          gustB[i * 4] = g[4]; gustB[i * 4 + 1] = g[5]; gustB[i * 4 + 2] = g[6]; gustB[i * 4 + 3] = g[7];
        }
        gusts.length = 0;
        var relax = settings.trail >= 7.95 ? 1e5 : (1.5 + settings.trail * 3.2) * healScale();
        var sdt = dt * (reduceMotion ? 0.6 : 1);

        function common(pr) {
          var u = pr.u;
          gl.useProgram(pr.p);
          gl.uniform2f(u.uGrid, FLOW_W, FLOW_H);
          gl.uniform2f(u.uExt, ex, ey);
          gl.uniform1f(u.uDt, sdt);
          gl.uniform1f(u.uTime, time);
          gl.uniform1f(u.uDrift, drift);
          gl.uniform4fv(u.uSplatA, gustA);
          gl.uniform4fv(u.uSplatB, gustB);
          gl.uniform1i(u.uSplats, n);
          gl.uniform4fv(u.uLights, lightData);
          return u;
        }

        var a = flow.cur;
        var b = 1 - a;
        gl.viewport(0, 0, FLOW_W, FLOW_H);

        var u = common(flow.vel);
        gl.bindFramebuffer(gl.FRAMEBUFFER, flow.v[b].fb);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, flow.v[a].tex);
        gl.uniform1i(u.uVel, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        u = common(flow.map);
        gl.bindFramebuffer(gl.FRAMEBUFFER, flow.m[b].fb);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, flow.v[b].tex);
        gl.uniform1i(u.uVel, 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, flow.m[a].tex);
        gl.uniform1i(u.uMap, 1);
        gl.uniform1f(u.uRelax, relax);
        gl.uniform4f(u.uMoonZone, pointer.x, pointer.y, MOON_CLEAR_REACH,
          sky && moonMode ? (MOON_CLEAR_HOLD - 1) * moonAmount : 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        u = common(flow.view);
        gl.bindFramebuffer(gl.FRAMEBUFFER, flow.sky.fb);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, flow.m[b].tex);
        gl.uniform1i(u.uMap, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        flow.cur = b;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.activeTexture(gl.TEXTURE0);
      }

      // Under the sky, parted cloud closes back over by itself. Trail sets how
      // long that takes (about 8 s at the default); the top of the slider still
      // keeps the opening. The fade is applied in steps of a quarter second so
      // each step is large enough to survive the 8-bit canvas.
      function healSky(dt) {
        if (settings.trail >= 7.95) return;
        skyHealAcc += dt;
        if (skyHealAcc < 0.25) return;
        var life = (1.5 + settings.trail * 3.2) * healScale();
        var a = 1 - Math.exp(-skyHealAcc / life);
        skyHealAcc = 0;
        maskCtx.save();
        maskCtx.globalCompositeOperation = 'destination-out';
        maskCtx.fillStyle = 'rgba(0,0,0,' + a + ')';
        maskCtx.fillRect(0, 0, MASK_W, MASK_H);
        maskCtx.restore();
        maskDirty = true;
      }

      function fadeMask(dt) {
        if (!maskCtx) return;
        if (sky) { healSky(dt); return; }
        if (settings.trail >= 7.95) return;
        var life = Math.max(1.5, settings.trail * 16);
        var a = 1 - Math.exp(-dt / life);
        maskCtx.save();
        maskCtx.globalCompositeOperation = 'destination-out';
        maskCtx.fillStyle = 'rgba(0,0,0,' + a + ')';
        maskCtx.fillRect(0, 0, MASK_W, MASK_H);
        maskCtx.restore();
        maskDirty = true;
      }

      function clearMask() {
        if (maskCtx) maskCtx.clearRect(0, 0, MASK_W, MASK_H);
        maskDirty = true;
      }

      function initMaskTexture() {
        maskTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, maskTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
        maskDirty = false;
      }

      function uploadMask() {
        if (!maskTexture || !maskDirty) return;
        gl.bindTexture(gl.TEXTURE_2D, maskTexture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
        maskDirty = false;
      }

      function addMark(x, y, radius, life, strength, grow, vx, vy) {
        if (marks.length >= MAX_MARKS) marks.shift();
        radius *= settings.brush;
        strength *= brushScale();
        if (!(sky && flowOK)) stampMask(x, y, radius * 1.4, strength * 0.88, false);
        life = Math.max(1, life * settings.trail);
        marks.push({
          x: x,
          y: y,
          r: radius,
          rNow: radius,
          born: time,
          life: life,
          strength: strength,
          grow: grow,
          vx: vx || 0,
          vy: vy || 0,
          opacity: 0
        });
      }

      // atMoon: a tap on the moon. Its shockwave runs MOON_SHOCK_REACH times
      // as far, and the puff it blows through the cloud is as much wider.
      function bloom(x, y, atMoon) {
        var reach = atMoon ? MOON_SHOCK_REACH : 1;
        if (atMoon) {
          moonBreathLife = Math.max(MOON_BREATH_LIFE, moonBreath > 0.3 ? moonBreathLife : 0);
          moonBreath = 1;
        }
        var base = Math.random() * Math.PI * 2;
        for (var i = 0; i < 3; i++) {
          var a = base + i * (Math.PI * 2 / 3) + (Math.random() - 0.5) * 0.5;
          var off = 0.040 + Math.random() * 0.045;
          var speed = 0.008 + Math.random() * 0.010;
          addMark(
            x + Math.cos(a) * off,
            y + Math.sin(a) * off,
            0.170 + Math.random() * 0.075,
            22 + Math.random() * 7,
            0.9,
            0.38,
            Math.cos(a) * speed,
            Math.sin(a) * speed
          );
        }
        addMark(x, y, 0.145, 26, 0.95, 0.18);
        if (sky && flowOK) addGust(x, y, 0, 0, 0.11 * settings.brush * reach, 0.9 * brushScale(), 1.5, Math.random() * 4);
        addPuff(x, y, 0, 0, 0.14 * settings.brush * reach, 0.9, true);
        addShock(x, y, 0.95, reach);
        burstParticles(x, y, 26, 1.0);
        impulseParticles(x, y, 0.55 * reach, 0.6);
        audio.aperture('dark', scenePan(x), 0.95);
      }

      function paintAt(x, y, force, pointerState) {
        var lp = pointerState ? pointerState.lastPaint : lastPaint;
        var lpa = pointerState ? pointerState.lastPaintAt : lastPaintAt;
        var dist = lp ? Math.hypot(x - lp.x, y - lp.y) : 1;
        if (!force && dist < 0.028 && time - lpa < 0.06) return;
        addMark(
          x + (Math.random() - 0.5) * 0.010,
          y + (Math.random() - 0.5) * 0.010,
          0.100 + Math.random() * 0.050,
          16 + Math.random() * 6,
          0.8,
          0.12
        );
        if (pointerState) {
          pointerState.lastPaint = { x: x, y: y };
          pointerState.lastPaintAt = time;
        } else {
          lastPaint = { x: x, y: y };
          lastPaintAt = time;
        }
        if (time - lastShockAt > 0.10) {
          addShock(x, y, 0.42);
          lastShockAt = time;
        }
      }


      function addLight(x, y, radius, life, strength, grow) {
        if (lights.length >= MAX_LIGHTS) lights.shift();
        lights.push({
          x: x,
          y: y,
          r: Math.max(0.03, radius * settings.brush),
          rNow: Math.max(0.03, radius * settings.brush),
          born: time,
          life: Math.max(1, life),
          strength: strength,
          grow: grow,
          opacity: 0
        });
      }

      function updateLights(dt) {
        for (var i = lights.length - 1; i >= 0; i--) {
          var l = lights[i];
          var age = time - l.born;
          if (age > l.life) {
            lights.splice(i, 1);
            continue;
          }
          l.rNow = l.r * (1.0 + l.grow * (1.0 - Math.exp(-age * 1.1)));
          l.opacity = smoothstep(0, 0.35, age) * (1 - smoothstep(l.life - 1.2, l.life, age)) * l.strength;
        }
      }

      function uploadLights() {
        lightData.fill(0);
        for (var i = 0; i < lights.length && i < MAX_LIGHTS; i++) {
          var l = lights[i];
          lightData[i * 4] = l.x;
          lightData[i * 4 + 1] = l.y;
          lightData[i * 4 + 2] = l.rNow;
          lightData[i * 4 + 3] = l.opacity;
        }
      }

      function addAttractor(x, y, strength) {
        if (attractors.length >= MAX_ATTRACTORS) attractors.shift();
        attractors.push({ x: x, y: y, born: time, strength: strength });
      }

      function updateAttractors() {
        for (var i = attractors.length - 1; i >= 0; i--) {
          if (time - attractors[i].born > 2.4) attractors.splice(i, 1);
        }
      }

      // Dust is simulated in scene units (x: +-viewExt().x, y: +-viewExt().y) so every force is
      // round on any screen; positions stay in 0..1 for the point shader.
      function recruitParticle() {
        // Borrow a quiet mote rather than one that is visibly busy, and fade it
        // in so nothing pops.
        var best = particles[(Math.random() * activeParticles) | 0];
        for (var t = 0; t < 2; t++) {
          var c = particles[(Math.random() * activeParticles) | 0];
          if (c.flash + c.energy < best.flash + best.energy) best = c;
        }
        // Out-of-focus motes stay where they are: a burst is close at hand.
        for (var tries = 0; best.blur > 0 && tries < 6; tries++) best = particles[(Math.random() * activeParticles) | 0];
        best.fade = 0;
        best.sink = 0;
        best.steer = 0;
        return best;
      }

      // A sinking mote's spark over its sink (0..1): a quick flare, a slow fade.
      function sinkEnv(s) {
        return s < 0.12 ? s / 0.12 : Math.pow(1 - (s - 0.12) / 0.88, 1.5);
      }

      // A mote the moon took in comes back from upwind, just out of sight:
      // from the left under the sky's drift, from the top on the ride.
      function respawnMote(p) {
        if (rideAmount > 0.5) { p.x = Math.random(); p.y = 1.06; }
        else { p.x = -0.06; p.y = Math.random(); }
        p.vx = 0;
        p.vy = 0;
        p.sink = 0;
        p.steer = 0;
        p.flash = 0;
        p.energy = 0;
        p.fade = 0;
      }

      function pullParticles(x, y, count, force) {
        if (!activeParticles) return;
        var ext = viewExt();
        var vscale = settings.velocity;
        for (var i = 0; i < count; i++) {
          var p = recruitParticle();
          var a = Math.random() * Math.PI * 2;
          var rad = 0.20 + Math.random() * 0.40;
          p.x = (x + Math.cos(a) * rad) / (2.0 * ext.x) + 0.5;
          p.y = (y + Math.sin(a) * rad) / (2.0 * ext.y) + 0.5;
          var inward = (0.05 + Math.random() * 0.12) * force * vscale;
          p.vx = -Math.cos(a) * inward - Math.sin(a) * inward * 0.5;
          p.vy = -Math.sin(a) * inward + Math.cos(a) * inward * 0.5;
          p.energy = (0.5 + Math.random() * 0.5) * force;
          p.flash = (0.6 + Math.random() * 0.6) * force;
          p.size = 0.0026 + Math.random() * 0.0060;
        }
        audio.dust(scenePan(x), force * 0.8, true);
      }

      // A single soft puff: nearby dust is nudged outward once and then eases
      // to rest under drag, instead of being shoved for as long as a ripple lasts.
      function impulseParticles(x, y, radius, strength) {
        var ext = viewExt();
        var vscale = settings.velocity;
        if (!vscale) return;
        for (var i = 0; i < activeParticles; i++) {
          var p = particles[i];
          var dx = (p.x - 0.5) * 2.0 * ext.x - x;
          var dy = (p.y - 0.5) * 2.0 * ext.y - y;
          var d = Math.hypot(dx, dy);
          if (d > radius) continue;
          var w = 1 - d / radius;
          w = w * w * strength * vscale;
          var inv = 1 / (d + 0.0001);
          p.vx += (dx * inv - dy * inv * 0.22) * w;
          p.vy += (dy * inv + dx * inv * 0.22) * w;
          p.flash = Math.max(p.flash, w * 1.2);
        }
      }


      function eraseMarksAt(x, y, radius, power) {
        stampMask(x, y, radius, power * 0.9, true);
        for (var i = marks.length - 1; i >= 0; i--) {
          var m = marks[i];
          var d = Math.hypot(m.x - x, m.y - y);
          if (d > radius) continue;
          var falloff = 1 - d / radius;
          m.strength *= Math.max(0, 1 - power * falloff);
          if (m.strength < 0.035) marks.splice(i, 1);
        }
      }

      function lightBloom(x, y) {
        eraseMarksAt(x, y, Math.max(0.14, 0.22 * settings.brush), 0.96);
        addLight(x, y, 0.270, 6.0, 1.0, 0.30);
        addLight(x, y, 0.140, 8.0, 0.82, 0.50);
        addAttractor(x, y, 1.9);
        pullParticles(x, y, 60, 1.0);
        lastLight = { x: x, y: y };
        lastLightAt = time;
        audio.aperture('light', scenePan(x), 0.9);
        audio.dust(scenePan(x), 1.0, true);
      }

      function paintLightAt(x, y, pointerState) {
        var lp = pointerState ? pointerState.lastLight : lastLight;
        var lpa = pointerState ? pointerState.lastLightAt : lastLightAt;
        var dist = lp ? Math.hypot(x - lp.x, y - lp.y) : 1;
        if (dist < 0.026 && time - lpa < 0.06) return;
        eraseMarksAt(x, y, Math.max(0.10, 0.14 * settings.brush), 0.78);
        addLight(x + (Math.random() - 0.5) * 0.010, y + (Math.random() - 0.5) * 0.010, 0.125 + Math.random() * 0.055, 4.4, 0.78, 0.12);
        if (time - lpa > 0.10) {
          addAttractor(x, y, 0.62);
          pullParticles(x, y, 4, 0.48);
        }
        if (pointerState) {
          pointerState.lastLight = { x: x, y: y };
          pointerState.lastLightAt = time;
        } else {
          lastLight = { x: x, y: y };
          lastLightAt = time;
        }
      }

      function updateAudio(dt) {
        if (!audio.enabled) return;
        var aspect = canvas.width / Math.max(1, canvas.height);
        var dark = 0;
        var light = 0;
        for (var i = 0; i < marks.length; i++) {
          var s = marks[i];
          var dx = pointer.x - s.x;
          var dy = pointer.y - s.y;
          var rr = Math.max(0.03, s.rNow);
          dark += s.opacity * Math.exp(-(dx * dx + dy * dy) / (rr * rr * 2.2));
        }
        for (var j = 0; j < lights.length; j++) {
          var l = lights[j];
          var lx = pointer.x - l.x;
          var ly = pointer.y - l.y;
          var lr = Math.max(0.03, l.rNow);
          light += l.opacity * Math.exp(-(lx * lx + ly * ly) / (lr * lr * 2.2));
        }
        dark = 1 - Math.exp(-dark * 1.7);
        light = 1 - Math.exp(-light * 1.7);
        var speed = clamp(Math.hypot(pointerVel.x, pointerVel.y) / 1.4, 0, 1);
        var panX = pointer.x;
        // Under the moon the breeze follows the finger, not the slow moon.
        if (moonMode && down) {
          speed = clamp(Math.hypot(down.stirVx || 0, down.stirVy || 0) / 1.6, 0, 1);
          panX = down.x;
        }
        audio.update(dt, {
          speed: speed,
          press: press,
          dark: dark,
          light: light,
          active: down !== null,
          painting: painting,
          mode: down ? down.kind : 'dark',
          pan: clamp(panX / Math.max(0.001, aspect), -1, 1)
        });
      }

      function updateMarks(dt) {
        for (var i = marks.length - 1; i >= 0; i--) {
          var s = marks[i];
          var age = time - s.born;
          if (age > s.life) {
            marks.splice(i, 1);
            continue;
          }
          var f = flowAt(s.x, s.y, time);
          s.vx *= Math.pow(0.985, dt * 60);
          s.vy *= Math.pow(0.985, dt * 60);
          s.x += (f.x * 0.022 + s.vx) * dt;
          s.y += (f.y * 0.022 + s.vy) * dt;
          s.rNow = s.r * (1.0 + s.grow * (1.0 - Math.exp(-age * 1.2)));
          s.opacity = smoothstep(0, 1.2, age) * (1 - smoothstep(s.life - 5, s.life, age)) * s.strength;
        }
      }

      function uploadMarks() {
        markData.fill(0);
        var n = Math.min(marks.length, MAX_MARKS);
        for (var i = 0; i < n; i++) {
          var s = marks[i];
          markData[i * 4] = s.x;
          markData[i * 4 + 1] = s.y;
          markData[i * 4 + 2] = s.rNow;
          markData[i * 4 + 3] = s.opacity;
        }
        gl.uniform4fv(uniforms.marks, markData);
      }


      // reach > 1 marks a moon shock: it travels reach times as far and fades
      // with a quadratic s-curve over its whole run instead of the quick
      // exponential decay of an ordinary ripple.
      var MOON_SHOCK_REACH = 2.5;
      var SHOCK_LIFE = 2.2;
      function addShock(x, y, strength, reach) {
        shocks.push({ x: x, y: y, born: time, strength: strength, reach: reach || 1 });
        if (shocks.length > MAX_SHOCKS) shocks.shift();
      }

      // 1 at the start of a moon shock's run, 0 at its end: ease-in-out quad.
      function moonShockFade(age, reach) {
        var u = clamp(age / (SHOCK_LIFE * reach), 0, 1);
        var e = u < 0.5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u);
        return 1 - e;
      }

      function updateShocks() {
        shockData.fill(0);
        for (var i = shocks.length - 1; i >= 0; i--) {
          var s = shocks[i];
          var age = time - s.born;
          if (age > SHOCK_LIFE * s.reach) {
            shocks.splice(i, 1);
            continue;
          }
          if (i < MAX_SHOCKS) {
            shockData[i * 4] = s.x;
            shockData[i * 4 + 1] = s.y;
            shockData[i * 4 + 2] = age;
            // The shader reads a negative strength as a moon shock.
            shockData[i * 4 + 3] = s.reach > 1 ? -s.strength : s.strength;
          }
        }
      }


      // --- A rare flyer -----------------------------------------------------
      // Now and then a bat flits across the sky under the cloud, sometimes two
      // together, or an owl glides over: the first after a minute or so of
      // scene time, then one every few minutes, and only under the sky. Half
      // of them pass close by the moon. Key F sends one over at once.
      var FLY_FIRST = [45, 100];    // scene seconds before the first one
      var FLY_EVERY = [40, 85];   // and between later ones
      var flyers = [];
      var nextFlyAt = time + FLY_FIRST[0] + Math.random() * (FLY_FIRST[1] - FLY_FIRST[0]);
      var flyData = new Float32Array(8);
      var flyDataB = new Float32Array(8);

      function launchFlyers(kind) {
        var bat = (kind || (Math.random() < 0.65 ? 'bat' : 'owl')) === 'bat';
        var cw = Math.max(1, canvas.width);
        var ch = Math.max(1, canvas.height);
        var ex = cw / Math.min(cw, ch);
        var ey = ch / Math.min(cw, ch);
        var span = bat ? 0.085 + Math.random() * 0.035 : 0.17 + Math.random() * 0.06;
        // In beyond one edge, out beyond the other, through a point in view.
        var margin = span * 0.8 + 0.05;
        var flip = Math.random() < 0.5 ? -1 : 1;
        var p0, p2;
        if (Math.random() < 0.72) {
          p0 = { x: -flip * (ex + margin), y: (Math.random() * 1.4 - 0.7) * ey };
          p2 = { x: flip * (ex + margin), y: (Math.random() * 1.4 - 0.7) * ey };
        } else {
          p0 = { x: (Math.random() * 1.4 - 0.7) * ex, y: -flip * (ey + margin) };
          p2 = { x: (Math.random() * 1.4 - 0.7) * ex, y: flip * (ey + margin) };
        }
        var mid = moonMode && Math.random() < 0.5
          ? { x: pointer.x + (Math.random() - 0.5) * 0.30, y: pointer.y + (Math.random() - 0.5) * 0.30 }
          : { x: (Math.random() * 1.2 - 0.6) * ex, y: (Math.random() * 1.2 - 0.6) * ey };
        // A quadratic curve that passes through mid halfway along.
        var c = { x: 2 * mid.x - 0.5 * (p0.x + p2.x), y: 2 * mid.y - 0.5 * (p0.y + p2.y) };
        var speed = bat ? 0.60 + Math.random() * 0.30 : 0.42 + Math.random() * 0.14;
        var dur = (Math.hypot(c.x - p0.x, c.y - p0.y) + Math.hypot(p2.x - c.x, p2.y - c.y)) * 0.9 / speed;
        var count = bat && Math.random() < 0.3 ? 2 : 1;
        flyers.length = 0;
        for (var i = 0; i < count; i++) {
          flyers.push({
            bat: bat, p0: p0, c: c, p2: p2, dur: dur,
            t0: time + i * (0.25 + Math.random() * 0.35),
            span: span * (i ? 0.85 + Math.random() * 0.2 : 1),
            off: i ? (Math.random() < 0.5 ? -1 : 1) * (0.05 + Math.random() * 0.06) : 0,
            seed: Math.random() * 50,
            phase: Math.random() * Math.PI * 2,
            env: 1, gliding: false, glideT: 0.8 + Math.random() * 0.6
          });
        }
      }

      function flyerAt(f, age) {
        var u = clamp(age / f.dur, 0, 1);
        // A bat darts: its speed comes and goes, and it jinks from side to side.
        if (f.bat) u = clamp(u + 0.013 * Math.sin(age * 8.2 + f.seed), 0, 1);
        var a = 1 - u;
        var x = a * a * f.p0.x + 2 * a * u * f.c.x + u * u * f.p2.x;
        var y = a * a * f.p0.y + 2 * a * u * f.c.y + u * u * f.p2.y;
        var tx = 2 * a * (f.c.x - f.p0.x) + 2 * u * (f.p2.x - f.c.x);
        var ty = 2 * a * (f.c.y - f.p0.y) + 2 * u * (f.p2.y - f.c.y);
        var tl = Math.hypot(tx, ty) || 1;
        var side = f.off + (f.bat
          ? 0.034 * Math.sin(age * 6.9 + f.seed) + 0.012 * Math.sin(age * 17.0 + f.seed * 2.3)
          : 0.012 * Math.sin(age * 1.3 + f.seed));
        return { x: x - ty / tl * side, y: y + tx / tl * side };
      }

      function updateFlyers(dt) {
        if (!flyers.length && time > nextFlyAt) {
          if (sky && skyAmount > 0.95 && !reduceMotion && !stillMode) launchFlyers();
          nextFlyAt = time + FLY_EVERY[0] + Math.random() * (FLY_EVERY[1] - FLY_EVERY[0]);
        }
        flyData.fill(0);
        flyDataB.fill(0);
        var slot = 0;
        for (var i = flyers.length - 1; i >= 0; i--) {
          var f = flyers[i];
          var age = time - f.t0;
          if (age >= f.dur) { flyers.splice(i, 1); continue; }
          if (age < 0 || slot > 1) continue;
          var pos = flyerAt(f, age);
          var prev = flyerAt(f, Math.max(0, age - 0.05));
          var stroke;
          if (f.bat) {
            f.phase += dt * Math.PI * 2 * (7.0 + 1.2 * Math.sin(age * 2.1 + f.seed));
            stroke = Math.sin(f.phase);
          } else {
            // An owl beats a few times, then glides on spread wings.
            f.glideT -= dt;
            if (f.glideT <= 0) {
              f.gliding = !f.gliding;
              f.glideT = f.gliding ? 0.8 + Math.random() * 0.8 : 0.9 + Math.random() * 0.6;
            }
            f.env += ((f.gliding ? 0 : 1) - f.env) * Math.min(1, dt * 5);
            f.phase += dt * Math.PI * 2 * 2.4;
            stroke = Math.sin(f.phase) * f.env + 0.8 * (1 - f.env);
          }
          var u = age / f.dur;
          // The body turns after its line of flight, a beat behind it.
          var head = Math.atan2(pos.y - prev.y, pos.x - prev.x);
          if (f.heading === undefined || age < 0.1) f.heading = head;
          f.heading += Math.atan2(Math.sin(head - f.heading), Math.cos(head - f.heading)) * Math.min(1, dt * 9);
          flyData[slot * 4] = pos.x;
          flyData[slot * 4 + 1] = pos.y;
          flyData[slot * 4 + 2] = f.heading;
          flyData[slot * 4 + 3] = f.span;
          flyDataB[slot * 4] = stroke;
          flyDataB[slot * 4 + 1] = f.bat ? 0 : 1;
          flyDataB[slot * 4 + 2] = smoothstep(0, 0.03, u) * (1 - smoothstep(0.97, 1, u));
          slot++;
        }
      }

      function burstParticles(x, y, count, force) {
        if (!activeParticles) return;
        var ext = viewExt();
        for (var i = 0; i < count; i++) {
          var p = recruitParticle();
          var a = Math.random() * Math.PI * 2;
          var rad = 0.08 + Math.random() * 0.22;
          p.x = (x + Math.cos(a) * rad) / (2.0 * ext.x) + 0.5;
          p.y = (y + Math.sin(a) * rad) / (2.0 * ext.y) + 0.5;
          var sp = (0.06 + Math.random() * 0.22) * force * settings.velocity;
          var turn = (Math.random() - 0.5) * 0.6;
          p.vx = (Math.cos(a) - Math.sin(a) * turn) * sp;
          p.vy = (Math.sin(a) + Math.cos(a) * turn) * sp;
          p.energy = (0.9 + Math.random() * 0.9) * force;
          p.flash = (1.1 + Math.random() * 0.8) * force;
          p.size = 0.0030 + Math.random() * 0.0060;
        }
        audio.dust(scenePan(x), force, false);
      }

      function initParticles() {
        particles.length = 0;
        for (var i = 0; i < MAX_PARTICLES; i++) {
          // Under the sky each mote also has a depth: most are far pinpricks,
          // a few are near enough to be soft, out-of-focus discs.
          var nearMote = Math.random() < MOTE_NEAR_SHARE;
          particles.push({
            x: Math.random(),
            y: Math.random(),
            vx: 0,
            vy: 0,
            size: 0.0020 + Math.random() * 0.0050,
            base: 0.060 + Math.random() * 0.135,
            phase: Math.random() * Math.PI * 2,
            energy: 0,
            flash: 0,
            fade: 1,
            bright: 0.08,
            dark: 0,
            depth: nearMote ? Math.random() * 0.15 : 0.30 + 0.70 * Math.pow(Math.random(), 0.8),
            blur: nearMote ? 1 : 0,
            lum: Math.random(),
            tw: 0.35 + Math.random() * 1.30,
            flake: Math.random() < 0.35 ? 0.6 + Math.random() * 0.4 : 0,
            glintRate: 0.025 + Math.random() * 0.060,
            glintPhase: Math.random(),
            lit: 0,
            steer: 0,     // until this time it counts as dust you blew
            sink: 0,      // 0..1 while it sinks into the moon
            sinkA: 0      // where on the rim, as an angle from the moon's centre
          });
        }
      }

      // --- Night motes (under the sky) -------------------------------------
      // Dust and pollen hanging in the air between you and the cloud. They
      // ride the wind: the steady drift (nearer motes cross the view faster),
      // the brush's gusts for a moment after the finger has passed, the moon's
      // passage and its held breath. They shimmer as they turn, flakes now and
      // then catch a glint, and seen near the moon they light up silver.
      var MOTE_BRIGHT = 0.1;       // brightness of a resting mote
      var MOTE_MOON = 0.7;         // extra light on motes seen near the moon
      var MOTE_MOON_REACH = 0.32;   // scene units past the disc over which that falls off
      var MOTE_GLINT = 0.3;        // brightness of a flake's brief glint
      var MOTE_WIND = 0.055;        // drift of the farthest motes, units/s; the nearest go ~4x as fast
      var MOTE_CARRY = 0.32;        // share of a gust's speed the dust picks up
      var puffs = [];               // the air a gust leaves moving, felt by the dust
      var MAX_PUFFS = 40;
      var PUFF_LIFE = 2.2;

      // user: the air came from your brush (not the moon's own passage), so
      // the dust it moves can feed the moon.
      function addPuff(x, y, vx, vy, r, radial, user) {
        if (puffs.length >= MAX_PUFFS) puffs.shift();
        puffs.push({ x: x, y: y, vx: vx, vy: vy, r: r, rNow: r, radial: radial || 0, born: time, w: 1, user: !!user });
      }

      function updatePuffs(dt) {
        for (var i = puffs.length - 1; i >= 0; i--) {
          var pf = puffs[i];
          var age = time - pf.born;
          if (age > PUFF_LIFE) { puffs.splice(i, 1); continue; }
          pf.w = Math.exp(-age / 0.6);
          // The air carries on a little way, spreading as it slows.
          pf.x += pf.vx * 0.35 * pf.w * dt;
          pf.y += pf.vy * 0.35 * pf.w * dt;
          pf.rNow = pf.r * (1.0 + age * 0.8);
        }
      }

      // --- The brush's path (under the sky) --------------------------------
      // A wind stroke leaves a channel of moving air along the line it was
      // drawn. Dust near the channel is sucked in, and dust inside it is
      // carried along it from where the stroke began toward where it ended,
      // following its bends. Each sample keeps the path's direction there.
      // Widths are in brush radii (0.075 * brush, the gust's own radius).
      var STREAM_LIFE = 2.2;       // seconds a stretch of path keeps working; it fades over the last 60%
      var STREAM_CORE = 1.6;       // channel half-width, in brush radii
      var STREAM_REACH = 10.8;      // suction reach from the path's centre line, in brush radii
      var STREAM_SUCK = 1.95;       // pull toward the channel at its edge, units/s²
      var STREAM_GRIP = 1.5;       // how fast dust in the channel takes up its flow, 1/s
      var STREAM_FLOW_MIN = 0.08;  // flow along a slowly drawn path, units/s
      var STREAM_FLOW_MAX = 1.15;  // the flow never goes faster than this
      var STREAM_CARRY = 0.30;     // share of the drag speed added to the flow
      var STREAM_STEP = 0.5;       // one sample per this many brush radii of path
      var STREAM_CHUNK = 12;       // segments per bounding box, for the dust's quick reject
      var MAX_STREAMS = 12;
      var MAX_STREAM_PTS = 200;    // per stroke
      var streams = [];

      function streamPoint(state, x, y, vx, vy) {
        var r = 0.075 * settings.brush;
        var s = state.stream;
        if (!s || streams.indexOf(s) < 0) {
          if (streams.length >= MAX_STREAMS) streams.shift();
          s = { state: state, pts: [], boxes: [], live: true };
          streams.push(s);
          state.stream = s;
        }
        var pts = s.pts;
        var sp = Math.hypot(vx, vy);
        var lastP = pts[pts.length - 1];
        var tx, ty;
        if (lastP) {
          var dx = x - lastP.x;
          var dy = y - lastP.y;
          var d = Math.hypot(dx, dy);
          if (d < r * STREAM_STEP) return;
          tx = dx / d;
          ty = dy / d;
          // The previous sample now has a way in and a way out: average them,
          // so the flow turns smoothly through a bend.
          if (pts.length > 1) {
            var bx = lastP.tx + tx;
            var by = lastP.ty + ty;
            var bl = Math.hypot(bx, by);
            if (bl > 1e-4) { lastP.tx = bx / bl; lastP.ty = by / bl; }
          } else {
            lastP.tx = tx;
            lastP.ty = ty;
          }
        } else {
          if (sp < 1e-4) return;
          tx = vx / sp;
          ty = vy / sp;
        }
        pts.push({ x: x, y: y, tx: tx, ty: ty, sp: sp, born: time });
        if (pts.length > MAX_STREAM_PTS) pts.shift();
      }

      function updateStreams(dt) {
        if (skyAmount <= 0) { streams.length = 0; return; }
        // The channel drifts with the cloud it was cut through.
        var wind = dt * SKY_WIND * skyAmount * (reduceMotion ? 0.35 : 1);
        var reach = 0.075 * settings.brush * STREAM_REACH;
        for (var i = streams.length - 1; i >= 0; i--) {
          var s = streams[i];
          var pts = s.pts;
          while (pts.length && time - pts[0].born > STREAM_LIFE) pts.shift();
          s.live = active.get(s.state.id) === s.state;
          s.boxes.length = 0;
          if (!pts.length) {
            if (!s.live) streams.splice(i, 1);
            continue;
          }
          for (var k = 0; k < pts.length; k++) pts[k].x += wind;
          // Boxes over runs of STREAM_CHUNK segments; neighbours share an end.
          for (var c = 0; c < pts.length; c += STREAM_CHUNK) {
            var end = Math.min(pts.length - 1, c + STREAM_CHUNK);
            var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
            for (var m = c; m <= end; m++) {
              var pt = pts[m];
              if (pt.x < x0) x0 = pt.x;
              if (pt.x > x1) x1 = pt.x;
              if (pt.y < y0) y0 = pt.y;
              if (pt.y > y1) y1 = pt.y;
            }
            s.boxes.push(c, end, x0 - reach, y0 - reach, x1 + reach, y1 + reach);
            if (end === pts.length - 1) break;
          }
        }
      }

      // The nearest point of the path to (px, py), written into streamHit.
      // beyond: how far past the path's last point it lies, along the path.
      var streamHit = { d2: 0, x: 0, y: 0, tx: 0, ty: 0, age: 0, sp: 0, beyond: 0 };
      function nearestOnStream(s, px, py) {
        var pts = s.pts;
        var n = pts.length;
        var boxes = s.boxes;
        var best = 1e9;
        if (n === 1) {
          var P = pts[0];
          if (!boxes.length || px < boxes[2] || py < boxes[3] || px > boxes[4] || py > boxes[5]) return false;
          best = (px - P.x) * (px - P.x) + (py - P.y) * (py - P.y);
          streamHit.x = P.x; streamHit.y = P.y; streamHit.tx = P.tx; streamHit.ty = P.ty;
          streamHit.age = time - P.born; streamHit.sp = P.sp;
          streamHit.beyond = Math.max(0, (px - P.x) * P.tx + (py - P.y) * P.ty);
          streamHit.d2 = best;
          return true;
        }
        for (var b = 0; b < boxes.length; b += 6) {
          if (px < boxes[b + 2] || py < boxes[b + 3] || px > boxes[b + 4] || py > boxes[b + 5]) continue;
          for (var k = boxes[b]; k < boxes[b + 1]; k++) {
            var A = pts[k];
            var B = pts[k + 1];
            var ex = B.x - A.x;
            var ey = B.y - A.y;
            var el2 = ex * ex + ey * ey + 1e-12;
            var t = ((px - A.x) * ex + (py - A.y) * ey) / el2;
            var beyond = k === n - 2 && t > 1 ? (t - 1) * Math.sqrt(el2) : 0;
            t = t < 0 ? 0 : (t > 1 ? 1 : t);
            var cx = A.x + ex * t;
            var cy = A.y + ey * t;
            var d2 = (px - cx) * (px - cx) + (py - cy) * (py - cy);
            if (d2 < best) {
              best = d2;
              streamHit.x = cx;
              streamHit.y = cy;
              streamHit.tx = A.tx + (B.tx - A.tx) * t;
              streamHit.ty = A.ty + (B.ty - A.ty) * t;
              streamHit.age = time - (A.born + (B.born - A.born) * t);
              streamHit.sp = A.sp + (B.sp - A.sp) * t;
              streamHit.beyond = beyond;
            }
          }
        }
        streamHit.d2 = best;
        return best < 1e8;
      }

      // --- Dust physics tuning (scene units, per second) -------------------
      var DUST_DRAG = 4.25;        // linear drag: how quickly dust settles
      var DUST_DRAG_FAST = 5.85;   // extra drag per unit of speed: tames flicks
      var DUST_MAX_SPEED = 1.5;   // hard ceiling, nothing ever shoots
      var STIR_MAX = 1.5;         // pointer speed is clamped to this
      var STIR_CARRY = 0.79;      // share of pointer velocity the dust picks up
      var STIR_GRIP = 4.5;       // how fast dust under the pointer matches it
      var RIPPLE_PUSH = 1.8;      // outward nudge as a ripple ring passes
      var GATHER_PULL = 3.4;      // max pull of light on dust

      var stirrers = [];
      var orbStir = {};

      function trackStir(o, x, y, dt, part, gain, user) {
        if (o.stirX === undefined) { o.stirX = x; o.stirY = y; o.stirVx = 0; o.stirVy = 0; }
        if (dt > 0.0001) {
          var vx = (x - o.stirX) / dt;
          var vy = (y - o.stirY) / dt;
          var sp = Math.hypot(vx, vy);
          if (sp > STIR_MAX) { vx *= STIR_MAX / sp; vy *= STIR_MAX / sp; }
          var k = Math.min(1, dt * 12);
          o.stirVx += (vx - o.stirVx) * k;
          o.stirVy += (vy - o.stirVy) * k;
        }
        o.stirX = x;
        o.stirY = y;
        stirrers.push({ x: x, y: y, vx: o.stirVx, vy: o.stirVy, speed: Math.hypot(o.stirVx, o.stirVy), part: part, gain: gain, user: !!user });
      }

      function buildStirrers(dt) {
        stirrers.length = 0;
        // The moon always stirs the dust it passes, fingers down or not.
        if (moonMode) trackStir(orbStir, pointer.x, pointer.y, dt, 0.9, 0.8);
        if (active.size > 0) {
          if (!moonMode) orbStir.stirX = undefined;
          // Dark parts the dust around the brush; light draws it in a little.
          // Under the sky the dark brush is wind, which draws dust in along
          // its path (streams), so it barely parts it.
          var windPart = 1.5 - 1.25 * (flowOK ? skyAmount : 0);
          active.forEach(function (state) {
            trackStir(state, state.x, state.y, dt, state.kind === 'light' ? -0.4 : (state.moon ? 1.5 : windPart), 1.0, !state.moon);
          });
        } else if (!moonMode) {
          // The resting pearl stirs gently too, so hovering already feels alive.
          trackStir(orbStir, pointer.x, pointer.y, dt, 0.5, 0.55);
        }
      }

      function updateParticles(dt) {
        var ext = viewExt();
        var vscale = settings.velocity;
        var toU = 0.5 / ext.x;
        var toV = 0.5 / ext.y;
        var stirR = 0.20 + 0.10 * settings.brush;
        var stirReach = stirR * stirR * 6.25;
        var orbitR = 0.07 + 0.05 * settings.brush;
        buildStirrers(dt);
        updatePuffs(dt);
        updateStreams(dt);
        var streamCore = 0.075 * settings.brush * STREAM_CORE;
        var streamReach = 0.075 * settings.brush * STREAM_REACH;
        var streamReach2 = streamReach * streamReach;
        var skyOn = skyAmount > 0.001;
        // The steady wind comes and goes in long, slow breaths.
        var windBreath = 0.55 + 0.45 * Math.sin(time * 0.13) * Math.sin(time * 0.051 + 1.3) + 0.25;
        var moonLight = moonMode && skyOn ? moonAmount : 0;
        var moonGlowUp = 1 + 0.45 * moonShown;
        var lampNow = lamp && skyOn ? lampLightNow() * rideAmount : 0;
        var lampAt = lampNow > 0 ? lampHead() : null;
        var drinks = moonDrinks();
        for (var i = 0; i < activeParticles; i++) {
          var p = particles[i];
          // A mote sinking into the moon: a spark that rides the rim with the
          // moon, flares and goes. Then the wind brings it back from upwind.
          if (p.sink > 0) {
            p.sink += dt / MOON_SINK;
            if (p.sink >= 1 || !moonMode) {
              respawnMote(p);
            } else {
              // Just outside the rim, so it shows against the sky and not
              // lost in the bright limb.
              p.x = (pointer.x + Math.cos(p.sinkA) * MOON_R * 1.035) / (2.0 * ext.x) + 0.5;
              p.y = (pointer.y + Math.sin(p.sinkA) * MOON_R * 1.035) / (2.0 * ext.y) + 0.5;
              p.vx = 0;
              p.vy = 0;
              p.lit = 1;
              p.dark = 0;
              p.bright = (0.25 + 1.5 * sinkEnv(p.sink)) * p.fade * (stillMode ? 0.35 : 1.0);
            }
            continue;
          }
          var px = (p.x - 0.5) * 2.0 * ext.x;
          var py = (p.y - 0.5) * 2.0 * ext.y;
          var extraDrag = 0;
          var near = 1 - p.depth;

          // Slow ambient drift; under the sky it is stronger for nearer motes.
          var amb = 0.03 * (1 + skyAmount * (0.6 + 1.8 * near));
          var ax = (Math.sin(p.y * 5.3 + time * 0.12 + p.phase)
                 + Math.cos((p.x + p.y) * 3.7 - time * 0.08) * 0.5) * amb;
          var ay = (Math.cos(p.x * 4.9 - time * 0.10 + p.phase)
                 + Math.sin((p.x - p.y) * 4.1 + time * 0.07) * 0.5) * amb;

          if (skyOn) {
            // The wind the clouds drift on carries the dust too.
            ax += MOTE_WIND * (0.8 + 3.2 * near * near) * windBreath * DUST_DRAG * skyAmount;
            // The air a gust left moving: the dust is swept along it, and a
            // puff with no direction blows the dust outward.
            for (var u = 0; u < puffs.length; u++) {
              var pf = puffs[u];
              var fdx = px - pf.x;
              var fdy = py - pf.y;
              var fd2 = fdx * fdx + fdy * fdy;
              var fr2 = pf.rNow * pf.rNow;
              if (fd2 > fr2 * 6.0) continue;
              var fw = Math.exp(-fd2 / fr2) * pf.w * skyAmount;
              var fgrip = Math.min(1, fw * 6.0 * dt);
              p.vx += (pf.vx * MOTE_CARRY * vscale - p.vx) * fgrip;
              p.vy += (pf.vy * MOTE_CARRY * vscale - p.vy) * fgrip;
              if (pf.user && fw > 0.12) p.steer = time + STEER_HOLD;
              if (pf.radial > 0) {
                var fdl = Math.sqrt(fd2) + 1e-4;
                ax += fdx / fdl * pf.radial * fw * 1.4 * vscale;
                ay += fdy / fdl * pf.radial * fw * 1.4 * vscale;
              }
              p.flash = Math.max(p.flash, fw * 0.25);
            }
            // The brush's path: dust nearby is sucked toward it, and dust in
            // it takes up the path's flow, start to end, round its bends.
            for (var sn = 0; sn < streams.length; sn++) {
              var sm = streams[sn];
              if (!sm.pts.length || !nearestOnStream(sm, px, py)) continue;
              if (streamHit.d2 > streamReach2) continue;
              var life = 1 - smoothstep(STREAM_LIFE * 0.4, STREAM_LIFE, streamHit.age);
              if (life <= 0) continue;
              life *= skyAmount;
              var sdist = Math.sqrt(streamHit.d2);
              // Suction: none on the centre line, strongest at the channel's
              // edge, gone at its reach. Past the end of a finished stroke the
              // dust is let go, so it flies on instead of piling up there.
              var suck = smoothstep(0, streamCore, sdist) * (1 - smoothstep(streamCore, streamReach, sdist));
              if (!sm.live) suck *= 1 - smoothstep(0, streamCore, streamHit.beyond);
              var sinvd = 1 / (sdist + 1e-4);
              ax += (streamHit.x - px) * sinvd * suck * STREAM_SUCK * life;
              ay += (streamHit.y - py) * sinvd * suck * STREAM_SUCK * life;
              // Inside: carried along the path.
              var inside = 1 - smoothstep(streamCore * 0.75, streamCore * 1.2, sdist);
              if (inside > 0) {
                var stl = Math.hypot(streamHit.tx, streamHit.ty) + 1e-6;
                var flowSp = Math.min(STREAM_FLOW_MAX, STREAM_FLOW_MIN + streamHit.sp * STREAM_CARRY) * vscale;
                var cg = Math.min(1, inside * life * STREAM_GRIP * dt);
                p.vx += (streamHit.tx / stl * flowSp - p.vx) * cg;
                p.vy += (streamHit.ty / stl * flowSp - p.vy) * cg;
                p.flash = Math.max(p.flash, inside * life * 0.18);
                if (inside * life > 0.2) p.steer = time + STEER_HOLD;
              }
            }
          }

          // Ripples: the ring lights dust as it passes and gives it a brief
          // nudge. The ring outruns the dust, so dust never rides the front.
          for (var j = 0; j < shocks.length; j++) {
            var s = shocks[j];
            var age = time - s.born;
            if (age < 0 || age > SHOCK_LIFE * s.reach) continue;
            var dx = px - s.x;
            var dy = py - s.y;
            var dist = Math.hypot(dx, dy);
            var width = 0.070 + age * 0.060;
            var off = (dist - age * 0.82) / width;
            if (off > 3 || off < -3) continue;
            var ring = Math.exp(-off * off) * s.strength;
            var glow;
            var push;
            if (s.reach > 1) {
              var fade = moonShockFade(age, s.reach);
              glow = ring * fade;
              push = ring * Math.pow(fade, 8) * RIPPLE_PUSH;
            } else {
              glow = ring * Math.exp(-age * 0.62);
              push = ring * Math.exp(-age * 1.6) * RIPPLE_PUSH;
            }
            var inv = 1 / (dist + 0.0001);
            ax += (dx * inv - dy * inv * 0.25) * push;
            ay += (dy * inv + dx * inv * 0.25) * push;
            p.energy = Math.max(p.energy, glow);
            p.flash = Math.max(p.flash, glow * 0.85);
          }

          // Light gathers dust into a slow halo around it rather than through it.
          var gx = 0;
          var gy = 0;
          for (var k = 0; k < attractors.length; k++) {
            var a = attractors[k];
            var aa = time - a.born;
            if (aa < 0 || aa > 2.4) continue;
            var adx = px - a.x;
            var ady = py - a.y;
            var adist = Math.hypot(adx, ady);
            if (adist > 1.0) continue;
            var falloff = Math.exp(-aa * 0.72) * a.strength * (1.0 - smoothstep(0.18, 1.0, adist));
            var ainv = 1 / (adist + 0.0001);
            var radial = adist > orbitR
              ? -Math.min((adist - orbitR) * 5.0, 0.9)
              : (1 - adist / orbitR) * 1.2;
            var swirl = 0.9 * Math.min(1, adist / orbitR);
            gx += (adx * ainv * radial - ady * ainv * swirl) * falloff;
            gy += (ady * ainv * radial + adx * ainv * swirl) * falloff;
            // Thicker air near the light so dust settles into orbit.
            extraDrag += 2.5 * Math.min(1, falloff) * (1.0 - smoothstep(orbitR, orbitR * 3.0, adist));
            p.energy = Math.max(p.energy, falloff * 0.7);
            p.flash = Math.max(p.flash, falloff * 0.5);
            if (falloff > 0.25) p.steer = time + STEER_HOLD;
          }
          var g = Math.hypot(gx, gy);
          if (g > GATHER_PULL) { gx *= GATHER_PULL / g; gy *= GATHER_PULL / g; }
          ax += gx;
          ay += gy;

          // Pointers stir: dust under the brush is carried along with it, parts
          // around it, and curls back in its wake.
          if (vscale > 0) {
            for (var q = 0; q < stirrers.length; q++) {
              var st = stirrers[q];
              var sdx = px - st.x;
              var sdy = py - st.y;
              var sd2 = sdx * sdx + sdy * sdy;
              if (sd2 > stirReach) continue;
              var sd = Math.sqrt(sd2);
              var sq = sd / stirR;
              var w = Math.exp(-sq * sq * 1.4);
              var move = Math.min(1, st.speed / 0.3);
              var grip = Math.min(1, w * move * st.gain * STIR_GRIP * dt);
              p.vx += (st.vx * STIR_CARRY * vscale - p.vx) * grip;
              p.vy += (st.vy * STIR_CARRY * vscale - p.vy) * grip;
              var sinv = 1 / (sd + 0.0001);
              var part = w * (0.25 + 0.75 * move) * st.part;
              var curl = (st.vx * sdy - st.vy * sdx) * sinv * sq * w * 1.8 * st.gain;
              ax += sdx * sinv * part - sdy * sinv * curl;
              ay += sdy * sinv * part + sdx * sinv * curl;
              p.flash = Math.max(p.flash, w * move * st.gain * 0.35);
              if (st.user && w * move > 0.2) p.steer = time + STEER_HOLD;
            }
          }

          p.vx += ax * vscale * dt;
          p.vy += ay * vscale * dt;
          // On the ride the dust falls behind with the trees; under the sky,
          // nearer motes fall behind faster.
          p.vy -= 0.12 * rideAmount * settings.pace * (1 + skyAmount * (1.6 * near - 0.45)) * dt;

          var speed = Math.hypot(p.vx, p.vy);
          var damp = Math.exp(-(DUST_DRAG + DUST_DRAG_FAST * speed + extraDrag) * dt);
          if (speed * damp > DUST_MAX_SPEED) damp = DUST_MAX_SPEED / speed;
          p.vx *= damp;
          p.vy *= damp;
          speed *= damp;
          p.x += p.vx * toU * dt;
          p.y += p.vy * toV * dt;
          if (p.x < -0.08) p.x = 1.08;
          if (p.x > 1.08) p.x = -0.08;
          if (p.y < -0.08) p.y = 1.08;
          if (p.y > 1.08) p.y = -0.08;

          p.energy *= Math.pow(0.55, dt * 60);
          p.flash *= Math.pow(0.88, dt * 60);
          p.fade = Math.min(1, p.fade + dt * 4.0);

          var psx = (p.x - 0.5) * 2.0 * ext.x;
          var psy = (p.y - 0.5) * 2.0 * ext.y;
          var moteGlow = p.base + Math.min(0.22, speed * 0.20);
          p.lit = 0;
          if (skyOn) {
            // Moonlight scatters off dust seen near the moon.
            if (moonLight > 0) {
              var mdist = Math.hypot(psx - pointer.x, psy - pointer.y);
              p.lit = moonLight * moonGlowUp * Math.exp(-Math.max(0, mdist - MOON_R) / MOTE_MOON_REACH);
              // Dust you blew that reaches the disc sinks into the moon where
              // it crossed the rim. Anything else passes behind (uploadParticles).
              if (drinks && !p.blur && p.steer > time && mdist < MOON_R) {
                p.sink = 1e-4;
                p.sinkA = Math.atan2(psy - pointer.y, psx - pointer.x);
                p.flash = 0;
                p.energy = 0;
                moonSip();
                drinks = moonDrinks();
                continue;
              }
            }
            var twinkle = 0.70 + 0.30 * Math.sin(time * p.tw + p.phase);
            // A flake catches the light for a moment as it turns; near the
            // moon it turns into the light more often.
            var glint = 0;
            if (p.flake > 0) {
              var gc = (time * p.glintRate * (1 + 2.0 * p.lit) + p.glintPhase) % 1;
              var gd = (gc - 0.5) / 0.011;
              if (gd * gd < 9) glint = Math.exp(-gd * gd) * p.flake;
            }
            var skyGlow = MOTE_BRIGHT * (0.30 + 0.70 * p.lum) * twinkle
                        + glint * MOTE_GLINT * (0.6 + 1.4 * p.lit)
                        + p.lit * MOTE_MOON * (0.35 + 0.65 * p.lum)
                        + Math.min(0.45, speed * 0.55);
            moteGlow += (skyGlow - moteGlow) * skyAmount;
          }
          var lightUp = moteGlow + p.energy * 0.25 + p.flash * 0.55;
          // Dust drifting through the lamp's light shows it.
          if (lampAt) {
            var ldx = psx - lampAt.x;
            var ldy = psy - lampAt.y;
            lightUp += 0.5 * lampNow * Math.exp(-(ldx * ldx + ldy * ldy) / 0.07);
          }
          // A near mote spreads all its light over a wide, soft disc.
          if (p.blur > 0) lightUp *= 1 - 0.955 * skyAmount;
          p.bright = lightUp * p.fade * (stillMode ? 0.35 : 1.0);

          // In the void, dust inside a dark stroke is hidden. Under the sky a
          // stroke is wind, and the dust in it is what shows the wind.
          var dark = 0;
          if (skyAmount < 0.999) {
            for (var mi = 0; mi < marks.length; mi++) {
              var mm = marks[mi];
              var mr = Math.max(0.045, mm.rNow * 2.3);
              var md = Math.hypot(psx - mm.x, psy - mm.y);
              var mq = md / mr;
              dark += mm.opacity * Math.exp(-mq * mq * 1.5);
            }
          }
          p.dark = Math.min(1, dark * 2.1) * (1 - skyAmount);
        }
      }

      function uploadParticles() {
        if (!particleProgram) return;
        var cw = Math.max(1, canvas.width);
        var ch = Math.max(1, canvas.height);
        var ext = viewExt();
        var toU = 0.5 / ext.x;
        var toV = 0.5 / ext.y;
        // Sky mote sizes are fractions of the short side of the view; the
        // point shader measures sizes against its height.
        var toH = Math.min(cw, ch) / ch;
        // A mote smaller than this many pixels would light no pixel fully, so
        // it is drawn at least this wide and its brightness says how big it is.
        var minSize = 2.6 / ch;
        var F = PARTICLE_FLOATS;
        // The moon hangs in front of the dust, as it does the stars: a mote
        // slides behind its edge (the near, out-of-focus ones stay in front).
        var moonHide = moonMode ? moonAmount * skyAmount : 0;
        var pxPerUnit = Math.min(cw, ch) * 0.5;
        for (var i = 0; i < activeParticles; i++) {
          var p = particles[i];
          var base = i * 3 * F;
          var ux = p.vx * toU;
          var uy = p.vy * toV;
          var lag = 0.030 + Math.min(0.070, Math.hypot(p.vx, p.vy) * 0.06);
          var lightOut = 1.0 - p.dark * 0.93;
          var near = 1 - p.depth;
          var skySize = p.blur > 0
            ? (0.045 + 0.035 * p.lum) * toH
            : Math.max(minSize, (0.0015 + 0.0020 * p.lum + 0.0034 * near * near) * (1 + 0.6 * p.lit) * toH);
          var size = p.size + (skySize - p.size) * skyAmount;
          // A spark on the moon's rim swells as it flares.
          if (p.sink > 0) size *= 1 + 1.8 * sinkEnv(p.sink);
          var blur = p.blur * skyAmount;
          var silver = Math.min(1, 0.22 * skyAmount + p.lit * 0.85);
          var hides = moonHide > 0 && !p.blur && !(p.sink > 0);
          for (var k = 0; k < 3; k++) {
            var at = base + k * F;
            var back = lag * k;
            var kx = p.x - ux * back;
            var ky = p.y - uy * back;
            var kSize = size * (1.0 - k * 0.24);
            var shown = 1;
            if (hides) {
              // Covered by how far inside the rim it is, over its own radius.
              var edge = Math.max(1.0, kSize * ch * 0.5) / pxPerUnit;
              var dm = Math.hypot((kx - 0.5) * 2.0 * ext.x - pointer.x, (ky - 0.5) * 2.0 * ext.y - pointer.y);
              if (dm < MOON_R + edge) shown = 1 - moonHide * (1 - smoothstep(MOON_R - edge, MOON_R + edge, dm));
            }
            particleData[at] = kx;
            particleData[at + 1] = ky;
            particleData[at + 2] = kSize;
            // An out-of-focus mote draws no streak behind it.
            particleData[at + 3] = p.bright * (1.0 - k * 0.30) * lightOut * (k > 0 ? 1 - blur : 1) * shown;
            particleData[at + 4] = blur;
            particleData[at + 5] = silver;
          }
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, particleBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, particleData, 0, activeParticles * 3 * F);
      }

      function drawParticles() {
        if (!particleProgram || !particleVao) return;
        // The dust is drawn in screen space, so it has no place in the lens.
        if (scopeAmount > 0.995) return;
        gl.useProgram(particleProgram);
        gl.bindVertexArray(particleVao);
        gl.uniform2f(particleUniforms.res, canvas.width, canvas.height);
        particlePalette.set(paletteLinear);
        particlePalette[9] = inkLinear[3];
        particlePalette[10] = inkLinear[4];
        particlePalette[11] = inkLinear[5];
        particlePalette[12] = inkLinear[6];
        particlePalette[13] = inkLinear[7];
        particlePalette[14] = inkLinear[8];
        gl.uniform3fv(particleUniforms.pal, particlePalette);
        // Mote brightness under the sky is worked out per mote (MOTE_*).
        gl.uniform1f(particleUniforms.dim, 1 - scopeAmount);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        gl.drawArrays(gl.POINTS, 0, activeParticles * 3);
        gl.disable(gl.BLEND);
        gl.bindVertexArray(vao);
      }


      function saveTune() {
        try { localStorage.setItem('opal.tune', JSON.stringify(settings)); } catch (e) { /* private */ }
      }

      function updateInkPreview() {
        inkPreview.style.background = 'linear-gradient(90deg, ' + settings.ink0 + ', ' + settings.ink1 + ' 50%, ' + settings.ink2 + ')';
      }

      function writeInk() {
        for (var i = 0; i < 3; i++) {
          var c = hexToRgb(settings['ink' + i]);
          inkLinear[i * 3] = linear(c.r);
          inkLinear[i * 3 + 1] = linear(c.g);
          inkLinear[i * 3 + 2] = linear(c.b);
        }
        gl.useProgram(program);
        gl.uniform3fv(uniforms.ink, inkLinear);
        gl.uniform1f(uniforms.inkCurve, settings.curve);
        updateInkPreview();
      }

      function syncTuneControls() {
        brushInput.value = settings.brush.toFixed(2);
        trailInput.value = settings.trail.toFixed(1);
        particlesInput.value = String(Math.round(settings.particles));
        velocityInput.value = settings.velocity.toFixed(2);
        veilInput.value = settings.veil.toFixed(2);
        ink0Input.value = settings.ink0;
        ink1Input.value = settings.ink1;
        ink2Input.value = settings.ink2;
        curveInput.value = settings.curve.toFixed(2);
        paceInput.value = settings.pace.toFixed(2);
        paceOut.textContent = settings.pace.toFixed(2);
        brushOut.textContent = settings.brush.toFixed(2);
        trailOut.textContent = settings.trail.toFixed(1);
        particlesOut.textContent = String(Math.round(settings.particles));
        velocityOut.textContent = settings.velocity.toFixed(2);
        veilOut.textContent = settings.veil.toFixed(2);
        curveOut.textContent = settings.curve.toFixed(2);
        updateInkPreview();
      }

      function tuneChanged(e) {
        var id = e.target && e.target.id;
        if (id === 'brush') settings.brush = Math.max(0.4, Math.min(1.4, parseFloat(e.target.value) || TUNE_DEFAULTS.brush));
        else if (id === 'trail') settings.trail = Math.max(0.3, Math.min(8, parseFloat(e.target.value) || TUNE_DEFAULTS.trail));
        else if (id === 'particles') {
          settings.particles = Math.max(150, Math.min(MAX_PARTICLES, parseInt(e.target.value, 10) || TUNE_DEFAULTS.particles));
          activeParticles = Math.round(settings.particles);
        } else if (id === 'velocity') settings.velocity = Math.max(0, Math.min(2.5, parseFloat(e.target.value)));
        else if (id === 'veil') settings.veil = Math.max(0.3, Math.min(1.6, parseFloat(e.target.value) || TUNE_DEFAULTS.veil));
        else if (id === 'pace') settings.pace = Math.max(0.2, Math.min(2.5, parseFloat(e.target.value) || TUNE_DEFAULTS.pace));
        else if (id === 'ink0' || id === 'ink1' || id === 'ink2') {
          settings[id] = e.target.value;
          writeInk();
        } else if (id === 'curve') {
          settings.curve = Math.max(-1, Math.min(1, parseFloat(e.target.value) || 0));
          writeInk();
        } else return;
        syncTuneControls();
        saveTune();
      }


      function useWritePreset() {
        settings.brush = 0.62;
        settings.trail = Math.max(4.0, settings.trail);
        syncTuneControls();
        saveTune();
      }


      function erodeForTrail() {
        if (settings.trail >= 7.95) return 0;
        var t = Math.max(0.3, Math.min(8, settings.trail));
        return 0.38 * (1 - Math.pow(t / 8, 0.55));
      }

      function resetTune() {
        settings.brush = TUNE_DEFAULTS.brush;
        settings.trail = TUNE_DEFAULTS.trail;
        settings.particles = TUNE_DEFAULTS.particles;
        settings.velocity = TUNE_DEFAULTS.velocity;
        settings.veil = TUNE_DEFAULTS.veil;
        settings.ink0 = TUNE_DEFAULTS.ink0;
        settings.ink1 = TUNE_DEFAULTS.ink1;
        settings.ink2 = TUNE_DEFAULTS.ink2;
        settings.curve = TUNE_DEFAULTS.curve;
        settings.pace = TUNE_DEFAULTS.pace;
        activeParticles = Math.round(settings.particles);
        syncTuneControls();
        writeInk();
        saveTune();
      }

      function stillVeil() {
        stillMode = true;
        marks.length = 0;
        shocks.length = 0;
        clearMask();
        lights.length = 0;
        attractors.length = 0;
        streams.length = 0;
        lightData.fill(0);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.vx *= 0.12;
          p.vy *= 0.12;
          p.fade = 1;
          p.energy = 0;
          p.flash = 0;
          p.bright = 0.025;
        }
        nextPulse = time + 100000;
      }

      function setRide(on, quiet) {
        ride = !!on;
        rideButton.setAttribute('aria-pressed', ride ? 'true' : 'false');
        rideButton.setAttribute('aria-label', 'ride beneath the pines: ' + (ride ? 'on' : 'off'));
        if (!quiet) {
          try { localStorage.setItem('opal.void.ride', ride ? 'on' : 'off'); } catch (e) { /* private */ }
        }
      }

      function setPines(fine, quiet) {

        pinesButton.setAttribute('aria-pressed', pinesFine ? 'true' : 'false');
        pinesButton.innerHTML = 'pines &middot; ' + (pinesFine ? 'fine' : 'classic');
        if (!quiet) {
          try { localStorage.setItem('opal.void.pines', pinesFine ? 'fine' : 'classic'); } catch (e) { /* private */ }
        }
      }

      function setCursor(moon, quiet) {
        moonMode = !!moon;
        moonVel.x = 0;
        moonVel.y = 0;
        moonGrab = null;
        canvas.style.cursor = '';

        cursorButton.setAttribute('aria-pressed', moonMode ? 'true' : 'false');
        cursorButton.innerHTML = 'cursor &middot; ' + (moonMode ? 'moon' : 'pearl');
        if (!quiet) {
          try { localStorage.setItem('opal.void.cursor', moonMode ? 'moon' : 'pearl'); } catch (e) { /* private */ }
        }
      }

      function setSky(on, quiet) {
        sky = !!on;
        skyHealAcc = 0;
        if (!sky && scope) setScope(false);   // the camera only looks at the sky
        skyButton.setAttribute('aria-pressed', sky ? 'true' : 'false');
        skyButton.setAttribute('aria-label', 'the night sky: ' + (sky ? 'on' : 'off'));
        if (!quiet) {
