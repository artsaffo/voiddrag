        }
        gusts.length = 0;
        var relax = settings.trail >= 7.95 ? 1e5 : 1.5 + settings.trail * 3.2;
        var sdt = dt * (reduceMotion ? 0.6 : 1);

        function common(pr) {
          var u = pr.u;
          gl.useProgram(pr.p);
          gl.uniform2f(u.uGrid, FLOW_W, FLOW_H);
          gl.uniform2f(u.uExt, ex, ey);
          gl.uniform1f(u.uDt, sdt);
          gl.uniform1f(u.uTime, time);
          gl.uniform1f(u.uDrift, drift);
          gl.uniform4fv(u.uSplatA, gustA);
          gl.uniform4fv(u.uSplatB, gustB);
          gl.uniform1i(u.uSplats, n);
          gl.uniform4fv(u.uLights, lightData);
          return u;
        }

        var a = flow.cur;
        var b = 1 - a;
        gl.viewport(0, 0, FLOW_W, FLOW_H);

        var u = common(flow.vel);
        gl.bindFramebuffer(gl.FRAMEBUFFER, flow.v[b].fb);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, flow.v[a].tex);
        gl.uniform1i(u.uVel, 0);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        u = common(flow.map);
        gl.bindFramebuffer(gl.FRAMEBUFFER, flow.m[b].fb);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, flow.v[b].tex);
        gl.uniform1i(u.uVel, 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, flow.m[a].tex);
        gl.uniform1i(u.uMap, 1);
        gl.uniform1f(u.uRelax, relax);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        flow.cur = b;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.activeTexture(gl.TEXTURE0);
      }

      // Under the sky, parted cloud closes back over by itself. Trail sets how
      // long that takes (about 8 s at the default); the top of the slider still
      // keeps the opening. The fade is applied in steps of a quarter second so
      // each step is large enough to survive the 8-bit canvas.
      function healSky(dt) {
        if (settings.trail >= 7.95) return;
        skyHealAcc += dt;
        if (skyHealAcc < 0.25) return;
        var life = 1.5 + settings.trail * 3.2;
        var a = 1 - Math.exp(-skyHealAcc / life);
        skyHealAcc = 0;
        maskCtx.save();
        maskCtx.globalCompositeOperation = 'destination-out';
        maskCtx.fillStyle = 'rgba(0,0,0,' + a + ')';
        maskCtx.fillRect(0, 0, MASK_W, MASK_H);
        maskCtx.restore();
      }

      function fadeMask(dt) {
        if (!maskCtx) return;
        if (sky) { healSky(dt); return; }
        if (settings.trail >= 7.95) return;
        var life = Math.max(1.5, settings.trail * 16);
        var a = 1 - Math.exp(-dt / life);
        maskCtx.save();
        maskCtx.globalCompositeOperation = 'destination-out';
        maskCtx.fillStyle = 'rgba(0,0,0,' + a + ')';
        maskCtx.fillRect(0, 0, MASK_W, MASK_H);
        maskCtx.restore();
      }

      function clearMask() {
        if (maskCtx) maskCtx.clearRect(0, 0, MASK_W, MASK_H);
      }

      function initMaskTexture() {
        maskTexture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, maskTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
      }

      function uploadMask() {
        if (!maskTexture) return;
        gl.bindTexture(gl.TEXTURE_2D, maskTexture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, maskCanvas);
      }

      function addMark(x, y, radius, life, strength, grow, vx, vy) {
        if (marks.length >= MAX_MARKS) marks.shift();
        radius *= settings.brush;
        if (!(sky && flowOK)) stampMask(x, y, radius * 1.4, strength * 0.88, false);
        life = Math.max(1, life * settings.trail);
        marks.push({
          x: x,
          y: y,
          r: radius,
          rNow: radius,
          born: time,
          life: life,
          strength: strength,
          grow: grow,
          vx: vx || 0,
          vy: vy || 0,
          opacity: 0
        });
      }

      function bloom(x, y) {
        var base = Math.random() * Math.PI * 2;
        for (var i = 0; i < 3; i++) {
          var a = base + i * (Math.PI * 2 / 3) + (Math.random() - 0.5) * 0.5;
          var off = 0.040 + Math.random() * 0.045;
          var speed = 0.008 + Math.random() * 0.010;
          addMark(
            x + Math.cos(a) * off,
            y + Math.sin(a) * off,
            0.170 + Math.random() * 0.075,
            22 + Math.random() * 7,
            0.9,
            0.38,
            Math.cos(a) * speed,
            Math.sin(a) * speed
          );
        }
        addMark(x, y, 0.145, 26, 0.95, 0.18);
        if (sky && flowOK) addGust(x, y, 0, 0, 0.11 * settings.brush, 0.9, 1.5);
        addShock(x, y, 0.95);
        burstParticles(x, y, 26, 1.0);
        impulseParticles(x, y, 0.55, 0.6);
        audio.aperture('dark', scenePan(x), 0.95);
      }

      function paintAt(x, y, force, pointerState) {
        var lp = pointerState ? pointerState.lastPaint : lastPaint;
        var lpa = pointerState ? pointerState.lastPaintAt : lastPaintAt;
        var dist = lp ? Math.hypot(x - lp.x, y - lp.y) : 1;
        if (!force && dist < 0.028 && time - lpa < 0.06) return;
        addMark(
          x + (Math.random() - 0.5) * 0.010,
          y + (Math.random() - 0.5) * 0.010,
          0.100 + Math.random() * 0.050,
          16 + Math.random() * 6,
          0.8,
          0.12
        );
        if (pointerState) {
          pointerState.lastPaint = { x: x, y: y };
          pointerState.lastPaintAt = time;
        } else {
          lastPaint = { x: x, y: y };
          lastPaintAt = time;
        }
        if (time - lastShockAt > 0.10) {
          addShock(x, y, 0.42);
          lastShockAt = time;
        }
      }


      function addLight(x, y, radius, life, strength, grow) {
        if (lights.length >= MAX_LIGHTS) lights.shift();
        lights.push({
          x: x,
          y: y,
          r: Math.max(0.03, radius * settings.brush),
          rNow: Math.max(0.03, radius * settings.brush),
          born: time,
          life: Math.max(1, life),
          strength: strength,
          grow: grow,
          opacity: 0
        });
      }

      function updateLights(dt) {
        for (var i = lights.length - 1; i >= 0; i--) {
          var l = lights[i];
          var age = time - l.born;
          if (age > l.life) {
            lights.splice(i, 1);
            continue;
          }
          l.rNow = l.r * (1.0 + l.grow * (1.0 - Math.exp(-age * 1.1)));
          l.opacity = smoothstep(0, 0.35, age) * (1 - smoothstep(l.life - 1.2, l.life, age)) * l.strength;
        }
      }

      function uploadLights() {
        lightData.fill(0);
        for (var i = 0; i < lights.length && i < MAX_LIGHTS; i++) {
          var l = lights[i];
          lightData[i * 4] = l.x;
          lightData[i * 4 + 1] = l.y;
          lightData[i * 4 + 2] = l.rNow;
          lightData[i * 4 + 3] = l.opacity;
        }
      }

      function addAttractor(x, y, strength) {
        if (attractors.length >= MAX_ATTRACTORS) attractors.shift();
        attractors.push({ x: x, y: y, born: time, strength: strength });
      }

      function updateAttractors() {
        for (var i = attractors.length - 1; i >= 0; i--) {
          if (time - attractors[i].born > 2.4) attractors.splice(i, 1);
        }
      }

      // Dust is simulated in scene units (x: +-aspect, y: +-1) so every force is
      // round on any screen; positions stay in 0..1 for the point shader.
      function recruitParticle() {
        // Borrow a quiet mote rather than one that is visibly busy, and fade it
        // in so nothing pops.
        var best = particles[(Math.random() * activeParticles) | 0];
        for (var t = 0; t < 2; t++) {
          var c = particles[(Math.random() * activeParticles) | 0];
          if (c.flash + c.energy < best.flash + best.energy) best = c;
        }
        best.fade = 0;
        return best;
      }

      function pullParticles(x, y, count, force) {
        if (!activeParticles) return;
        var aspect = canvas.width / Math.max(1, canvas.height);
        var vscale = settings.velocity;
        for (var i = 0; i < count; i++) {
          var p = recruitParticle();
          var a = Math.random() * Math.PI * 2;
          var rad = 0.20 + Math.random() * 0.40;
          p.x = (x + Math.cos(a) * rad) / (2.0 * aspect) + 0.5;
          p.y = (y + Math.sin(a) * rad) * 0.5 + 0.5;
          var inward = (0.05 + Math.random() * 0.12) * force * vscale;
          p.vx = -Math.cos(a) * inward - Math.sin(a) * inward * 0.5;
          p.vy = -Math.sin(a) * inward + Math.cos(a) * inward * 0.5;
          p.energy = (0.5 + Math.random() * 0.5) * force;
          p.flash = (0.6 + Math.random() * 0.6) * force;
          p.size = 0.0026 + Math.random() * 0.0060;
        }
        audio.dust(scenePan(x), force * 0.8, true);
      }

      // A single soft puff: nearby dust is nudged outward once and then eases
      // to rest under drag, instead of being shoved for as long as a ripple lasts.
      function impulseParticles(x, y, radius, strength) {
        var aspect = canvas.width / Math.max(1, canvas.height);
        var vscale = settings.velocity;
        if (!vscale) return;
        for (var i = 0; i < activeParticles; i++) {
          var p = particles[i];
          var dx = (p.x - 0.5) * 2.0 * aspect - x;
          var dy = (p.y - 0.5) * 2.0 - y;
          var d = Math.hypot(dx, dy);
          if (d > radius) continue;
          var w = 1 - d / radius;
          w = w * w * strength * vscale;
          var inv = 1 / (d + 0.0001);
          p.vx += (dx * inv - dy * inv * 0.22) * w;
          p.vy += (dy * inv + dx * inv * 0.22) * w;
          p.flash = Math.max(p.flash, w * 1.2);
        }
      }


      function eraseMarksAt(x, y, radius, power) {
        stampMask(x, y, radius, power * 0.9, true);
        for (var i = marks.length - 1; i >= 0; i--) {
          var m = marks[i];
          var d = Math.hypot(m.x - x, m.y - y);
          if (d > radius) continue;
          var falloff = 1 - d / radius;
          m.strength *= Math.max(0, 1 - power * falloff);
          if (m.strength < 0.035) marks.splice(i, 1);
        }
      }

      function lightBloom(x, y) {
        eraseMarksAt(x, y, Math.max(0.14, 0.22 * settings.brush), 0.96);
        addLight(x, y, 0.270, 6.0, 1.0, 0.30);
        addLight(x, y, 0.140, 8.0, 0.82, 0.50);
        addAttractor(x, y, 1.9);
        pullParticles(x, y, 60, 1.0);
        lastLight = { x: x, y: y };
        lastLightAt = time;
        audio.aperture('light', scenePan(x), 0.9);
        audio.dust(scenePan(x), 1.0, true);
      }

      function paintLightAt(x, y, pointerState) {
        var lp = pointerState ? pointerState.lastLight : lastLight;
        var lpa = pointerState ? pointerState.lastLightAt : lastLightAt;
        var dist = lp ? Math.hypot(x - lp.x, y - lp.y) : 1;
        if (dist < 0.026 && time - lpa < 0.06) return;
        eraseMarksAt(x, y, Math.max(0.10, 0.14 * settings.brush), 0.78);
        addLight(x + (Math.random() - 0.5) * 0.010, y + (Math.random() - 0.5) * 0.010, 0.125 + Math.random() * 0.055, 4.4, 0.78, 0.12);
        if (time - lpa > 0.10) {
          addAttractor(x, y, 0.62);
          pullParticles(x, y, 4, 0.48);
        }
        if (pointerState) {
          pointerState.lastLight = { x: x, y: y };
          pointerState.lastLightAt = time;
        } else {
          lastLight = { x: x, y: y };
          lastLightAt = time;
        }
      }

      function updateAudio(dt) {
        if (!audio.enabled) return;
        var aspect = canvas.width / Math.max(1, canvas.height);
        var dark = 0;
        var light = 0;
        for (var i = 0; i < marks.length; i++) {
          var s = marks[i];
          var dx = pointer.x - s.x;
          var dy = pointer.y - s.y;
          var rr = Math.max(0.03, s.rNow);
          dark += s.opacity * Math.exp(-(dx * dx + dy * dy) / (rr * rr * 2.2));
        }
        for (var j = 0; j < lights.length; j++) {
          var l = lights[j];
          var lx = pointer.x - l.x;
          var ly = pointer.y - l.y;
          var lr = Math.max(0.03, l.rNow);
          light += l.opacity * Math.exp(-(lx * lx + ly * ly) / (lr * lr * 2.2));
        }
        dark = 1 - Math.exp(-dark * 1.7);
        light = 1 - Math.exp(-light * 1.7);
        var speed = clamp(Math.hypot(pointerVel.x, pointerVel.y) / 1.4, 0, 1);
        audio.update(dt, {
          speed: speed,
          press: press,
          dark: dark,
          light: light,
          active: down !== null,
          painting: painting,
          mode: down ? down.kind : 'dark',
          pan: clamp(pointer.x / Math.max(0.001, aspect), -1, 1)
        });
      }

      function updateMarks(dt) {
        for (var i = marks.length - 1; i >= 0; i--) {
          var s = marks[i];
          var age = time - s.born;
          if (age > s.life) {
            marks.splice(i, 1);
            continue;
          }
          var f = flowAt(s.x, s.y, time);
          s.vx *= Math.pow(0.985, dt * 60);
          s.vy *= Math.pow(0.985, dt * 60);
          s.x += (f.x * 0.022 + s.vx) * dt;
          s.y += (f.y * 0.022 + s.vy) * dt;
          s.rNow = s.r * (1.0 + s.grow * (1.0 - Math.exp(-age * 1.2)));
          s.opacity = smoothstep(0, 1.2, age) * (1 - smoothstep(s.life - 5, s.life, age)) * s.strength;
        }
      }

      function uploadMarks() {
        markData.fill(0);
        var n = Math.min(marks.length, MAX_MARKS);
        for (var i = 0; i < n; i++) {
          var s = marks[i];
          markData[i * 4] = s.x;
          markData[i * 4 + 1] = s.y;
          markData[i * 4 + 2] = s.rNow;
          markData[i * 4 + 3] = s.opacity;
        }
        gl.uniform4fv(uniforms.marks, markData);
      }


      function addShock(x, y, strength) {
        shocks.push({ x: x, y: y, born: time, strength: strength });
        if (shocks.length > MAX_SHOCKS) shocks.shift();
      }

      function updateShocks() {
        shockData.fill(0);
        for (var i = shocks.length - 1; i >= 0; i--) {
          var s = shocks[i];
          var age = time - s.born;
          if (age > 2.2) {
            shocks.splice(i, 1);
            continue;
          }
          if (i < MAX_SHOCKS) {
            shockData[i * 4] = s.x;
            shockData[i * 4 + 1] = s.y;
            shockData[i * 4 + 2] = age;
            shockData[i * 4 + 3] = s.strength;
          }
        }
      }


      function burstParticles(x, y, count, force) {
        if (!activeParticles) return;
        var aspect = canvas.width / Math.max(1, canvas.height);
        for (var i = 0; i < count; i++) {
          var p = recruitParticle();
          var a = Math.random() * Math.PI * 2;
          var rad = 0.08 + Math.random() * 0.22;
          p.x = (x + Math.cos(a) * rad) / (2.0 * aspect) + 0.5;
          p.y = (y + Math.sin(a) * rad) * 0.5 + 0.5;
          var sp = (0.06 + Math.random() * 0.22) * force * settings.velocity;
          var turn = (Math.random() - 0.5) * 0.6;
          p.vx = (Math.cos(a) - Math.sin(a) * turn) * sp;
          p.vy = (Math.sin(a) + Math.cos(a) * turn) * sp;
          p.energy = (0.9 + Math.random() * 0.9) * force;
          p.flash = (1.1 + Math.random() * 0.8) * force;
          p.size = 0.0030 + Math.random() * 0.0060;
        }
        audio.dust(scenePan(x), force, false);
      }

      function initParticles() {
        particles.length = 0;
        for (var i = 0; i < MAX_PARTICLES; i++) {
          particles.push({
            x: Math.random(),
            y: Math.random(),
            vx: 0,
            vy: 0,
            size: 0.0020 + Math.random() * 0.0050,
            base: 0.060 + Math.random() * 0.135,
            phase: Math.random() * Math.PI * 2,
            energy: 0,
            flash: 0,
            fade: 1,
            bright: 0.08,
            dark: 0
          });
        }
      }

      // --- Dust physics tuning (scene units, per second) -------------------
      var DUST_DRAG = 2.4;        // linear drag: how quickly dust settles
      var DUST_DRAG_FAST = 2.0;   // extra drag per unit of speed: tames flicks
      var DUST_MAX_SPEED = 1.5;   // hard ceiling, nothing ever shoots
      var STIR_MAX = 2.4;         // pointer speed is clamped to this
      var STIR_CARRY = 0.42;      // share of pointer velocity the dust picks up
      var STIR_GRIP = 10.0;       // how fast dust under the pointer matches it
      var RIPPLE_PUSH = 0.7;      // outward nudge as a ripple ring passes
      var GATHER_PULL = 1.6;      // max pull of light on dust

      var stirrers = [];
      var orbStir = {};

      function trackStir(o, x, y, dt, part, gain) {
        if (o.stirX === undefined) { o.stirX = x; o.stirY = y; o.stirVx = 0; o.stirVy = 0; }
        if (dt > 0.0001) {
          var vx = (x - o.stirX) / dt;
          var vy = (y - o.stirY) / dt;
          var sp = Math.hypot(vx, vy);
          if (sp > STIR_MAX) { vx *= STIR_MAX / sp; vy *= STIR_MAX / sp; }
          var k = Math.min(1, dt * 12);
          o.stirVx += (vx - o.stirVx) * k;
          o.stirVy += (vy - o.stirVy) * k;
        }
        o.stirX = x;
        o.stirY = y;
        stirrers.push({ x: x, y: y, vx: o.stirVx, vy: o.stirVy, speed: Math.hypot(o.stirVx, o.stirVy), part: part, gain: gain });
      }

      function buildStirrers(dt) {
        stirrers.length = 0;
        if (active.size > 0) {
          orbStir.stirX = undefined;
          // Dark parts the dust around the brush; light draws it in a little.
          active.forEach(function (state) {
            trackStir(state, state.x, state.y, dt, state.kind === 'light' ? -0.4 : 1.5, 1.0);
          });
        } else {
          // The resting pearl stirs gently too, so hovering already feels alive.
          trackStir(orbStir, pointer.x, pointer.y, dt, 0.5, 0.55);
        }
      }

      function updateParticles(dt) {
        var aspect = canvas.width / Math.max(1, canvas.height);
        var vscale = settings.velocity;
        var toU = 0.5 / aspect;
        var stirR = 0.20 + 0.10 * settings.brush;
        var stirReach = stirR * stirR * 6.25;
        var orbitR = 0.07 + 0.05 * settings.brush;
        buildStirrers(dt);
        for (var i = 0; i < activeParticles; i++) {
          var p = particles[i];
          var px = (p.x - 0.5) * 2.0 * aspect;
          var py = (p.y - 0.5) * 2.0;
          var extraDrag = 0;

          // Slow ambient drift.
          var ax = (Math.sin(p.y * 5.3 + time * 0.12 + p.phase)
                 + Math.cos((p.x + p.y) * 3.7 - time * 0.08) * 0.5) * 0.03;
          var ay = (Math.cos(p.x * 4.9 - time * 0.10 + p.phase)
                 + Math.sin((p.x - p.y) * 4.1 + time * 0.07) * 0.5) * 0.03;

          // Ripples: the ring lights dust as it passes and gives it a brief
          // nudge. The ring outruns the dust, so dust never rides the front.
          for (var j = 0; j < shocks.length; j++) {
            var s = shocks[j];
            var age = time - s.born;
            if (age < 0 || age > 2.0) continue;
            var dx = px - s.x;
            var dy = py - s.y;
            var dist = Math.hypot(dx, dy);
            var width = 0.070 + age * 0.060;
            var off = (dist - age * 0.82) / width;
            if (off > 3 || off < -3) continue;
            var ring = Math.exp(-off * off) * s.strength;
            var glow = ring * Math.exp(-age * 0.62);
            var push = ring * Math.exp(-age * 1.6) * RIPPLE_PUSH;
            var inv = 1 / (dist + 0.0001);
            ax += (dx * inv - dy * inv * 0.25) * push;
            ay += (dy * inv + dx * inv * 0.25) * push;
            p.energy = Math.max(p.energy, glow);
            p.flash = Math.max(p.flash, glow * 0.85);
          }

          // Light gathers dust into a slow halo around it rather than through it.
          var gx = 0;
          var gy = 0;
          for (var k = 0; k < attractors.length; k++) {
            var a = attractors[k];
            var aa = time - a.born;
            if (aa < 0 || aa > 2.4) continue;
            var adx = px - a.x;
            var ady = py - a.y;
            var adist = Math.hypot(adx, ady);
            if (adist > 1.0) continue;
            var falloff = Math.exp(-aa * 0.72) * a.strength * (1.0 - smoothstep(0.18, 1.0, adist));
            var ainv = 1 / (adist + 0.0001);
            var radial = adist > orbitR
              ? -Math.min((adist - orbitR) * 5.0, 0.9)
              : (1 - adist / orbitR) * 1.2;
            var swirl = 0.9 * Math.min(1, adist / orbitR);
            gx += (adx * ainv * radial - ady * ainv * swirl) * falloff;
            gy += (ady * ainv * radial + adx * ainv * swirl) * falloff;
            // Thicker air near the light so dust settles into orbit.
            extraDrag += 2.5 * Math.min(1, falloff) * (1.0 - smoothstep(orbitR, orbitR * 3.0, adist));
            p.energy = Math.max(p.energy, falloff * 0.7);
            p.flash = Math.max(p.flash, falloff * 0.5);
          }
          var g = Math.hypot(gx, gy);
          if (g > GATHER_PULL) { gx *= GATHER_PULL / g; gy *= GATHER_PULL / g; }
          ax += gx;
          ay += gy;

          // Pointers stir: dust under the brush is carried along with it, parts
          // around it, and curls back in its wake.
          if (vscale > 0) {
            for (var q = 0; q < stirrers.length; q++) {
              var st = stirrers[q];
              var sdx = px - st.x;
              var sdy = py - st.y;
              var sd2 = sdx * sdx + sdy * sdy;
              if (sd2 > stirReach) continue;
              var sd = Math.sqrt(sd2);
              var sq = sd / stirR;
              var w = Math.exp(-sq * sq * 1.4);
              var move = Math.min(1, st.speed / 0.3);
              var grip = Math.min(1, w * move * st.gain * STIR_GRIP * dt);
              p.vx += (st.vx * STIR_CARRY * vscale - p.vx) * grip;
              p.vy += (st.vy * STIR_CARRY * vscale - p.vy) * grip;
              var sinv = 1 / (sd + 0.0001);
              var part = w * (0.25 + 0.75 * move) * st.part;
              var curl = (st.vx * sdy - st.vy * sdx) * sinv * sq * w * 1.8 * st.gain;
              ax += sdx * sinv * part - sdy * sinv * curl;
              ay += sdy * sinv * part + sdx * sinv * curl;
              p.flash = Math.max(p.flash, w * move * st.gain * 0.35);
            }
          }

          p.vx += ax * vscale * dt;
          p.vy += ay * vscale * dt;
          // On the ride the dust falls behind with the trees.
          p.vy -= 0.12 * rideAmount * settings.pace * dt;

          var speed = Math.hypot(p.vx, p.vy);
          var damp = Math.exp(-(DUST_DRAG + DUST_DRAG_FAST * speed + extraDrag) * dt);
          if (speed * damp > DUST_MAX_SPEED) damp = DUST_MAX_SPEED / speed;
          p.vx *= damp;
          p.vy *= damp;
          speed *= damp;
          p.x += p.vx * toU * dt;
          p.y += p.vy * 0.5 * dt;
          if (p.x < -0.08) p.x = 1.08;
          if (p.x > 1.08) p.x = -0.08;
          if (p.y < -0.08) p.y = 1.08;
          if (p.y > 1.08) p.y = -0.08;

          p.energy *= Math.pow(0.55, dt * 60);
          p.flash *= Math.pow(0.88, dt * 60);
          p.fade = Math.min(1, p.fade + dt * 4.0);
          p.bright = (p.base + Math.min(0.22, speed * 0.20) + p.energy * 0.25 + p.flash * 0.55) * p.fade * (stillMode ? 0.35 : 1.0);

          var psx = (p.x - 0.5) * 2.0 * aspect;
          var psy = (p.y - 0.5) * 2.0;
          var dark = 0;
          for (var mi = 0; mi < marks.length; mi++) {
            var mm = marks[mi];
            var mr = Math.max(0.045, mm.rNow * 2.3);
            var md = Math.hypot(psx - mm.x, psy - mm.y);
            var mq = md / mr;
            dark += mm.opacity * Math.exp(-mq * mq * 1.5);
          }
          p.dark = Math.min(1, dark * 2.1);
        }
      }

      function uploadParticles() {
        if (!particleProgram) return;
        var toU = 0.5 / (canvas.width / Math.max(1, canvas.height));
        for (var i = 0; i < activeParticles; i++) {
          var p = particles[i];
          var base = i * 12;
          var ux = p.vx * toU;
          var uy = p.vy * 0.5;
          var lag = 0.030 + Math.min(0.070, Math.hypot(p.vx, p.vy) * 0.06);
          var lightOut = 1.0 - p.dark * 0.93;
          for (var k = 0; k < 3; k++) {
            var at = base + k * 4;
            var back = lag * k;
            particleData[at] = p.x - ux * back;
            particleData[at + 1] = p.y - uy * back;
            particleData[at + 2] = p.size * (1.0 - k * 0.24);
            particleData[at + 3] = p.bright * (1.0 - k * 0.30) * lightOut;
          }
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, particleBuffer);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, particleData);
      }

      function drawParticles() {
        if (!particleProgram || !particleVao) return;
        gl.useProgram(particleProgram);
        gl.bindVertexArray(particleVao);
        gl.uniform2f(particleUniforms.res, canvas.width, canvas.height);
        particlePalette.set(paletteLinear);
        particlePalette[9] = inkLinear[3];
        particlePalette[10] = inkLinear[4];
        particlePalette[11] = inkLinear[5];
        particlePalette[12] = inkLinear[6];
        particlePalette[13] = inkLinear[7];
        particlePalette[14] = inkLinear[8];
        gl.uniform3fv(particleUniforms.pal, particlePalette);
        // Under the open sky the dust is a few faint motes, not the subject.
        gl.uniform1f(particleUniforms.dim, 1 - 0.6 * skyAmount);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
        gl.drawArrays(gl.POINTS, 0, activeParticles * 3);
        gl.disable(gl.BLEND);
        gl.bindVertexArray(vao);
      }


      function saveTune() {
        try { localStorage.setItem('opal.tune', JSON.stringify(settings)); } catch (e) { /* private */ }
      }

      function updateInkPreview() {
        inkPreview.style.background = 'linear-gradient(90deg, ' + settings.ink0 + ', ' + settings.ink1 + ' 50%, ' + settings.ink2 + ')';
      }

      function writeInk() {
        for (var i = 0; i < 3; i++) {
          var c = hexToRgb(settings['ink' + i]);
          inkLinear[i * 3] = linear(c.r);
          inkLinear[i * 3 + 1] = linear(c.g);
          inkLinear[i * 3 + 2] = linear(c.b);
        }
        gl.useProgram(program);
        gl.uniform3fv(uniforms.ink, inkLinear);
        gl.uniform1f(uniforms.inkCurve, settings.curve);
        updateInkPreview();
      }

      function syncTuneControls() {
        brushInput.value = settings.brush.toFixed(2);
        trailInput.value = settings.trail.toFixed(1);
        particlesInput.value = String(Math.round(settings.particles));
        velocityInput.value = settings.velocity.toFixed(2);
        veilInput.value = settings.veil.toFixed(2);
        ink0Input.value = settings.ink0;
        ink1Input.value = settings.ink1;
        ink2Input.value = settings.ink2;
        curveInput.value = settings.curve.toFixed(2);
        paceInput.value = settings.pace.toFixed(2);
        paceOut.textContent = settings.pace.toFixed(2);
        brushOut.textContent = settings.brush.toFixed(2);
        trailOut.textContent = settings.trail.toFixed(1);
        particlesOut.textContent = String(Math.round(settings.particles));
        velocityOut.textContent = settings.velocity.toFixed(2);
        veilOut.textContent = settings.veil.toFixed(2);
        curveOut.textContent = settings.curve.toFixed(2);
        updateInkPreview();
      }

      function tuneChanged(e) {
        var id = e.target && e.target.id;
        if (id === 'brush') settings.brush = Math.max(0.4, Math.min(1.4, parseFloat(e.target.value) || TUNE_DEFAULTS.brush));
        else if (id === 'trail') settings.trail = Math.max(0.3, Math.min(8, parseFloat(e.target.value) || TUNE_DEFAULTS.trail));
        else if (id === 'particles') {
          settings.particles = Math.max(150, Math.min(MAX_PARTICLES, parseInt(e.target.value, 10) || TUNE_DEFAULTS.particles));
          activeParticles = Math.round(settings.particles);
        } else if (id === 'velocity') settings.velocity = Math.max(0, Math.min(2.5, parseFloat(e.target.value)));
        else if (id === 'veil') settings.veil = Math.max(0.3, Math.min(1.6, parseFloat(e.target.value) || TUNE_DEFAULTS.veil));
        else if (id === 'pace') settings.pace = Math.max(0.2, Math.min(2.5, parseFloat(e.target.value) || TUNE_DEFAULTS.pace));
        else if (id === 'ink0' || id === 'ink1' || id === 'ink2') {
          settings[id] = e.target.value;
          writeInk();
        } else if (id === 'curve') {
          settings.curve = Math.max(-1, Math.min(1, parseFloat(e.target.value) || 0));
          writeInk();
        } else return;
        syncTuneControls();
        saveTune();
      }


      function useWritePreset() {
        settings.brush = 0.62;
        settings.trail = Math.max(4.0, settings.trail);
        syncTuneControls();
        saveTune();
      }


      function erodeForTrail() {
        if (settings.trail >= 7.95) return 0;
        var t = Math.max(0.3, Math.min(8, settings.trail));
        return 0.38 * (1 - Math.pow(t / 8, 0.55));
      }

      function resetTune() {
        settings.brush = TUNE_DEFAULTS.brush;
        settings.trail = TUNE_DEFAULTS.trail;
        settings.particles = TUNE_DEFAULTS.particles;
        settings.velocity = TUNE_DEFAULTS.velocity;
        settings.veil = TUNE_DEFAULTS.veil;
        settings.ink0 = TUNE_DEFAULTS.ink0;
        settings.ink1 = TUNE_DEFAULTS.ink1;
        settings.ink2 = TUNE_DEFAULTS.ink2;
        settings.curve = TUNE_DEFAULTS.curve;
        settings.pace = TUNE_DEFAULTS.pace;
        activeParticles = Math.round(settings.particles);
        syncTuneControls();
        writeInk();
        saveTune();
      }

      function stillVeil() {
        stillMode = true;
        marks.length = 0;
        shocks.length = 0;
        clearMask();
        lights.length = 0;
        attractors.length = 0;
        lightData.fill(0);
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.vx *= 0.12;
          p.vy *= 0.12;
          p.fade = 1;
          p.energy = 0;
          p.flash = 0;
          p.bright = 0.025;
        }
        nextPulse = time + 100000;
      }

      function setRide(on, quiet) {
        ride = !!on;
        rideButton.setAttribute('aria-pressed', ride ? 'true' : 'false');
        rideButton.setAttribute('aria-label', 'ride beneath the pines: ' + (ride ? 'on' : 'off'));
        if (!quiet) {
          try { localStorage.setItem('opal.void.ride', ride ? 'on' : 'off'); } catch (e) { /* private */ }
        }
      }

      function setPines(fine, quiet) {
        pinesFine = !!fine;
        pinesButton.setAttribute('aria-pressed', pinesFine ? 'true' : 'false');
        pinesButton.innerHTML = 'pines &middot; ' + (pinesFine ? 'fine' : 'classic');
        if (!quiet) {
          try { localStorage.setItem('opal.void.pines', pinesFine ? 'fine' : 'classic'); } catch (e) { /* private */ }
        }
      }

      function setSky(on, quiet) {
        sky = !!on;
        skyHealAcc = 0;
        skyButton.setAttribute('aria-pressed', sky ? 'true' : 'false');
        skyButton.setAttribute('aria-label', 'the night sky: ' + (sky ? 'on' : 'off'));
        if (!quiet) {
          try { localStorage.setItem('opal.void.sky', sky ? 'on' : 'off'); } catch (e) { /* private */ }
        }
      }

      function setTuneOpen(open) {
        if (open) document.body.classList.add('tuning');
        else document.body.classList.remove('tuning');
        tuneButton.setAttribute('aria-expanded', open ? 'true' : 'false');
        panel.setAttribute('aria-hidden', open ? 'false' : 'true');
      }

      function resize() {
        var w = window.innerWidth || document.documentElement.clientWidth || 1;
        var h = window.innerHeight || document.documentElement.clientHeight || 1;
        var dpr = Math.min(window.devicePixelRatio || 1, 1.55);
        var cw = Math.max(1, Math.round(w * dpr));
        var ch = Math.max(1, Math.round(h * dpr));
        var maxPixels = 2100000;
        if (cw * ch > maxPixels) {
          var scale = Math.sqrt(maxPixels / (cw * ch));
          cw = Math.max(1, Math.round(cw * scale));
          ch = Math.max(1, Math.round(ch * scale));
        }
        if (canvas.width !== cw || canvas.height !== ch) {
          canvas.width = cw;
          canvas.height = ch;
          gl.viewport(0, 0, cw, ch);
        }
      }

      function dismissHintSoon() {
        if (engaged) return;
        engaged = true;
        clearTimeout(hintTimer);
        hintTimer = setTimeout(function () { hint.classList.add('gone'); }, 2800);
      }

      function updateOrb(dt) {
        var idle = smoothstep(2.6, 9.0, (performance.now() - lastActivity) / 1000);
        var auto = autoTarget();
        var tx;
        var ty;

        if (!hasMoved) {
          if (reduceMotion) {
            tx = 0;
            ty = 0;
          } else {
            tx = auto.x;
            ty = auto.y;
          }
        } else if (reduceMotion || press > 0.02) {
          tx = user.x;
          ty = user.y;
        } else {
          var blend = idle * 0.88;
          tx = user.x + (auto.x - user.x) * blend;
          ty = user.y + (auto.y - user.y) * blend;
        }

        previousPointer.x = pointer.x;
        previousPointer.y = pointer.y;
        var follow = down ? 1.0 : Math.min(1, dt * 4.0);
        pointer.x += (tx - pointer.x) * follow;
        pointer.y += (ty - pointer.y) * follow;

        if (dt > 0.0001) {
          var vx = (pointer.x - previousPointer.x) / dt * 0.045;
          var vy = (pointer.y - previousPointer.y) / dt * 0.045;
          pointerVel.x += (clamp(vx, -2, 2) - pointerVel.x) * Math.min(1, dt * 7);
          pointerVel.y += (clamp(vy, -2, 2) - pointerVel.y) * Math.min(1, dt * 7);
        }

        press += (pressTarget - press) * Math.min(1, dt * 7);
      }

      function frame(now) {
        if (!running) return;
        raf = requestAnimationFrame(frame);
        if (!last) last = now;
        var dt = (now - last) / 1000;
        last = now;
        if (dt > 0.06) dt = 0.06;
        if (dt < 0) dt = 0;
        time += dt * 0.92;
        if (!reduceMotion && !down && time > nextPulse) {
          addShock(pointer.x, pointer.y, 0.26);
          burstParticles(pointer.x, pointer.y, 8, 0.42);
          impulseParticles(pointer.x, pointer.y, 0.40, 0.14);
          nextPulse = time + 8 + Math.random() * 7;
        }

        updateOrb(dt);

        // The pines keep passing while the ride fades in and out.
        rideAmount += ((ride ? 1 : 0) - rideAmount) * Math.min(1, dt * 1.3);
        if (rideAmount < 0.001 && !ride) rideAmount = 0;
        if (rideAmount > 0) travel += dt * 0.16 * settings.pace * (reduceMotion ? 0.35 : 1);

        // The wind only blows under the sky; the void keeps its mask still.
        skyAmount += ((sky ? 1 : 0) - skyAmount) * Math.min(1, dt * 1.1);
        if (Math.abs(skyAmount - (sky ? 1 : 0)) < 0.001) skyAmount = sky ? 1 : 0;
        drift += dt * SKY_WIND * skyAmount * (reduceMotion ? 0.35 : 1);

        if (paletteMix < 1) {
          paletteMix = Math.min(1, paletteMix + dt / 0.95);
          writePalette();
        }

        fadeMask(dt);
        updateMarks(dt);
        updateShocks();
        updateLights(dt);
        updateAttractors();
        updateAudio(dt);
        updateParticles(dt);
        uploadParticles();
        uploadLights();
        uploadMask();
        stepFlow(dt);
        gl.useProgram(program);
        uploadMarks();
        gl.uniform4fv(uniforms.shocks, shockData);
        gl.uniform4fv(uniforms.lights, lightData);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, maskTexture);
        gl.uniform1i(uniforms.mask, 0);
        gl.uniform2f(uniforms.res, canvas.width, canvas.height);
        gl.uniform1f(uniforms.time, time);
        gl.uniform2f(uniforms.pointer, pointer.x, pointer.y);
        gl.uniform2f(uniforms.pointerVel, pointerVel.x, pointerVel.y);
        gl.uniform1f(uniforms.press, press);
        gl.uniform1f(uniforms.veil, settings.veil);
        gl.uniform1f(uniforms.erode, erodeForTrail());
        gl.uniform1f(uniforms.ride, rideAmount);
        gl.uniform1f(uniforms.travel, travel);
        gl.uniform1f(uniforms.pines, pinesFine ? 1 : 0);
        gl.uniform1f(uniforms.sky, skyAmount);
        gl.uniform1f(uniforms.drift, drift);
        gl.uniform1f(uniforms.flowOn, flowOK ? 1 : 0);
        if (flowOK) {
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, flow.m[flow.cur].tex);
          gl.uniform1i(uniforms.flow, 1);
          gl.activeTexture(gl.TEXTURE2);
          gl.bindTexture(gl.TEXTURE_2D, flow.v[flow.cur].tex);
          gl.uniform1i(uniforms.wind, 2);
          gl.activeTexture(gl.TEXTURE0);
        }
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        drawParticles();

        if (!document.body.classList.contains('ready')) document.body.classList.add('ready');
      }

      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      function syncActiveState() {
        var anyPainting = false;
        active.forEach(function (state) { if (state.painting) anyPainting = true; });
        painting = anyPainting;
        pressTarget = active.size > 0 ? 1 : 0;
        if (active.size > 0) document.body.classList.add('dragging');
        else document.body.classList.remove('dragging');
      }

      function reflectBrushMode() {
        document.body.classList.toggle('light-mode', lightMode);
        if (modeName) modeName.textContent = lightMode ? 'brush · light' : 'brush · dark';
        if (modeChip) {
          modeChip.setAttribute('aria-label', 'brush: ' + (lightMode ? 'light' : 'dark') + '; double-tap to switch');
        }
      }

      function toggleBrushMode() {
        lightMode = !lightMode;
        reflectBrushMode();
        audio.contact(lightMode ? 'light' : 'dark', scenePan(pointer.x), 0.5);
        try {
          if (navigator.vibrate) navigator.vibrate(lightMode ? [10, 28, 14] : 12);
        } catch (err) { /* vibration is optional */ }
      }

      canvas.addEventListener('pointerdown', function (e) {
        if (e.button !== undefined && e.button !== 0 && e.button !== 2) return;
        var isTouch = e.pointerType === 'touch';
        // Mouse/pen keeps its single-pointer left/right behavior.
        if (!isTouch && active.size > 0) return;
        e.preventDefault();
        unlockAudio();
        lastActivity = performance.now();
        dismissHintSoon();
        pressTarget = 1;
        nextPulse = time + 7 + Math.random() * 5;
        stillMode = false;
        document.body.classList.add('dragging');

        var pos = toScene(e.clientX, e.clientY);
        var now = performance.now();
        var lone = active.size === 0;
        var tapToggle = false;
        if (isTouch) {
          document.body.classList.add('touch');
          if (lone && lastTapAt && now - lastTapAt < TAP_MS &&
              Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 32) {
            // Hold the flip until release: if this second touch turns into a
            // drag, it should paint instead of switching the brush.
            tapToggle = true;
            lastTapAt = 0;
            if (pendingTapBloom) {
              clearTimeout(pendingTapBloom);
              pendingTapBloom = 0;
            }
          }
        }

        var kind = isTouch ? (lightMode ? 'light' : 'dark') : (e.button === 2 ? 'light' : 'dark');

        var state = {
          id: e.pointerId,
          kind: kind,
          touch: isTouch,
          lone: lone,
          tapToggle: tapToggle,
          sx: pos.x,
          sy: pos.y,
          x: pos.x,
          y: pos.y,
          px: e.clientX,
          py: e.clientY,
          moved: false,
          seeded: false,
          painting: false,
          lastPaint: { x: pos.x, y: pos.y },
          lastPaintAt: time,
          lastLight: { x: pos.x, y: pos.y },
          lastLightAt: time
        };
        active.set(e.pointerId, state);
        if (!down) {
          down = state;
          user.x = pos.x;
          user.y = pos.y;
          hasMoved = true;
          pointer.x = pos.x;
          pointer.y = pos.y;
        }
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        if (!tapToggle) audio.contact(kind, scenePan(pos.x), 0.75);
        if (!isTouch && e.button !== 2) addMark(pos.x, pos.y, 0.125, 18, 0.90, 0.20);
        syncActiveState();
      });

      window.addEventListener('pointermove', function (e) {
        var state = active.get(e.pointerId);
        if (!state) {
          if (e.target !== canvas) return;
          lastActivity = performance.now();
          var hover = toScene(e.clientX, e.clientY);
          user.x = hover.x;
          user.y = hover.y;
          hasMoved = true;
          return;
        }

        lastActivity = performance.now();
        var pos = toScene(e.clientX, e.clientY);
        state.x = pos.x;
        state.y = pos.y;

        if (!state.moved && Math.hypot(e.clientX - state.px, e.clientY - state.py) > 7) {
          state.moved = true;
          state.painting = true;
          state.tapToggle = false;
        }

        if (state === down) {
          user.x = pos.x;
          user.y = pos.y;
          hasMoved = true;
        }

        if (state.painting) {
          if (state.kind === 'light') {
            if (!state.seeded) {
              state.lastLight = null;
              paintLightAt(state.sx, state.sy, state);
              state.seeded = true;
            }
            paintLightAt(pos.x, pos.y, state);
          } else {
            if (!state.seeded) {
              state.lastPaint = null;
              paintAt(state.sx, state.sy, false, state);
              state.seeded = true;
            }
            var from = state.lastPaint || { x: state.sx, y: state.sy };
            var gap = Math.hypot(pos.x - from.x, pos.y - from.y);
            var steps = Math.min(3, Math.max(1, Math.ceil(gap / 0.040)));
            for (var st = 1; st < steps; st++) {
              var f = st / steps;
              paintAt(from.x + (pos.x - from.x) * f, from.y + (pos.y - from.y) * f, true, state);
            }
            paintAt(pos.x, pos.y, false, state);
            if (sky && flowOK) gustAt(pos.x, pos.y, state);
          }
        }
        syncActiveState();
      }, { passive: true });

      function release(e) {
        var state = active.get(e.pointerId);
        if (!state) return;
        active.delete(e.pointerId);

        if (down === state) {
          down = null;
          active.forEach(function (remaining) { if (!down) down = remaining; });
          if (down) {
            user.x = down.x;
            user.y = down.y;
            hasMoved = true;
          }
        }

        if (!state.moved) {
          if (state.tapToggle) {
            if (e.type === 'pointerup' && active.size === 0) toggleBrushMode();
          } else if (state.touch && state.lone && active.size === 0) {
            // Hold the tap's bloom so a second tap can flip the brush instead.
            lastTapAt = performance.now();
            lastTapX = state.px;
            lastTapY = state.py;
            pendingTapKind = state.kind;
            clearTimeout(pendingTapBloom);
            pendingTapBloom = setTimeout(function () {
              pendingTapBloom = 0;
              lastTapAt = 0;
              if (pendingTapKind === 'light') lightBloom(state.sx, state.sy);
              else bloom(state.sx, state.sy);
            }, TAP_BLOOM_MS);
          } else if (state.kind === 'light') {
            lightBloom(state.sx, state.sy);
          } else {
            bloom(state.sx, state.sy);
          }
        }

        if (active.size === 0) {
          painting = false;
          pressTarget = 0;
          document.body.classList.remove('dragging');
        } else {
          syncActiveState();
        }
      }

      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
      window.addEventListener('blur', function () {
        active.clear();
        down = null;
        painting = false;
        pressTarget = 0;
        document.body.classList.remove('dragging');
        if (pendingTapBloom) { clearTimeout(pendingTapBloom); pendingTapBloom = 0; }
        lastTapAt = 0;
      });

      moodButton.addEventListener('click', function () {
        setMood(moodIndex + 1, false);
        lastActivity = performance.now();
      });

      soundButton.addEventListener('click', function () {
        setSound(!audio.wanted);
        lastActivity = performance.now();
      });

      tuneButton.addEventListener('click', function () {
        setTuneOpen(!document.body.classList.contains('tuning'));
      });
      panelClose.addEventListener('click', function () { setTuneOpen(false); });
      rideButton.addEventListener('click', function () {
        setRide(!ride);
        lastActivity = performance.now();
      });
      skyButton.addEventListener('click', function () {
        setSky(!sky);
        lastActivity = performance.now();
      });
      [brushInput, trailInput, particlesInput, velocityInput, veilInput, curveInput, paceInput, ink0Input, ink1Input, ink2Input].forEach(function (input) {
        input.addEventListener('input', tuneChanged);
      });
      stillButton.addEventListener('click', stillVeil);
      writeButton.addEventListener('click', useWritePreset);
      resetButton.addEventListener('click', resetTune);

      document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        var tag = e.target && e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (e.key === 'm' || e.key === 'M') {
          setMood(moodIndex + 1, false);
          e.preventDefault();
        } else if (e.key === 't' || e.key === 'T') {
          setTuneOpen(!document.body.classList.contains('tuning'));
          e.preventDefault();
        } else if (e.key === 'Escape') {
          setTuneOpen(false);
        } else if (e.key === 'c' || e.key === 'C') {
          stillVeil();
          e.preventDefault();
        } else if (e.key === 's' || e.key === 'S') {
          setSound(!audio.wanted);
          e.preventDefault();
        } else if (e.key === 'r' || e.key === 'R') {
          setRide(!ride);
          e.preventDefault();
        } else if (e.key === 'p' || e.key === 'P') {
          setPines(!pinesFine);
          e.preventDefault();
        } else if (e.key === 'k' || e.key === 'K') {
          setSky(!sky);
          e.preventDefault();
        }
      });

      window.addEventListener('resize', resize);

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          running = false;
          cancelAnimationFrame(raf);
          audio.suspend();
        } else if (!running) {
          running = true;
          last = 0;
          audio.resume();
          raf = requestAnimationFrame(frame);
        }
      });

      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
        hint.innerHTML = 'drag: part &middot; double-tap: switch';
        var panelHint = document.querySelector('.panel-hint');
        if (panelHint) panelHint.innerHTML = 'drag &middot; part &nbsp; double-tap &middot; switch';
      }


      var savedSound = false;
      try { savedSound = localStorage.getItem('opal.void.sound') === 'on'; } catch (e) { /* private */ }
      if (!audio.supported) {
        soundButton.disabled = true;
        soundButton.title = 'sound unavailable';
      } else if (savedSound) {
        audio.wanted = true;
      }
      reflectSound();

      var savedRide = false;
      try { savedRide = localStorage.getItem('opal.void.ride') === 'on'; } catch (e) { /* private */ }
      setRide(savedRide, true);
      var savedPines = 'fine';
      try { savedPines = localStorage.getItem('opal.void.pines') || 'fine'; } catch (e) { /* private */ }
      setPines(savedPines !== 'classic', true);
      pinesButton.addEventListener('click', function () { setPines(!pinesFine); });

      // The sky is the default scene; the void is one tap of `sky` away.
      var savedSky = true;
      try { savedSky = localStorage.getItem('opal.void.sky') !== 'off'; } catch (e) { /* private */ }
      setSky(savedSky, true);
      skyAmount = sky ? 1 : 0;

      function start() {
        setMoodFromStore();
        syncTuneControls();
        writeInk();
        reflectBrushMode();
        initMaskTexture();
        resize();
        raf = requestAnimationFrame(frame);
        hintTimer = setTimeout(function () { hint.classList.add('gone'); }, 11000);
      }

      start();
    })();
  </script>
</body>
</html>
