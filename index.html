  // The dense crown behind the skirt: a lumpy edge, opened by a few holes of
  // sky toward the branch tips.
  float clump = vnoise(vec2(ax, s) * (30.0 / size) + hv * 91.0 + id * 3.1);
  float lump = vnoise(vec2(ax * 90.0 / size, id * 5.3 + hv * 17.0)) * 0.65
             + vnoise(vec2(ax * 260.0 / size, id * 2.1 + hv * 5.0)) * 0.35;
  float holes = smoothstep(0.55, 0.95, ub) * smoothstep(0.58, 0.78, clump);
  float massAt = nl * (0.80 + 0.90 * (lump - 0.5)) * slopeFix;
  // Above the tip the outline has no width and slopeFix is zero, which would
  // put every pixel there exactly on this edge: a half-tone bar across the tip.
  float mass = smoothstep(-aa, aa, ds * slopeFix - massAt) * (1.0 - holes) * step(0.0, s);
  // The leader: the first tier is a solid point. Left to the tier pattern it
  // opens on a thin core strip that pokes out past the tip like a stalk.
  float lead = 1.0 - smoothstep(0.9, 1.6, s / tierLen);
  float coneW = body * (0.55 + 0.25 * lump);
  mass = max(mass, lead * smoothstep(aa, -aa, ax - coneW) * step(0.0, s));

  float top = smoothstep(-0.012, 0.0, s);
  float cov = max(mass, max(needles, rib * 0.95)) * top;
  fringe = max(needles, rib) * (1.0 - mass) * top;
  shade = (1.0 - smoothstep(0.0, 0.9, ub)) * mass;
  return cov;
}

vec3 segT(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return vec3(length(pa - ba * h), h, 0.0);
}

// Now and then a needle pair lets go: it drifts with the wind, sways, tumbles
// edge-on and back, and grows as it falls toward you until it slips out of
// focus. Cells over the scrolled sky each roll a long cycle; most stay empty,
// and the open middle of the sky, far from the trees, seldom gets one.
vec4 fallingNeedles(vec2 p, vec2 ext, float lit, float t) {
  float px = 1.0 / min(uRes.x, uRes.y);
  float cell = 0.5;
  vec2 fp = vec2(p.x, p.y + uTravel * 0.85);
  vec2 c0 = floor(fp / cell);
  float cover = 0.0;
  float dry = 0.0;
  float glint = 0.0;
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 cid = c0 + vec2(float(i), float(j));
      vec2 hc = hash22(cid * 1.37 + 4.1);
      float period = 24.0 + 20.0 * hc.x;
      float cyc = t / period + hc.y;
      float k0 = floor(cyc);
      float age = fract(cyc) * period;
      vec2 hr = hash22(cid + k0 * 7.31 + 0.5);
      float life = 7.0 + 5.0 * hr.x;
      if (age > life) continue;
      vec2 start = (cid + hash22(cid * 0.71 + k0 * 1.93 + 9.0)) * cell;
      float fromTrees = smoothstep(0.20, 0.55, abs(start.x) / ext.x);
      if (hr.y > 0.42 * fromTrees) continue;
      vec2 hq = hash22(cid * 3.3 + k0 * 2.17 + 1.7);
      float k = age / life;

      float gust = pineGust(start, t);
      vec2 center = start
        + PINE_WIND * (0.10 + 0.16 * hq.x + 0.10 * gust) * k * (1.0 + 0.6 * k)
        + vec2(sin(age * 1.15 + hq.y * TAU), 0.6 * sin(age * 0.83 + hq.x * TAU)) * (0.018 + 0.012 * hq.y)
        + normalize(start + 1e-3) * 0.05 * k * k;
      vec2 lp = fp - center;
      if (dot(lp, lp) > 0.04) continue;

      float scale = mix(0.8, 2.4, k * k) * (0.8 + 0.4 * hq.y);
      float fade = smoothstep(0.0, 0.12, k) * (1.0 - smoothstep(0.72, 1.0, k));
      float blur = px * (1.0 + 7.0 * smoothstep(0.55, 1.0, k));
      float spin = (hq.y > 0.5 ? 1.0 : -1.0) * (0.35 + 0.6 * hq.y);
      float ang = hq.x * TAU + age * spin + 0.5 * sin(age * 1.7 + hq.x * 9.0);
      float turn = cos(age * (0.5 + 0.5 * hq.x) + hq.y * 5.0);
      float flip = 0.30 + 0.70 * abs(turn);
      float len = 0.050 * scale * flip;
      float spread = 0.16 + 0.07 * sin(age * 0.9 + hq.x * 4.0);
      vec2 d0 = vec2(cos(ang), sin(ang));
      vec2 base = -d0 * len * 0.5;
      vec3 a1 = segT(lp, base, base + vec2(cos(ang + spread), sin(ang + spread)) * len);
      vec3 a2 = segT(lp, base, base + vec2(cos(ang - spread), sin(ang - spread)) * len);
      if (hq.x < 0.22) a2.x = 1e3;
      float th = 0.0011 * scale;
      float e1 = a1.x - th * (1.0 - 0.6 * a1.y);
      float e2 = a2.x - th * (1.0 - 0.6 * a2.y);
      float sheath = length(lp - base) - th * 1.5;
      float e = min(min(e1, e2), sheath);
      float m = (1.0 - smoothstep(-blur, blur, e)) * clamp((th + px) / (th + blur), 0.2, 1.0) * fade;
      if (m > cover) {
        cover = m;
        dry = step(0.7, hc.x);
        // Turned flat to the sky, the waxy needle catches a little of it.
        glint = smoothstep(0.80, 1.0, abs(turn));
      }
    }
  }
  vec3 green = vec3(0.010, 0.022, 0.012) + uPal[2] * 0.05;
  vec3 brown = vec3(0.030, 0.020, 0.011) + uPal[2] * 0.04;
  vec3 c = mix(green, brown, dry) + vec3(0.010, 0.030, 0.013) * lit * 2.2;
  c += (uPal[3] * 0.05 + vec3(0.004, 0.010, 0.005)) * glint;
  c += LAMP_WARM * 0.22 * gLampL * (0.6 + 0.8 * glint);
  return vec4(c, cover);
}

// ---------------------------------------------------------------------------
// Creatures in the pines: now and then a tree holds a squirrel, a nest or a
// bird, a dark shape among the needles. The camera's flash catches their
// eyes; now and then a creepy one's eyes shine red.
#define CRITTER_SHARE 0.42   // share of trees with a creature
#define CRITTER_RED 0.14     // share of creatures whose eyes shine red

float cEll(vec2 p, vec2 c, vec2 r, float pu) {
  float d = length((p - c) / r) - 1.0;
  float aa = pu / min(r.x, r.y);
  return 1.0 - smoothstep(-aa, aa, d);
}

// One eye's answer to the flash: a hard point, a soft halo and a little cross.
void eyeLight(vec2 p, vec2 e, float g, float red) {
  if (g <= 0.0) return;
  vec2 r = p - e;
  float r2 = dot(r, r);
  vec3 ec = red > 0.5 ? vec3(1.0, 0.09, 0.04) : vec3(1.0, 0.97, 0.90);
  float core = exp(-r2 / 0.0055);
  float halo = exp(-sqrt(r2) / 0.16) * 0.20;
  float spikes = (exp(-abs(r.x) * 34.0 - abs(r.y) * 2.6) + exp(-abs(r.y) * 34.0 - abs(r.x) * 2.6)) * 0.12;
  gEyes += ec * (core * 1.6 + halo + spikes) * g;
}

// p: the creature's own frame (x forward, y up, 1 = its size); pu: one screen
// pixel in those units; kind 0 squirrel, 1 nest, 2 bird; g: how hard its eyes
// shine. rgb: colour, a: coverage.
vec4 critter(vec2 p, float pu, float kind, float red, float g, float lit, float lampK, vec2 lampDir) {
  float cov = 0.0;
  float eyeW = 0.0;
  // Warm grey fur and feathers, a shade lighter than the needles, lighter on
  // top where the sky reaches.
  vec3 col = vec3(0.022, 0.017, 0.0125) * (0.60 + 0.65 * smoothstep(-0.9, 1.1, p.y));
  if (kind < 0.5) {
    // A squirrel on a branch, its tail a plume up its back, curling over.
    float fuzz = (vnoise(p * 9.0) - 0.5) * 0.18;
    cov = max(cov, cEll(p, vec2(0.0, -0.15), vec2(0.50, 0.62), pu));
    cov = max(cov, cEll(p, vec2(0.42, 0.52), vec2(0.34, 0.30), pu));
    cov = max(cov, cEll(p, vec2(0.30, 0.86), vec2(0.07, 0.16), pu));
    cov = max(cov, cEll(p, vec2(0.22, -0.72), vec2(0.30, 0.12), pu));
    cov = max(cov, cEll(p, vec2(-0.62, 0.30), vec2(0.40 + fuzz, 0.95 + fuzz), pu));
    cov = max(cov, cEll(p, vec2(-0.30, 1.12), vec2(0.42 + fuzz, 0.26 + fuzz * 0.5), pu));
    vec2 e = vec2(0.53, 0.58);
    eyeW = cEll(p, e, vec2(0.065), pu);
    eyeLight(p, e, g, red);
    cov = max(cov, smoothstep(pu, -pu, abs(p.y + 0.86) - 0.08) * step(abs(p.x), 1.6));
  } else if (kind < 1.5) {
    // A nest: a ragged bowl of twigs, and something in it peering over the rim.
    float fuzz = (vnoise(p * 12.0) - 0.5) * 0.22;
    float bowl = cEll(p, vec2(0.0, -0.28), vec2(1.05 + fuzz, 0.50 + fuzz), pu)
               * smoothstep(0.06 + pu, 0.06 - pu, p.y - fuzz * 0.4);
    float head = cEll(p, vec2(0.04, 0.10), vec2(0.36, 0.28), pu);
    cov = max(bowl, head);
    col *= mix(1.0, 0.75 + 0.6 * vnoise(p * vec2(26.0, 9.0)), bowl);
    vec2 e1 = vec2(-0.09, 0.14);
    vec2 e2 = vec2(0.17, 0.14);
    eyeW = max(cEll(p, e1, vec2(0.055), pu), cEll(p, e2, vec2(0.055), pu));
    eyeLight(p, e1, g, red);
    eyeLight(p, e2, g, red);
    cov = max(cov, smoothstep(pu, -pu, abs(p.y + 0.80) - 0.07) * step(abs(p.x), 1.5));
  } else {
    // A small bird, fluffed up on a twig.
    vec2 bp = rot(0.25) * p;
    cov = max(cov, cEll(bp, vec2(0.0), vec2(0.55, 0.40), pu));
    cov = max(cov, cEll(p, vec2(0.42, 0.36), vec2(0.27, 0.25), pu));
    cov = max(cov, cEll(p, vec2(0.72, 0.32), vec2(0.16, 0.05), pu));
    cov = max(cov, cEll(rot(-0.5) * (p - vec2(-0.62, -0.22)), vec2(0.0), vec2(0.40, 0.09), pu));
    vec2 e = vec2(0.50, 0.42);
    eyeW = cEll(p, e, vec2(0.06), pu);
    eyeLight(p, e, g, red);
    cov = max(cov, smoothstep(pu, -pu, abs(p.y + 0.52) - 0.06) * step(abs(p.x), 1.3));
  }
  col += vec3(0.010, 0.008, 0.006) * lit;
  // Lamplight on the fur or feathers, on the side that faces the lamp.
  if (lampK > 0.002) {
    float facing = clamp(0.5 + 0.6 * dot(normalize(p + vec2(0.0, 0.12)), lampDir), 0.0, 1.0);
    col += LAMP_WARM * 0.34 * lampK * (0.28 + 0.72 * facing);
  }
  // The whites of the eyes: faint until the flash finds them.
  col = mix(col, vec3(0.085, 0.082, 0.076), eyeW);
  return vec4(col, cov);
}

// A streetlamp seen from below, like the pines: the post comes in from the
// edge of the view, bends over the path on a short arm, and ends in a head
// whose lens faces you. rgb: colour, a: coverage.
vec4 lampBody(vec2 p) {
  vec2 h = uLamp.xy;
  vec2 td = normalize(h);
  vec2 perp = vec2(-td.y, td.x);
  if (perp.y < 0.0) perp = -perp;
  float px = 2.0 / (min(uRes.x, uRes.y) * uView.z);
  vec2 bend = h + td * 0.105 - perp * 0.055;
  vec2 ctrl = bend - td * 0.060;
  vec2 foot = h + td * 3.2;

  vec3 post = segT(p, foot, bend);
  float d = post.x - mix(0.030, 0.0072, pow(post.y, 3.0));
  vec2 prev = bend;
  for (int i = 1; i <= 4; i++) {
    float t = float(i) / 4.0;
    vec2 q = mix(mix(bend, ctrl, t), mix(ctrl, h, t), t);
    d = min(d, segT(p, prev, q).x - 0.0058);
    prev = q;
  }
  vec2 u = normalize(h - ctrl);
  vec2 v = vec2(-u.y, u.x);
  vec2 lp = vec2(dot(p - h, u), dot(p - h, v));
  float hd = (length(lp / vec2(0.040, 0.018)) - 1.0) * 0.018;
  d = min(d, hd);
  float cover = 1.0 - smoothstep(-px, px, d);
  if (cover <= 0.0) return vec4(0.0);

  // Dark metal, with a little of its own light along the edges.
  vec3 col = vec3(0.0065, 0.0065, 0.0075) + LAMP_WARM * 0.10 * gLampL;
  float lens = 1.0 - smoothstep(-px, px, (length(lp / vec2(0.029, 0.0115)) - 1.0) * 0.0115);
  float hot = exp(-dot(lp / vec2(0.020, 0.0075), lp / vec2(0.020, 0.0075)));
  vec3 glass = vec3(0.016, 0.013, 0.010) + (LAMP_WARM * 1.5 + vec3(1.2, 1.0, 0.75) * hot * 1.4) * uLamp.z;
  return vec4(mix(col, glass, lens), cover);
}

// The ride: three lanes of pines on each side of the path. A tip only ever
// slides straight down the view; shorter, nearer trees sit further out and
// pass faster, which is all the parallax there is.
vec4 canopy(vec2 p, float lit) {
  vec2 ext = uRes / min(uRes.x, uRes.y);
  float side = p.x < 0.0 ? -1.0 : 1.0;
  vec2 mp = vec2(abs(p.x), p.y);
  vec3 deep = vec3(0.0016, 0.0050, 0.0028);
  vec3 needle = vec3(0.010, 0.030, 0.013);
  vec3 rgb = vec3(0.0);
  float alpha = 0.0;
  bool fine = uPines > 0.5;
  bool lampOn = uLamp.w > 0.001;
  vec2 mLamp = vec2(0.0);
  if (lampOn) {
    vec2 ld = uLamp.xy - p;
    float r2 = dot(ld, ld);
    gLampL = uLamp.z * uLamp.w * (exp(-r2 / 0.11) + 0.42 * exp(-r2 / 0.62));
    ld /= sqrt(r2) + 1e-4;
    mLamp = vec2(ld.x * side, ld.y);       // toward the lamp, in the mirrored frame
    gEyes += LAMP_WARM * uLamp.z * uLamp.w *
      (exp(-r2 / 0.0014) * 0.75 + exp(-r2 / 0.012) * 0.13 + exp(-r2 / 0.14) * 0.016);
  }

  for (int L = 0; L < 3; L++) {
    float fl = float(L);
    float reach = 0.50 + 0.23 * fl;
    float lane = ext.x * reach;
    float spacing = 0.46 + 0.09 * fl;
    float scroll = uTravel * reach + fl * 3.7;
    float size = 0.80 + 0.28 * fl;
    float c0 = floor((-ext.y - 0.30 + scroll) / spacing);
    float gust = 0.0;
    vec2 wm = vec2(PINE_WIND.x * side, PINE_WIND.y);
    if (fine) gust = pineGust(vec2(p.x, p.y + scroll), uTime);
    vec3 base = deep * (1.5 - 0.3 * fl) + uPal[2] * (0.08 - 0.03 * fl);
    // A passing gust turns the needles and they catch a little more sky.
    float glow = (0.26 + 0.10 * fl) * (fine ? 0.45 + 1.4 * gust : 1.0);
    vec3 lanePm = vec3(0.0);
    float laneA = 0.0;
    // The lamp stands between the middle and the nearest lane.
    float laneLamp = gLampL * (L == 0 ? 0.55 : (L == 1 ? 1.0 : 0.82));

    for (int k = 0; k < 14; k++) {
      float c = c0 + float(k);
      vec2 hh = hash22(vec2(c, fl * 13.0 + side * 5.0 + 2.0));
      float ty = (c + 0.2 + 0.6 * hh.y) * spacing - scroll;
      if (ty > ext.y + 0.30) break;
      vec2 tip = vec2(lane * (0.86 + 0.28 * hh.x), ty);
      float sz = size * (0.80 + 0.40 * hh.y);
      vec2 td = normalize(tip);
      float tt = uTime + fl * 11.0 + hh.y * 5.0;

      // This tree's creature, if it has one: on a branch partway down from
      // the tip, swaying with the tree.
      vec4 cr = vec4(0.0);
      float ch = hash21(vec2(c * 1.37 + fl * 7.1, side * 3.3 + 11.0));
      if (ch < CRITTER_SHARE) {
        float u = ch / CRITTER_SHARE;
        float kind = floor(fract(u * 17.31) * 3.0);
        float red = step(fract(u * 93.7), CRITTER_RED);
        float sc = sz * (0.12 + 0.22 * fract(u * 41.3));
        float bodyAt = sz * (0.150 * (1.0 - exp(-sc * 5.0 / sz)) + 0.045 * sc);
        float csz = 0.024 * sz * (kind > 1.5 ? 0.8 : 1.0);
        vec2 perp = vec2(-td.y, td.x);
        vec2 c0p = tip + td * sc + perp * (fract(u * 61.9) - 0.5) * 1.1 * bodyAt;
        vec2 cd0 = mp - c0p;
        bool probing = uProbe.z > 0.5;
        if (probing || dot(cd0, cd0) < pow(2.2 * csz + 0.06 * sz, 2.0)) {
          vec2 crk = pineRock(hh.x, sz, tt);
          vec2 cd = cd0 - perp * crk.x * exp(-sc * 1.4 / sz);
          float code = fl + (side > 0.0 ? 3.0 : 0.0);
          float cmod = mod(c, 256.0);
          if (probing) {
            float dist = length(cd) - csz * 0.9;
            if (dist < gCritter.x) gCritter = vec4(dist, cmod, code, kind + 4.0 * red);
          }
          if (dot(cd, cd) < pow(2.2 * csz, 2.0)) {
            // Upright on the screen, leaning a little toward the treetop:
            // a photograph wants its subject the right way up.
            vec2 upv = normalize(vec2(-td.x * 0.35, 1.0));
            vec2 cp = vec2(dot(cd, vec2(upv.y, -upv.x)), dot(cd, upv)) / csz;
            vec2 cl = vec2(dot(mLamp, vec2(upv.y, -upv.x)), dot(mLamp, upv));
            if (fract(u * 7.7) < 0.5) { cp.x = -cp.x; cl.x = -cl.x; }
            float pu = 1.0 / (0.5 * min(uRes.x, uRes.y) * uView.z * csz);
            // Every eye in the lens catches the flash; the one photographed
            // shines on (a red one longest, flickering).
            float g = uFlash < 1.2 ? 0.55 * smoothstep(0.0, 0.03, uFlash) * exp(-uFlash * 4.5) : 0.0;
            if (uGlint.z >= 0.0 && abs(uGlint.x - cmod) < 0.5 && abs(uGlint.y - code) < 0.5) {
              float ga = uGlint.z;
              g += red > 0.5
                ? smoothstep(0.0, 0.06, ga) * exp(-ga * 0.55) * (0.85 + 0.15 * sin(ga * 23.0)) * 1.2
                : smoothstep(0.0, 0.06, ga) * exp(-ga * 1.6);
            }
            // Close to the lamp, eyes hold a faint steady shine of it.
            g += 0.22 * laneLamp * laneLamp;
            cr = critter(cp, pu, kind, red, g, lit, laneLamp, cl);
          }
        }
      }

      // One outline test for the whole tree before any of its planes.
      vec2 tr = mp - tip;
      float ts = dot(tr, td);
      if (ts < -0.03 * sz && cr.a <= 0.0) continue;
      vec2 rock = pineRock(hh.x, sz, tt);
      float tsp = max(ts, 0.0);
      float tx = dot(tr, vec2(-td.y, td.x)) - rock.x * exp(-tsp * 1.4 / sz);
      float tBody = sz * (0.150 * (1.0 - exp(-tsp * 5.0 / sz)) + 0.045 * tsp);
      if (abs(tx) > tBody + 0.05 * sz + abs(rock.y - rock.x) && cr.a <= 0.0) continue;

      // The planes stand evenly around the trunk. As the tree slides past
      // overhead you see it from a slowly changing angle, so each plane opens
      // and closes in turn while the outline, the widest of them, holds.
      float phi = ty / ext.y * 0.65 + hh.x * 3.0;
      float xs = tx < 0.0 ? -1.0 : 1.0;
      // The side of the tree that faces the lamp takes its light.
      float treeLamp = laneLamp > 0.002
        ? laneLamp * (0.22 + 0.78 * clamp(0.5 + 0.65 * dot(vec2(-td.y, td.x) * xs, mLamp), 0.0, 1.0))
        : 0.0;
      float pa[PINE_PLANES];
      float pz[PINE_PLANES];
      vec3 pc[PINE_PLANES];
      for (int j = 0; j < PINE_PLANES; j++) {
        float fj = float(j);
        float th = phi + fj * (0.5 * TAU / float(PINE_PLANES));
        float ct = cos(th);
        float face = abs(ct);
        float hv = fract(hh.x * 7.31 + fj * 0.618 + 0.13);
        // Branches differ a little in reach from one side of the trunk to
        // the next.
        float w = max(face, 0.16) * (0.92 + 0.08 * hash21(vec2(c + fj * 3.7, fl + side * 2.0)));
        float fr;
        float sh = 0.0;
        float a = fine
          ? pineFine(mp, tip, hh.x, hv, sz, tt + fj * 2.3, gust, wm, w, rock, fr, sh)
          : pine(mp, tip, hh.x, hv, sz, w, rock, fr);
        // How far toward you this plane is where the pixel meets it: x tan th,
        // eased through edge-on so a plane never jumps from back to front.
        float z = xs * sin(th) * ct / max(face, 0.25);
        float near = clamp(0.5 + 0.5 * z, 0.0, 1.0);
        // Turned edge-on, a plane's needles crowd together and lose the sky;
        // planes deep in the crown, seen through gaps, sit in its shadow.
        vec3 cj = base * (0.66 + 0.34 * face) * (0.80 + 0.32 * near);
        cj *= 1.0 - 0.35 * sh;
        cj += needle * fr * glow * (0.55 + 0.45 * face);
        cj += needle * lit * (1.5 + 2.6 * fr) * (0.70 + 0.30 * near);
        // Warm on the needle tips and the planes turned to it; the deep of
        // the crown stays dark, so the tree gets a lit edge, not a tint.
        if (treeLamp > 0.002) cj += LAMP_WARM * 0.34 * treeLamp * (0.13 + 1.55 * fr) * (0.40 + 0.60 * near) * (0.35 + 0.65 * face);
        pa[j] = a;
        pz[j] = z;
        pc[j] = cj;
      }

      // Lay the planes far to near.
      vec3 treePm = vec3(0.0);
      float treeA = 0.0;
      for (int i = 0; i < PINE_PLANES; i++) {
        int pick = 0;
        float fz = 1e8;
        for (int j = 0; j < PINE_PLANES; j++) {
          if (pz[j] < fz) { fz = pz[j]; pick = j; }
        }
        pz[pick] = 1e9;
        float a = pa[pick];
        treePm = pc[pick] * a + treePm * (1.0 - a);
        treeA = a + treeA * (1.0 - a);
      }
      // The creature sits in front of its tree's needles.
      treePm = cr.rgb * cr.a + treePm * (1.0 - cr.a);
      treeA = cr.a + treeA * (1.0 - cr.a);
      lanePm = treePm + lanePm * (1.0 - treeA);
      laneA = treeA + laneA * (1.0 - treeA);
    }

    vec3 c = lanePm / max(laneA, 1e-4);
    rgb = mix(rgb, c, laneA);
    alpha += laneA * (1.0 - alpha);

    if (L == 1 && lampOn) {
      vec4 lb = lampBody(p);
      float la = lb.a * uLamp.w;
      rgb = alpha > 0.001 ? mix(rgb, lb.rgb, la) : lb.rgb;
      alpha += la * (1.0 - alpha);
    }
  }

  if (fine) {
    vec4 fall = fallingNeedles(p, ext, lit, uTime);
    rgb = mix(alpha > 0.001 ? rgb : fall.rgb, fall.rgb, fall.a);
    alpha += fall.a * (1.0 - alpha);
  }

  return vec4(rgb, alpha);
}

vec3 voidScene(vec2 q, float maskRaw, float lightSum) {
  vec3 col = voidColor(q, uTime);
  col += starField(q, uTime);

  // On the ride the sky lifts a little, so the pines read as silhouettes.
  if (uRide > 0.001) {
    float skyX = q.x / (1.25 * uRes.x / min(uRes.x, uRes.y));
    float sky = (0.62 + 0.38 * fbm(q * 0.8 + vec2(0.0, uTravel * 0.05), 3)) * exp(-skyX * skyX);
    col += mix(uPal[2], uPal[3], 0.22) * sky * 0.40 * uRide;
  }

  vec2 distortion = vec2(
    fbm(q * 1.7 + vec2(uTime * 0.020, -uTime * 0.014), 3),
    fbm(q * 1.7 + vec2(4.7, 2.1) - uTime * 0.017, 3)
  ) - 0.5;

  vec2 masked = q + distortion * 0.055;
  float maskSum = 0.0;

  float wobble = (vnoise(q * 7.0 + vec2(uTime * 0.035, -uTime * 0.028)) - 0.5) * (0.030 + uErode * 0.12);
  maskSum = smoothstep(clamp(uErode + wobble, 0.0, 0.999), 1.0, maskRaw);

  float reveal = 1.0 - exp(-maskSum * 1.30);
  reveal *= 0.78 + 0.22 * fbm(q * 2.4 + vec2(uTime * 0.015, -uTime * 0.011), 3);

  // Shockwaves are only a displacement of the field; they are never drawn as rings.
  float scrAspect = uRes.x / uRes.y;
  float breath = sin(uTime * 0.11 + sin(uTime * 0.037) * 1.7);
  vec2 shockDisp = vec2(0.0);
  float shockEnergy = 0.0;

  for (int i = 0; i < 8; i++) {
    vec4 sh = uShocks[i];
    if (abs(sh.w) <= 0.001) continue;
    vec2 d = q - sh.xy;
    float dist = length(d);
    float age = sh.z;
    float front = age * 0.82;
    float width = 0.055 + age * 0.055;
    float env = exp(-pow((dist - front) / width, 2.0));
    if (sh.w < 0.0) {
      // A moon shock (negative strength): 2.5x the run, quadratic s-curve fade.
      float u = clamp(age / (2.2 * 2.5), 0.0, 1.0);
      float e = u < 0.5 ? 2.0 * u * u : 1.0 - 2.0 * (1.0 - u) * (1.0 - u);
      env *= (1.0 - e) * -sh.w;
    } else {
      env *= exp(-age * 0.62) * sh.w;
    }
    float warp = sin(d.x * 7.0 + age * 2.1) * cos(d.y * 6.0 - age * 1.7);
    vec2 dir = normalize(d + 0.0001);
    dir = rot(warp * 1.9) * dir;
    shockDisp += dir * env * 0.105;
    shockDisp += vec2(-dir.y, dir.x) * env * 0.052 * sin(age * 3.3 + dist * 7.0);
    shockEnergy += env;
  }

  vec2 shockUv = vec2(shockDisp.x / (2.0 * scrAspect), shockDisp.y * 0.5);

  // The pattern is now a living veil. Touch removes it; the subject is the negative space.
  float veilTime = uTime * 0.045;
  vec2 vp = q * 2.15 + shockDisp * 0.8;
  float w1 = fbm(vp * 0.68 + vec2(veilTime, -veilTime * 0.72), 3);
  float w2 = fbm(vp * 1.02 + w1 * 1.7 + vec2(-veilTime * 0.85, veilTime * 0.63), 3);
  vec2 wp = vp + vec2(w1, w2) * 1.65;

  float n = fbm(wp, 5);
  float filament = pow(max(0.0, 1.0 - abs(n * 2.0 - 1.0)), 7.5);
  float micro = fbm(wp * 2.7 + vec2(veilTime * 0.7, -veilTime * 0.5), 3);
  float veil = filament * (0.45 + 0.55 * micro);

  float rawMask = maskSum;
  float shape = rawMask + (vnoise(q * 9.0 + vec2(uTime * 0.050, -uTime * 0.030)) - 0.5) * 0.050 * smoothstep(0.0, 0.12, rawMask);
  float local = smoothstep(0.0, 0.26, shape);
  float hole = smoothstep(0.28, 0.88, shape);
  float rim = exp(-pow((shape - 0.34) / 0.11, 2.0));
  float shell = local * (1.0 - hole);
  float fibrous = 0.16 + 0.84 * filament;
  float light = 1.0 - exp(-lightSum * 1.15);

  float inkT = clamp(0.5 + 0.5 * sin(q.x * 1.3 + q.y * 0.9 + uTime * 0.02), 0.0, 1.0);
  inkT = pow(inkT, exp2(uInkCurve * 1.8));
  vec3 ink = inkRamp(inkT);

  float value = shell * fibrous * breath * uVeil;
  float lightFade = 1.0 - light * 0.90;
  col += ink * value * 0.85 * lightFade;
  col += ink * rim * local * uVeil * (0.014 + min(shockEnergy, 1.2) * 0.010) * lightFade;
  col += inkRamp(0.82) * light * 0.10;

  // The stroke is not a hollow outline: its center becomes an opaque void,
  // then it tears open at the edge in a broken, fibrous rift.
  float erase = 1.0 - exp(-lightSum * 2.6);
  float abyssDepth = smoothstep(0.02, 0.82, shape);
  abyssDepth *= 0.92 + 0.08 * vnoise(q * 13.0 + vec2(uTime * 0.035, -uTime * 0.025));
  abyssDepth *= 1.0 - erase * 0.985;
  float penumbra = smoothstep(0.0, 0.34, shape) * (1.0 - smoothstep(0.40, 0.86, shape));
  col *= 1.0 - penumbra * 0.20 * (1.0 - erase * 0.75);
  vec3 abyss = vec3(0.0008, 0.0009, 0.0013) + ink * 0.004 * (0.35 + 0.65 * micro);
  col = mix(col, abyss, abyssDepth * 0.94);

  // Fine dust lives only inside the painted rift. It is clipped by the mask,
  // so the darkness is the container rather than a separate particle field.
  float dustMask = smoothstep(0.24, 0.82, shape) * (1.0 - erase * 0.985);
  float dustA = darkDust(q + shockDisp * 0.28, uTime, 13.0, 0.070, 1.7);
  float dustB = darkDust(q + shockDisp * 0.48, uTime, 31.0, 0.045, 8.3);
  vec3 dustCol = mix(inkRamp(0.94), vec3(0.72, 0.69, 0.62), 0.30);
  col += dustCol * dustMask * (dustA * 0.140 + dustB * 0.070) * (1.0 + min(shockEnergy, 1.0) * 0.35);

  float crackFade = 1.0 - erase * 0.96;
  float rift = exp(-pow((shape - 0.24) / (0.020 + 0.014 * micro), 2.0));
  float crackNoise = fbm(q * 11.0 + vec2(uTime * 0.020, -uTime * 0.017), 3);
  float cracks = rift * smoothstep(0.48, 0.66, crackNoise) * (0.35 + 0.65 * filament);
  float hairline = exp(-pow((shape - 0.24 - 0.010 * sin(q.x * 28.0 - q.y * 24.0 + uTime * 0.10)) / (0.004 + 0.003 * micro), 2.0));
  vec3 crackColor = mix(inkRamp(0.96), vec3(0.90, 0.85, 0.77), 0.30);
  float edgeLine = 1.0 - smoothstep(0.0, 0.012, abs(shape - 0.235 - 0.006 * sin(q.x * 19.0 + q.y * 17.0 - uTime * 0.07)));
  float edgeBreak = smoothstep(0.42, 0.64, fbm(q * 17.0 + vec2(-uTime * 0.015, uTime * 0.011), 2));
  col += crackColor * rift * 0.026 * crackFade;
  col += crackColor * cracks * 0.34 * crackFade;
  col += crackColor * hairline * smoothstep(0.50, 0.68, crackNoise) * 0.10 * crackFade;
  col += crackColor * edgeLine * edgeBreak * 0.30 * crackFade;
  return col;
}

// ---------------------------------------------------------------------------
// The sky. Here the subject is the night itself: haze and cloud cover it, a
// touch parts them, and the stars are what you find underneath. The parted
// cloud drifts on with the wind and closes back over by itself.
// ---------------------------------------------------------------------------

vec3 starTint(float h) {
  vec3 hot = vec3(0.66, 0.77, 1.00);
  vec3 sun = vec3(1.00, 0.96, 0.89);
  vec3 cool = vec3(1.00, 0.74, 0.50);
  h = h * h * (3.0 - 2.0 * h);
  return h < 0.5 ? mix(hot, sun, h * 2.0) : mix(sun, cool, (h - 0.5) * 2.0);
}

// Stars are rare, tiny specks of glow: most barely there, a few carrying
// faint flare spikes. Each shimmers slowly on its own clock and now and then
// catches a brief glint. excite (0..1) is how hard the air over it is being
// stirred: it quickens and deepens the shimmer and draws the flares out.
// Tuning: STAR_* below.
#define STAR_KEEP_NEAR 0.060   // share of cells holding a near (flared) star
#define STAR_KEEP_FAR 0.030    // share of cells holding a far speck
#define STAR_BRIGHT 1.0        // overall star brightness
#define STAR_SHIMMER 0.22      // idle shimmer depth
#define STAR_SHIMMER_STIR 0.55 // extra shimmer depth when stirred
vec3 skyStars(vec2 s, float excite, float t) {
  vec3 c = vec3(0.0);
  // Through the camera a star grows only by the square root of the
  // magnification: still a point, a little fuller.
  float pxPerUnit = 0.5 * min(uRes.x, uRes.y) * sqrt(uView.z);
  for (int i = 0; i < 2; i++) {
    float fi = float(i);
    float scale = 9.0 + fi * 14.0;                     // 9 near, 23 far
    vec2 sp = s * scale + vec2(fi * 31.7, fi * 17.3);
    vec2 id = floor(sp);
    vec2 f = fract(sp) - 0.5;
    float h = hash21(id + fi * 11.0);
    if (h > mix(STAR_KEEP_NEAR, STAR_KEEP_FAR, fi)) continue;
    vec2 o = (hash22(id + 7.0 + fi) - 0.5) * 0.36;
    float hb = hash21(id + 41.0 + fi);
    vec2 dp = (f - o) * pxPerUnit / scale;             // offset in pixels
    float d2 = dot(dp, dp);

    // Shimmer: two slow beating sines, plus a rare sharp glint.
    float ph = hb * 61.0 + h * 173.0;
    float rate = 1.0 + 1.8 * excite;
    float slow = sin(t * (0.31 + 0.45 * hb) * rate + ph)
               * (0.6 + 0.4 * sin(t * (0.83 + 1.1 * fract(h * 37.0)) * rate + ph * 1.7));
    float glint = pow(max(0.0, sin(t * (0.13 + 0.11 * fract(h * 53.0)) * (1.0 + 4.0 * excite) + ph * 3.1)), 28.0);
    float depth = STAR_SHIMMER + STAR_SHIMMER_STIR * excite;
    float tw = max(0.12, 1.0 + depth * slow + (0.5 + 1.3 * excite) * glint);

    float b = (0.020 + 0.17 * pow(hb, 4.0)) * (1.0 - fi * 0.6) * STAR_BRIGHT;
    b *= 1.0 + 0.35 * excite;
    float core = exp(-d2 / (0.55 + 0.6 * hb));
    float halo = exp(-sqrt(d2) / (1.4 + 1.8 * hb)) * 0.10;
    float glow = core + halo;

    // Flares: a thin, faint cross, tilted a little per star, only on the
    // brighter near stars. They breathe with the glint and stretch when stirred.
    if (i == 0) {
      float fl = smoothstep(0.55, 0.95, hb);
      if (fl > 0.0) {
        vec2 r = rot(0.35 + (h / STAR_KEEP_NEAR - 0.5) * 0.5) * dp;
        float len = 2.2 + 3.5 * hb + 3.0 * excite + 3.0 * glint;
        float spikes = exp(-abs(r.y) * 2.2 - abs(r.x) / len)
                     + exp(-abs(r.x) * 2.2 - abs(r.y) / len);
        glow += spikes * fl * (0.10 + 0.25 * glint + 0.20 * excite);
      }
    }

    // Fade out before the cell edge so no glow is cut off by its neighbour.
    float win = 1.0 - smoothstep(0.36, 0.5, max(abs(f.x), abs(f.y)));
    vec3 tint = mix(vec3(1.0), starTint(hash21(id + 3.3 + fi)), 0.6);
    c += tint * glow * b * tw * win;
  }

  // Through the camera a deeper layer of faint stars comes out, too faint
  // to see with the eye.
  float deep = smoothstep(1.3, 3.0, uView.z);
  if (deep > 0.0) {
    vec2 sp = s * 47.0 + vec2(63.1, 29.7);
    vec2 id = floor(sp);
    vec2 f = fract(sp) - 0.5;
    float h = hash21(id + 23.0);
    if (h < 0.07) {
      vec2 o = (hash22(id + 9.0) - 0.5) * 0.36;
      float hb = hash21(id + 43.0);
      vec2 dp = (f - o) * pxPerUnit / 47.0;
      float d2 = dot(dp, dp);
      float tw = 1.0 + STAR_SHIMMER * sin(t * (0.4 + 0.5 * hb) + hb * 61.0);
      float b = (0.010 + 0.05 * hb * hb * hb) * STAR_BRIGHT * deep;
      float win = 1.0 - smoothstep(0.36, 0.5, max(abs(f.x), abs(f.y)));
      vec3 tint = mix(vec3(1.0), starTint(hash21(id + 5.3)), 0.6);
      c += tint * exp(-d2 / 0.6) * b * tw * win;
    }
  }
  return c;
}

// The quarry: a few rarer, prettier stars. In the wide view each is only a
// touch brighter than the brightest ordinary star, with a quicker, odd
// twinkle; through the camera its colour and shape come out. When one is
// photographed it answers with a glint, long diffraction spikes, a coloured
// ring and a bloom (the flourish).
float qCore(vec2 dp, float w) {
  float d2 = dot(dp, dp);
  return exp(-d2 / w) + exp(-sqrt(d2) / (1.6 + w)) * 0.10;
}

float qSpikes(vec2 dp, float ang, float len, float thin) {
  vec2 r = rot(ang) * dp;
  return exp(-abs(r.y) * thin - abs(r.x) / len) + exp(-abs(r.x) * thin - abs(r.y) / len);
}

vec3 quarryStars(vec2 s, float excite, float t) {
  vec3 c = vec3(0.0);
  float px = 0.5 * min(uRes.x, uRes.y);
  float pxStar = px * sqrt(uView.z);   // star sizes, as in skyStars
  float pxTrue = px * uView.z;         // real screen pixels per unit
  for (int i = 0; i < 6; i++) {
    vec4 Q = uQuarry[i];
    if (Q.w <= 0.0) continue;
    vec2 d = s - Q.xy;
    vec4 B = uQuarryB[i];
    float age = B.x;
    float fl = (age >= 0.0 && age < 8.0) ? B.y : 0.0;   // 8 s: keep in step with FLOURISH_LEN
    if (dot(d, d) > (fl > 0.0 ? 0.09 : 0.0016)) continue;
    float kind = floor(Q.z);
    float seed = fract(Q.z);
    vec2 dp = d * pxStar;

    // A quicker twinkle than the ordinary stars: the hint that this one is different.
    float tw = 1.0 + 0.30 * sin(t * (1.7 + seed) + seed * 40.0) * (0.6 + 0.4 * sin(t * 2.9 + seed * 13.0));
    tw *= 1.0 + 0.25 * excite;
    vec3 glow;
    if (kind < 0.5) {
      // A double: gold and blue, a hair apart. One point to the eye.
      vec2 sep = rot(seed * TAU) * vec2(0.0042, 0.0);
      glow = vec3(1.00, 0.78, 0.46) * qCore((d - sep * 0.42) * pxStar, 0.75) * 1.1
           + vec3(0.58, 0.72, 1.00) * qCore((d + sep * 0.58) * pxStar, 0.6) * 0.8;
    } else if (kind < 1.5) {
      // A ruby: a deep red carbon star, soft and warm.
      glow = vec3(1.00, 0.34, 0.20) * qCore(dp, 1.2) * 1.3;
    } else if (kind < 2.5) {
      // A sapphire: hot blue-white, with strong spikes of its own.
      glow = vec3(0.70, 0.82, 1.00) * (qCore(dp, 0.8) + 0.30 * qSpikes(dp, 0.35 + seed, 3.5 + 3.0 * sqrt(uView.z), 2.0));
    } else if (kind < 3.5) {
      // A pulsing star: it swells and fades over a few seconds.
      float beat = 0.45 + 0.55 * (0.5 + 0.5 * sin(t * (0.9 + 0.4 * seed) + seed * 30.0));
      glow = vec3(1.00, 0.93, 0.80) * qCore(dp, 0.85) * beat * 1.4;
    } else {
      // A little cluster: a smudge to the eye, a handful of points through the lens.
      glow = vec3(0.0);
      for (int j = 0; j < 7; j++) {
        float fj = float(j);
        vec2 o = (hash22(vec2(seed * 91.0 + fj, fj * 3.1)) - 0.5) * 0.024;
        vec3 ct = mix(vec3(1.0), starTint(hash21(vec2(fj, seed * 17.0))), 0.7);
        glow += ct * qCore((d - o) * pxStar, 0.5) * (0.35 + 0.4 * hash21(vec2(fj * 7.0, seed)));
      }
    }
    vec3 col = glow * 0.17 * tw * STAR_BRIGHT;

    // The flourish, in real screen pixels so it reads the same at any zoom.
    if (fl > 0.0) {
      vec2 dq = d * pxTrue;
      float rq = length(dq);
      float rise = smoothstep(0.0, 0.10, age);
      vec3 hue = glow / max(1e-4, max(glow.r, max(glow.g, glow.b)));
      hue = mix(vec3(1.0), clamp(hue, 0.0, 1.0), 0.55);
      // The glint: the core flashes, quickly.
      col *= 1.0 + 7.0 * rise * exp(-age * 0.9) * fl;
      // The lens flare (spikes, ring, bloom) runs at half speed, so it lasts
      // twice as long (8 s), and eases out over all of it: no step at the end.
      float a2 = age * 0.5;
      float left = clamp(1.0 - age / 8.0, 0.0, 1.0);
      float env = rise * left * left;
      // Long diffraction spikes, turning slowly, reaching out then fading.
      float len = 18.0 + 170.0 * smoothstep(0.0, 0.7, a2);
      float ang = seed * TAU + a2 * 0.22;
      float sp = qSpikes(dq, ang, len, 1.1) + 0.45 * qSpikes(dq, ang + 0.785, len * 0.55, 1.4);
      col += hue * sp * env * fl * 0.55;
      // A coloured ring that opens outward, its edge split into colour.
      float rr = 14.0 + 150.0 * (1.0 - exp(-a2 * 1.6));
      float ringA = left * left * left * smoothstep(0.0, 0.08, age);
      vec3 ring = vec3(exp(-pow((rq - rr * 1.04) / 2.6, 2.0)),
                       exp(-pow((rq - rr) / 2.6, 2.0)),
                       exp(-pow((rq - rr * 0.96) / 2.6, 2.0)));
      col += ring * hue * ringA * fl * 0.30;
      // The bloom: a soft swell of light that settles.
      col += hue * exp(-rq / (16.0 + 40.0 * env)) * env * fl * 0.35;
    }
    c += col * Q.w;
  }
  return c;
}

// Has the wind moved, torn or stretched the cloud here at all? (flow from
// the wind field: xy carried, z torn, w stretch, 1 = untouched.)
bool windTouched(vec4 flow) {
  return dot(flow.xy, flow.xy) > 1e-8 || flow.z > 1e-4 || abs(flow.w - 1.0) > 1e-3;
}

float cloudField(vec2 c, float t) {
  vec2 w = vec2(
    fbm(c * 0.85 + vec2(0.0, t * 0.012), 3),
    fbm(c * 0.85 + vec2(5.2, 1.3) - t * 0.009, 3)
  );
  return fbm(c * 1.30 + (w - 0.5) * 1.5 + vec2(t * 0.006, -t * 0.002), 5);
}

// ---------------------------------------------------------------------------
// The moon cursor. A waxing crescent hangs in the backdrop at uPointer, which
// trails the finger slowly. The sunlit horn is on the right, tipped a little;
// the rest of the disc holds a faint ashen earthshine. It sits behind the
// cloud, glows through thin haze, and lights the cloud around it.
// Tuning: MOON_* below.
#define MOON_R 0.123          // disc radius in scene units (screen height = 2)
#define MOON_PHASE 2.05       // sun angle from the viewer, rad (~0.27 lit: a crescent)
#define MOON_TILT -0.42       // how far the horns lean
#define MOON_BRIGHT 1.75      // sunlit surface
#define MOON_ASHEN 0.014      // earthshine on the dark part
const vec3 MOON_LIGHT = vec3(0.92, 0.93, 0.98);

// rgb: disc colour; a: disc coverage.
vec4 moonDisc(vec2 q) {
  vec2 d = (q - uPointer) / MOON_R;
  float r = length(d);
  float aa = 2.4 / (min(uRes.x, uRes.y) * MOON_R);
  float cover = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r);
  if (cover <= 0.0) return vec4(0.0);
  d = rot(MOON_TILT) * d;
  vec3 n = vec3(d, sqrt(max(0.0, 1.0 - dot(d, d))));
  // MOON_PHASE is the crescent it starts from. Fullness moves the lit share
  // of the disc evenly from there to full.
  float litShare = mix(0.5 + 0.5 * cos(MOON_PHASE), 0.9975, uMoonCycle.x);
  float sunAngle = acos(clamp(2.0 * litShare - 1.0, -1.0, 1.0));
  vec3 L = vec3(sin(sunAngle), 0.0, cos(sunAngle));
  float ndl = dot(n, L);
  // A soft, slightly ragged terminator: the highlands catch the light first.
  vec2 st = n.xy / (0.55 + 0.45 * n.z);
  float rough = fbm(st * 5.5 + vec2(1.7, 4.2), 3);
  float lit = smoothstep(-0.05, 0.16, ndl + (rough - 0.5) * 0.10);
  // Seas and highlands, foreshortened toward the limb.
  float mare = smoothstep(0.47, 0.72, fbm(st * 1.5 + vec2(3.1, 7.7), 4));
  vec3 albedo = mix(vec3(1.0, 0.975, 0.92), vec3(0.60, 0.63, 0.68), mare * 0.75);
  albedo *= 0.86 + 0.32 * (rough - 0.5);
  float shade = 0.38 + 0.62 * clamp(ndl * 1.7, 0.0, 1.0);
  // A whole lit disc is far more light than a crescent: ease it down.
  float fullEase = mix(1.0, 0.60, uMoonCycle.x * uMoonCycle.x) + 0.35 * uMoonCycle.y;
  vec3 sun = albedo * MOON_LIGHT * lit * shade * MOON_BRIGHT * fullEase;
  // Earthshine: dim, cool, a little brighter toward the middle of the disc.
  vec3 ash = albedo * vec3(0.55, 0.62, 0.80) * MOON_ASHEN * (0.55 + 0.45 * n.z);
  // A thin bright rim on the sunlit limb, the painter's touch.
  float limb = smoothstep(0.80, 1.0, r) * lit;
  return vec4(sun + ash * (1.0 - lit) + MOON_LIGHT * limb * (0.25 + 0.30 * uMoonCycle.z), cover);
}

// Moonlight scattered in the air around the disc, leaning toward the horns.
// near: a tight glow; wide: the broad wash that lights the cloud.
vec2 moonGlow(vec2 q) {
  vec2 L = rot(-MOON_TILT) * vec2(1.0, 0.0);
  vec2 d = q - uPointer - L * MOON_R * 0.35 * (1.0 - uMoonCycle.x);
  float dist = max(0.0, length(d) - MOON_R * 0.8);
  float near = exp(-dist / 0.10);
  float wide = exp(-dist / 0.50);
  float flare = (1.0 + 0.9 * uPress) * (1.0 + 1.0 * uMoonCycle.x + 1.6 * uMoonCycle.y);
  return vec2(near * (1.0 + 1.1 * uMoonCycle.z), wide) * flare * uMoonOn;
}

// The saucer: a flat lens of dark metal with a glass dome, lit from the
// right like the moon's horn, and a ring of lights chasing round its rim.
// rgb: colour, a: coverage; glow: the lights, added on top.
vec4 saucerAt(vec2 q, out vec3 glow) {
  glow = vec3(0.0);
  float size = uSaucerB.y;
  vec2 p = rot(uSaucerB.x) * (q - uSaucer.xy) / size;
  if (dot(p, p) > 4.0) return vec4(0.0);
  float aa = 1.6 / (0.5 * min(uRes.x, uRes.y) * uView.z * size);
  // The hull: a thin ellipse, a little fuller underneath.
  vec2 e = p / vec2(1.0, p.y > 0.0 ? 0.17 : 0.24);
  float hull = 1.0 - smoothstep(1.0 - aa * 4.0, 1.0 + aa * 4.0, length(e));
  // The dome on top.
  vec2 dp = (p - vec2(0.0, 0.08)) / vec2(0.40, 0.36);
  float dome = (1.0 - smoothstep(1.0 - aa * 3.0, 1.0 + aa * 3.0, length(dp))) * step(0.0, p.y);
  float cover = max(hull, dome);
  // Moonlight (the sun, really) from the right: a bright upper-right edge.
  float lit = smoothstep(-0.6, 0.9, p.x) * (0.35 + 0.65 * smoothstep(-0.2, 0.12, p.y));
  vec3 metal = vec3(0.030, 0.032, 0.036) + MOON_LIGHT * 0.22 * lit * lit;
  float glint = exp(-pow((p.y - 0.02) / 0.05, 2.0)) * smoothstep(0.2, 0.95, p.x) * hull;
  metal += MOON_LIGHT * glint * 0.35;
  vec3 glass = mix(vec3(0.05, 0.16, 0.12), vec3(0.32, 0.85, 0.62), 0.35 + 0.65 * lit);
  vec3 col = mix(metal, glass, dome * (1.0 - hull * step(p.y, 0.04)));
  // The rim lights, chasing round.
  vec3 lights = vec3(0.0);
  for (int k = 0; k < 5; k++) {
    float fk = float(k);
    vec2 lp = vec2(-0.72 + 0.36 * fk, -0.03);
    float on = 0.25 + 0.75 * pow(0.5 + 0.5 * sin(uSaucerB.z * 7.0 - fk * 1.4), 4.0);
    vec3 lc = mod(fk, 2.0) < 0.5 ? vec3(0.55, 1.0, 0.70) : vec3(1.0, 0.80, 0.45);
    float r2 = dot(p - lp, p - lp);
    lights += lc * on * (exp(-r2 / 0.006) * 1.4 + exp(-r2 / 0.08) * 0.25);
  }
  // A faint beam-glow underneath.
  lights += vec3(0.40, 1.0, 0.65) * 0.18 * exp(-dot(p - vec2(0.0, -0.22), p - vec2(0.0, -0.22)) / 0.05);
  glow = lights;
  return vec4(col, cover);
}

vec3 skyScene(vec2 q, float maskRaw, vec4 flow, float excite, float light, float t) {
  vec2 ext = uRes / min(uRes.x, uRes.y);
  float hgt = q.y + ext.y;                           // height above the bottom edge
  float horizon = exp(-hgt * 2.4);                   // 1 at the bottom, 0 high up

  // The sky turns very slowly about a pole above the top of the view.
  vec2 pole = vec2(0.35, ext.y + 0.85);
  vec2 s = rot(t * 0.0011) * (q - pole) + pole;

  // Clear sky: deep blue at the zenith, a warm glow of distant towns low down.
  vec3 zenith = vec3(0.0012, 0.0017, 0.0040);
  vec3 low = vec3(0.0085, 0.0074, 0.0070) * (1.0 - 0.68 * uSkyDark);
  vec3 sky = mix(zenith, low, horizon);

  float extinction = (1.0 - horizon * 0.75 * (1.0 - 0.72 * uSkyDark)) * (1.0 + 0.18 * uSkyDark);
  sky += (skyStars(s, excite, t) + quarryStars(s, excite, t)) * extinction;

  // The moon hangs in front of the stars and behind every cloud.
  vec4 moon = uMoonOn > 0.001 ? moonDisc(q) : vec4(0.0);
  moon.a *= uMoonOn;
  vec2 mg = moonGlow(q);
  sky = mix(sky, moon.rgb, moon.a);
  sky += MOON_LIGHT * (mg.x * 0.020 + mg.y * 0.0045);
  // The saucer, in front of the moon or hidden behind it.
  vec3 sGlow = vec3(0.0);
  vec4 sc = vec4(0.0);
  float seen = 0.0;
  if (uSaucer.w > 0.0) {
    sc = saucerAt(q, sGlow);
    seen = uSaucer.w * (uSaucer.z < 0.0 ? 1.0 - moon.a : 1.0);
    sky = mix(sky, sc.rgb, sc.a * seen) + sGlow * seen;
  }

  // Clouds live in wind space; the parted mask is sampled in the same space,
  // so a parted hole drifts along with the cloud around it.
  // A gust carries the cloud itself: sample it where it was blown from.
  vec2 c = vec2(q.x - uDrift - flow.x, q.y - flow.y) * vec2(0.62, 1.05);
  float n = cloudField(c, t);
  float density = smoothstep(0.34, 0.70, n);
  float det = clamp(flow.w, 0.0, 2.0);
  float thin = clamp(1.0 - det, 0.0, 1.0);
  float pile = clamp(det - 1.0, 0.0, 1.0);
  // Wisps: fine texture carried with the cloud. Where the wind has stretched
  // the cloud, the same stretch draws it out into streamers along the pull.
  // Cloud the wind has not touched does not need it (0.5 changes nothing).
  float wisp = 0.5;
  if (uFlowOn > 0.5 && windTouched(flow)) wisp = fbm(c * vec2(15.0, 12.0) + vec2(t * 0.006, -t * 0.004), 2);
  float strand = smoothstep(0.36, 0.64, wisp);
  // Bunched cloud gathers in broken ridges, not a smooth bead around the gap.
  pile *= 0.25 + 1.20 * strand;
  density = clamp(density * mix(1.0, det, 0.45) + pile * 0.08, 0.0, 1.0);
  float fine = fbm(c * 4.2 + vec2(-t * 0.010, t * 0.006), 3);
  float haze = 0.935 + 0.05 * horizon;
  float veil = 1.0 - (1.0 - haze) * (1.0 - density * 0.995);

  // Parting: thin haze and wisps give way first; thick cloud resists a little.
  float edgeN = fbm(c * 6.0 + vec2(t * 0.03, -t * 0.02), 3);
  // With the wind field, cloud opens where a gust has pulled it thin or torn
  // it; without it, the painted mask parts it as before.
  float part;
  if (uFlowOn > 0.5) {
    // Stretched cloud thins in proportion to the stretch, ragged with its own
    // texture; only a hard gust tears it clean through.
    float stretch = thin * (0.75 + 0.55 * (edgeN - 0.5) + 0.45 * (0.5 - n));
    float torn = smoothstep(0.15, 0.95, flow.z + (edgeN - 0.5) * 0.35 + (wisp - 0.5) * 0.45 * smoothstep(0.0, 0.3, flow.z) - density * 0.15);
    part = clamp(max(stretch * 1.15, torn), 0.0, 1.0);
    // Fray: half-parted cloud breaks into strands instead of fading evenly,
    // so the edge of a clearing is feathered like windblown cloud.
    float fray = part * (1.0 - part) * 4.0;
    part = clamp(part + (strand - 0.5) * 0.95 * fray, 0.0, 1.0);
  } else {
    float pv = maskRaw * 1.35 - uErode * 0.55 + (edgeN - 0.5) * 0.62 + (0.5 - n) * 0.55 - density * 0.12;
    part = smoothstep(0.10, 0.85, pv);
  }
  if (uFlowOn < 0.5) part *= part * (3.0 - 2.0 * part);
  float opacity = veil * (1.0 - part);
  gClear = (1.0 - opacity) * (1.0 - moon.a);

  // Night cloud is lit from below by sky glow: warmer and brighter low down,
  // brightest where it is thickest, with a little texture in it.
  vec3 tint = uPal[3] / max(dot(uPal[3], vec3(0.3333)), 1e-4);
  vec3 hazeCol = mix(vec3(0.0042, 0.0046, 0.0060), vec3(0.0170, 0.0135, 0.0110), horizon);
  vec3 cloudCol = mix(vec3(0.0150, 0.0156, 0.0182), vec3(0.0420, 0.0320, 0.0235), horizon);
  cloudCol *= (0.45 + 0.95 * density + 0.45 * (fine - 0.5)) * (1.0 + pile * 0.12);
  vec3 overCol = mix(hazeCol, cloudCol, density);
  overCol = mix(overCol, overCol * tint, 0.35);
  overCol *= 0.75 + 0.5 * uVeil;

  vec3 col = mix(sky, overCol, opacity);

  // A faint silver lining where the cloud has just been pulled thin: only
  // some strands catch it, so the gap has no glossy lip.
  float rim = part * (1.0 - part) * 4.0 * veil;
  if (uFlowOn > 0.5) rim *= strand;
  col += overCol * rim * (0.12 + 0.26 * fine);

  // Moonlight through the cloud: haze lets the disc through, thick cloud only
  // a dim smudge of it. The cloud near the moon is lit, thin edges brightest,
  // and a pulled-thin edge near it catches a silver lining.
  if (uMoonOn > 0.001) {
    float thinC = 1.0 - density;
    col += moon.rgb * moon.a * opacity * (0.06 + 0.78 * thinC * thinC);
    // Like the moon, the saucer shows through haze: a dark shape against
    // the lit cloud, its lights a blur.
    float through = seen * opacity * (0.10 + 0.80 * thinC * thinC);
    col = mix(col, sc.rgb, sc.a * through) + sGlow * through;
    col += MOON_LIGHT * opacity * (mg.x * (0.030 + 0.050 * thinC) + mg.y * (0.008 + 0.010 * density)) * (0.8 + 0.4 * fine);
    col += MOON_LIGHT * rim * mg.x * 0.10;
  }

  // Illumination lights the underside of whatever cloud is left.
  col += mix(vec3(0.050, 0.047, 0.043), inkRamp(0.82) * 0.06, 0.4) * light * (0.25 + 0.75 * opacity);

  return col;
}

// ---------------------------------------------------------------------------
// A rare flyer: now and then a bat flits across under the cloud, or an owl
// glides over. Both are silhouettes seen from below, in their own frame:
// flying toward +x, wingspan 1. st is the wing stroke: 1 at mid-downstroke,
// when the wings are spread widest, -1 at mid-upstroke.
uniform vec4 uFly[2];    // xy: position, z: heading, w: wingspan (0 = none)
uniform vec4 uFlyB[2];   // x: wing stroke, y: 0 bat / 1 owl, z: opacity

float batShape(vec2 p, float st, float aa) {
  float hs = 0.5 * (0.66 + 0.34 * st);          // half-span: folded on the upstroke
  float sweep = 0.06 * (0.5 - 0.5 * st);        // and the tips swept back
  float ay = abs(p.y);
  float s = ay / hs;
  float cov = 0.0;
  if (s < 1.0) {
    // The arm runs forward to the wrist, the long finger back to the tip;
    // behind, the membrane bows in between the finger tips.
    float le = 0.045 + 0.23 * s - 0.30 * s * s - sweep * s;
    float te = -0.135 + 0.110 * s - sweep * s;
    float seg = s < 0.50 ? s / 0.50 : (s < 0.77 ? (s - 0.50) / 0.27 : (s - 0.77) / 0.23);
    float bow = s < 0.50 ? 0.055 : (s < 0.77 ? 0.045 : 0.034);
    te += bow * pow(sin(3.14159 * seg), 0.8);
    cov = smoothstep(-aa, aa, min(p.x - te, le - p.x));
  }
  float body = (length((p - vec2(-0.015, 0.0)) / vec2(0.110, 0.048)) - 1.0) * 0.048;
  float head = length(p - vec2(0.105, 0.0)) - 0.038;
  vec3 e = segT(vec2(p.x, ay), vec2(0.115, 0.014), vec2(0.172, 0.036));
  float ear = e.x - 0.013 * (1.0 - e.y);
  // The tail membrane between the legs, its edge cut in a shallow curve.
  float tend = -0.17 + 0.045 * (1.0 - (ay / 0.05) * (ay / 0.05));
  float tail = max(max(tend - p.x, p.x + 0.06), ay - 0.05);
  float sd = min(min(body, head), min(ear, tail));
  return max(cov, smoothstep(aa, -aa, sd));
}

float owlShape(vec2 p, float st, float aa) {
  float hs = 0.5 * (0.82 + 0.18 * st);          // an owl hardly folds its wings
  float ay = abs(p.y);
  float s = ay / hs;
  float cov = 0.0;
  if (s < 1.0) {
    // Broad, nearly square-cut wings, bent forward at the wrist, with a
    // blunt hand whose fingers spread at the tip.
    float le = 0.060 + 0.060 * s - 0.090 * s * s;
    float te = -0.130 + 0.010 * s + 0.020 * s * s;
    float wide = 0.5 * (le - te) * sqrt(max(0.0, 1.0 - pow(s, 6.0)));
    float mid = 0.5 * (le + te);
    float slots = smoothstep(0.76, 0.90, s) * (0.5 + 0.5 * cos((p.x - te) / max(le - te, 1e-3) * 31.4));
    cov = smoothstep(-aa, aa, wide - abs(p.x - mid) - slots * 0.024);
  }
  float body = (length((p - vec2(-0.030, 0.0)) / vec2(0.120, 0.066)) - 1.0) * 0.066;
  float head = length(p - vec2(0.100, 0.0)) - 0.066;
  float tx = clamp((-0.120 - p.x) / 0.090, 0.0, 1.0);
  float tail = max(max(ay - (0.034 + 0.034 * tx), p.x + 0.120), -0.210 - p.x);
  return max(cov, smoothstep(aa, -aa, min(min(body, head), tail)));
}

float flyers(vec2 q) {
  float cov = 0.0;
  for (int i = 0; i < 2; i++) {
    vec4 f = uFly[i];
    if (f.w <= 0.0) continue;
    vec2 d = q - f.xy;
    if (dot(d, d) > f.w * f.w * 0.30) continue;
    vec2 p = rot(f.z) * d / f.w;
    float aa = 1.6 / (min(uRes.x, uRes.y) * f.w);
    float s = uFlyB[i].y < 0.5 ? batShape(p, uFlyB[i].x, aa) : owlShape(p, uFlyB[i].x, aa);
    cov = max(cov, s * uFlyB[i].z);
  }
  return cov;
}

// The camera's housing: everything outside the lens. Near-black metal with a
// faint knurled ring and a thin glint on the lip of the lens.
vec3 lensHousing(vec2 p, float r, float R) {
  vec3 c = vec3(0.0011, 0.0011, 0.0013) * (1.0 + 0.6 * exp(-(r - R) * 3.0));
  float a = atan(p.y, p.x);
  float knurl = smoothstep(R + 0.05, R + 0.06, r) * (1.0 - smoothstep(R + 0.10, R + 0.11, r));
  c += vec3(0.0016) * knurl * (0.5 + 0.5 * sin(a * 240.0));
  c += vec3(0.0055, 0.0060, 0.0072) * exp(-pow((r - R - 0.012) / 0.005, 2.0));
  return c;
}

void main() {
  // uv0: where this pixel is on the screen. uv: where it looks in the scene;
  // through the camera that is the magnified patch around uView.xy.
  vec2 uv0 = aspect(gl_FragCoord.xy);
  float lensR = uView.w;
  float rr = length(uv0);
  bool probe = uProbe.z > 0.5;
  if (!probe && rr > lensR + 0.015) {
    fragColor = vec4(finish(lensHousing(uv0, rr, lensR), uv0), 1.0);
    return;
  }
  vec2 uv = probe ? uProbe.xy : uView.xy + uv0 / uView.z;
  vec2 pd = uv - uPointer;

  float lens = exp(-dot(pd, pd) * 16.0) * (1.0 - uMoonOn);
  vec2 q = uv - pd * lens * (0.052 + 0.020 * uPress);

  // The mask is accumulated in a separate texture, so old marks do not have
  // to be deleted to make room for new ones. It lives in wind space (shifted
  // by uDrift) and wraps horizontally, so parted cloud travels with the wind.
  float maskAspect = uRes.x / max(1.0, uRes.y);
  vec2 maskExtent = vec2(max(1.0, maskAspect), max(1.0, 1.0 / maskAspect));
  vec2 maskUv = vec2((q.x - uDrift) / (2.0 * maskExtent.x) + 0.5, clamp(0.5 - q.y / (2.0 * maskExtent.y), 0.001, 0.999));
  float maskRaw = texture(uMask, maskUv).a;

  float lightSum = 0.0;
  for (int i = 0; i < 24; i++) {
    vec4 l = uLights[i];
    if (l.w <= 0.001) continue;
    vec2 d = q - l.xy;
    lightSum += exp(-dot(d, d) / (l.z * l.z) * 1.8) * l.w;
  }
  float light = 1.0 - exp(-lightSum * 1.15);

  vec3 col = vec3(0.0);
  if (uSky < 0.999) col = voidScene(q, maskRaw, lightSum);
  if (uSky > 0.001) {
    vec4 flow = vec4(0.0, 0.0, 0.0, 1.0);
    // How stirred the air is here: live wind speed, plus a little that lingers
    // while the cloud is still torn or pushed aside. A held finger counts too.
    float excite = maskRaw * 0.7;
    if (uFlowOn > 0.5) {
      vec2 fuv = vec2((q.x - uDrift) / (2.0 * maskExtent.x) + 0.5, q.y / (2.0 * maskExtent.y) + 0.5);
      flow = texCubic(uFlow, fuv);
      // Where the wind has been at work, the flow is looked up again through
      // a little turbulence carried with the cloud, so the outline of a
      // clearing frays instead of running as one smooth curve. Untouched sky
      // skips this (phones are short of time per frame).
      if (windTouched(flow)) {
        vec2 wq = vec2(q.x - uDrift, q.y);
        vec2 jag = vec2(vnoise(wq * 11.0 + 3.1), vnoise(wq * 11.0 + vec2(7.7, 1.3))) - 0.5;
        flow = texCubic(uFlow, fuv + jag * 0.070 / (2.0 * maskExtent));
      }
      float wind = length(texCubic(uWind, fuv).xy);
      excite = 1.0 - exp(-(wind * 1.4 + flow.z * 0.6 + length(flow.xy) * 1.0));
    }
    excite = clamp(excite + uPress * exp(-dot(pd, pd) * 28.0) * 0.6, 0.0, 1.0);
    col = mix(col, skyScene(q, maskRaw, flow, excite, light, uTime), uSky);
  }

  // Off the sky, the moon still hangs behind the void, softened by it.
  if (uMoonOn > 0.001 && uSky < 0.999) {
    vec4 vm = moonDisc(q);
    vec2 vg = moonGlow(q);
    vec3 vcol = mix(col, vm.rgb * 0.55, vm.a * uMoonOn * 0.8) + MOON_LIGHT * (vg.x * 0.016 + vg.y * 0.004);
    col = mix(vcol, col, uSky);
  }

  // A rare flyer passes under the cloud: a dark shape against cloud and
  // moon, nearly lost against clear sky, and behind the pines.
  if (uSky > 0.001 && (uFly[0].w > 0.0 || uFly[1].w > 0.0)) {
    col = mix(col, vec3(0.0010, 0.0010, 0.0014), flyers(q) * uSky);
  }

  // The pines pass in front of everything in the sky, painted dark included.
  // Light reaches them: an illuminated stroke turns the needles green.
  // The probe answers two questions: how clear the sky is (r), and, with a
  // reach (uProbe.z - 1), which creature in the pines is within it (g: its
  // tree's cell mod 256; b: 1 + 2 * lane code + 16 * kind + 64 * red).
  if (probe) {
    float reach = uProbe.z - 1.0;
    vec2 cb = vec2(0.0);
    if (reach > 0.0 && uRide > 0.5) {
      canopy(q, light);
      if (gCritter.x < reach) {
        float kr = gCritter.w;
        float red = kr >= 4.0 ? 1.0 : 0.0;
        cb = vec2(gCritter.y, 1.0 + 2.0 * gCritter.z + 16.0 * (kr - 4.0 * red) + 64.0 * red) / 255.0;
      }
    }
    fragColor = vec4(gClear, cb, 1.0);
    return;
  }

  // The pines stay in the picture through the camera: their creatures are
  // there to be found.
  float rideHere = uRide;
  if (rideHere > 0.001) {
    vec4 can = canopy(q, light);
    col = mix(col, can.rgb, can.a * rideHere);
    col += gEyes * rideHere;
  }

  // The orb: a small pearl with a little chromatic mischief. (The pearl
  // cursor; under the moon cursor it fades out below.)
  vec3 preOrb = col;
  float orbCore = exp(-dot(pd, pd) * 1500.0);
  float orbInner = exp(-dot(pd, pd) * 220.0);
  float orbHalo = exp(-dot(pd, pd) * 8.0);
  vec3 orbTint = mix(uPal[4], vec3(1.0, 0.96, 0.89), 0.30);
  float pulse = 0.90 + 0.12 * sin(uTime * 0.7) + 0.22 * uPress;
  col += orbTint * (orbCore * 0.85 + orbInner * 0.014 + orbHalo * 0.0011) * pulse;
  float headGlow = exp(-dot(pd, pd) * 34.0) * uPress;
  col += orbTint * headGlow * 0.012;

  vec2 highlight = pd - vec2(-0.007, 0.009);
  col += uPal[4] * exp(-dot(highlight, highlight) * 2400.0) * 0.22;

  vec2 chromaA = pd - vec2(0.006, 0.003);
  vec2 chromaB = pd + vec2(0.005, 0.004);
  col.r += exp(-dot(chromaA, chromaA) * 600.0) * 0.012;
  col.b += exp(-dot(chromaB, chromaB) * 600.0) * 0.011;

  vec2 v = uPointerVel;
  float vl = length(v);
  if (vl > 0.002) {
    vec2 dir = v / max(vl, 1e-4);
    vec2 tailP = pd - dir * 0.020;
    col += orbTint * exp(-dot(tailP, tailP) * 180.0) * min(vl, 1.5) * 0.06 * (1.0 - 0.75 * uPress);
  }
  col = mix(col, preOrb, uMoonOn);

  // The lens: darker and a touch cooler toward its rim, then the housing.
  if (uScope > 0.001) {
    float rim = smoothstep(lensR * 0.55, lensR, rr) * uScope;
    col *= 1.0 - 0.45 * rim;
    col *= vec3(1.0 - 0.10 * rim, 1.0, 1.0 + 0.12 * rim);
    col = mix(col, lensHousing(uv0, rr, lensR), smoothstep(lensR - 0.006, lensR + 0.006, rr));
  }

  fragColor = vec4(finish(col, uv0), 1.0);
}`;

      // The wind field under the sky. Three small passes run each frame on a
      // grid laid over the sky in wind space (the same space and wrap as the
      // mask; see flowDims). The velocity pass carries a gust along, curls it
      // and lets it die out. The map pass tracks, for every cell, how far the
      // cloud now there was carried from (rg) and how much a hard gust has
      // torn it (b). The view pass hands both to the sky together with how
      // stretched or bunched the cloud is (a: >1 bunched, <1 thinned).
      var simCommon = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uGrid;
uniform vec2 uExt;
uniform float uDt;
uniform float uTime;
uniform float uDrift;
uniform vec4 uSplatA[16];
uniform vec4 uSplatB[16];
uniform int uSplats;
uniform vec4 uLights[24];

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),
             mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), f.x), f.y);
}
vec2 toScene(vec2 uv) { return vec2((uv.x - 0.5) * 2.0 * uExt.x + uDrift, (uv.y - 0.5) * 2.0 * uExt.y); }
vec2 wrapD(vec2 d) { float per = 2.0 * uExt.x; d.x -= per * floor(d.x / per + 0.5); return d; }
vec2 uvDelta(vec2 d) { return d / (2.0 * uExt); }

// A gust is a soft streak stretched along its own direction.
float splatShape(vec2 x, int i, out vec2 d) {
  vec4 a = uSplatA[i];
  vec2 vel = uSplatB[i].xy;
  d = wrapD(x - a.xy);

        function target(clearA, full) {

          view: prog(viewSource),

          m: [target(0, true), target(0, true)],
          sky: target(1),
          cur: 0,
          w: FLOW_W,
          h: FLOW_H,
          rebuild: function () {
            f.v.concat(f.m, [f.sky]).forEach(function (t) { gl.deleteFramebuffer(t.fb); gl.deleteTexture(t.tex); });
            f.v = [target(0), target(0)];
            f.m = [target(0, true), target(0, true)];

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

      function scenePan(x) {
        var aspect = canvas.width / Math.max(1, canvas.height);

      function reflectSound() {
        var on = audio.wanted || audio.enabled;
        soundButton.setAttribute('aria-pressed', on ? 'true' : 'false');
        soundButton.setAttribute('aria-label', 'sound: ' + (on ? 'on' : 'off'));
        soundButton.title = on ? 'sound on (S)' : 'sound off (S)';
      }

      function unlockAudio() {
        if (audio.supported && audio.wanted && !audio.enabled) {
          audio.setEnabled(true).then(function (ok) {
            if (!ok) { audio.wanted = false; reflectSound(); }
            else reflectSound();
          }).catch(function () {
            audio.wanted = false;
            reflectSound();
          });
        }
      }

      function setSound(on) {
        audio.wanted = on;
        try { localStorage.setItem('opal.void.sound', on ? 'on' : 'off'); } catch (e) { /* private */ }
        if (!audio.supported) {
          audio.wanted = false;
          soundButton.disabled = true;
          soundButton.title = 'sound unavailable';
          reflectSound();
          return;
        }
        reflectSound();
        if (on) {
          audio.setEnabled(true).then(function (ok) {
            if (!ok) {
              audio.wanted = false;
              reflectSound();
              soundButton.disabled = true;
              soundButton.title = 'sound unavailable';
            }
          }).catch(function () {
            audio.wanted = false;
            reflectSound();
            soundButton.disabled = true;
            soundButton.title = 'sound unavailable';
          });
        } else {
          audio.setEnabled(false).catch(function () {});
        }
      }

      function toScene(clientX, clientY) {
        var r = canvas.getBoundingClientRect();
        var w = Math.max(1, r.width);
        var h = Math.max(1, r.height);
        var m = Math.min(w, h);
        return {
          x: ((clientX - r.left) / w * 2 - 1) * (w / m),
          y: (1 - (clientY - r.top) / h * 2) * (h / m)
        };
      }

      function autoTarget() {
        var r = canvas.getBoundingClientRect();
        var w = Math.max(1, r.width);
        var h = Math.max(1, r.height);
        var m = Math.min(w, h);
        var nx = 0.5 + 0.27 * Math.cos(time * 0.085) * Math.cos(time * 0.037);
        var ny = 0.5 + 0.23 * Math.sin(time * 0.071 + 0.7);
        return {
          x: (nx * 2 - 1) * (w / m),
          y: (1 - ny * 2) * (h / m)
        };
      }

      function flowAt(x, y, t) {
        return {
          x: Math.sin(y * 1.6 + t * 0.10) + 0.45 * Math.cos((x + y) * 1.3 - t * 0.07),
          y: Math.cos(x * 1.4 - t * 0.08) + 0.45 * Math.sin((x - y) * 1.7 + t * 0.06)
        };
      }


      function stampMask(x, y, radius, strength, erase) {
        if (!maskCtx) return;
        var aspect = canvas.width / Math.max(1, canvas.height);
        var extX = Math.max(1, aspect);
        var extY = Math.max(1, 1 / aspect);
        // Stamp in wind space; the texture wraps horizontally, so a stamp
        // near a seam is drawn on both sides of it.
        var mx = ((x - drift) / (2 * extX) + 0.5) * MASK_W;
        mx = ((mx % MASK_W) + MASK_W) % MASK_W;
        var my = (0.5 - y / (2 * extY)) * MASK_H;
        var rx = Math.max(2, radius / (2 * extX) * MASK_W);
        var ry = Math.max(2, radius / (2 * extY) * MASK_H);
        var r = Math.max(rx, ry);
        var alpha = Math.max(0, Math.min(1, strength));
        maskCtx.save();
        maskCtx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
        var copies = [mx];
        if (mx - r < 0) copies.push(mx + MASK_W);
        if (mx + r > MASK_W) copies.push(mx - MASK_W);
        for (var i = 0; i < copies.length; i++) {
          var cx = copies[i];
          var g = maskCtx.createRadialGradient(cx, my, 0, cx, my, r);
          g.addColorStop(0, 'rgba(0,0,0,' + alpha + ')');
          g.addColorStop(0.55, 'rgba(0,0,0,' + (alpha * 0.78) + ')');
          g.addColorStop(1, 'rgba(0,0,0,0)');
