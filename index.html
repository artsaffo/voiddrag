        }
      }

      function setTuneOpen(open) {
        if (open && document.body.classList.contains('logging')) setLogOpen(false);
        if (open) document.body.classList.add('tuning');
        else document.body.classList.remove('tuning');
        tuneButton.setAttribute('aria-expanded', open ? 'true' : 'false');
        panel.setAttribute('aria-hidden', open ? 'false' : 'true');
      }

      // Adaptive render scale. Weak GPUs (TV browsers above all) cannot fill
      // ~2 MP of this shader at 60 fps, so the backing canvas shrinks until
      // frames keep up, and grows back slowly when there is headroom. Every
      // size in the scene is relative to the canvas, so only sharpness changes.
      var IS_TV = /web0s|webos|smarttv|smart-tv|tizen|netcast|hbbtv|bravia|aft[a-z]|crkey|vidaa/i.test(navigator.userAgent || '');
      var renderScale = IS_TV ? 0.5 : 1;
      var RENDER_SCALE_MIN = 0.3;
      var perfAvg = 16.7;
      var perfFrames = 0;
      var perfCool = 0;
      function adaptRenderScale(ms) {
        // Ignore stalls (tab switches, GC hitches) and the first frames.
        if (ms <= 0 || ms > 120) return;
        perfAvg += (ms - perfAvg) * 0.06;
        if (++perfFrames < 45 || --perfCool > 0) return;
        var next = renderScale;
        if (perfAvg > 21) next = Math.max(RENDER_SCALE_MIN, renderScale * (perfAvg > 30 ? 0.8 : 0.9));
        else if (perfAvg < 17.6 && renderScale < 1) next = Math.min(1, renderScale * 1.06);
        if (Math.abs(next - renderScale) > 0.005) {
          var grew = next > renderScale;
          renderScale = next;
          resize();
          // Settle before judging again; wait longer after growing so a
          // marginal device does not keep bouncing between two sizes.
          perfCool = grew ? 240 : 60;
          perfAvg = grew ? 16.7 : Math.min(perfAvg, 24);
        }
      }

      function resize() {
        var w = window.innerWidth || document.documentElement.clientWidth || 1;
        var h = window.innerHeight || document.documentElement.clientHeight || 1;
        var dpr = Math.min(window.devicePixelRatio || 1, 1.55) * renderScale;
        var cw = Math.max(1, Math.round(w * dpr));
        var ch = Math.max(1, Math.round(h * dpr));
        var maxPixels = IS_TV ? 1000000 : 2100000;
        if (cw * ch > maxPixels) {
          var scale = Math.sqrt(maxPixels / (cw * ch));
          cw = Math.max(1, Math.round(cw * scale));
          ch = Math.max(1, Math.round(ch * scale));
        }
        if (canvas.width !== cw || canvas.height !== ch) {
          canvas.width = cw;
          canvas.height = ch;
          gl.viewport(0, 0, cw, ch);
        }
      }

      function dismissHintSoon() {
        if (engaged) return;
        engaged = true;
        clearTimeout(hintTimer);
        hintTimer = setTimeout(function () { hint.classList.add('gone'); }, 2800);
      }

      function updateOrb(dt) {
        var idle = smoothstep(2.6, 9.0, (performance.now() - lastActivity) / 1000);
        var auto = autoTarget();
        var tx;
        var ty;

        if (!hasMoved) {
          if (reduceMotion) {
            tx = 0;
            ty = 0;
          } else {
            tx = auto.x;
            ty = auto.y;
          }
        } else if (reduceMotion || press > 0.02) {
          tx = user.x;
          ty = user.y;
        } else {
          var blend = idle * 0.88;
          tx = user.x + (auto.x - user.x) * blend;
          ty = user.y + (auto.y - user.y) * blend;
        }

        previousPointer.x = pointer.x;
        previousPointer.y = pointer.y;
        if (moonMode) {
          updateMoon(dt);
        } else {
          var follow = down ? 1.0 : Math.min(1, dt * 4.0);
          pointer.x += (tx - pointer.x) * follow;
          pointer.y += (ty - pointer.y) * follow;
        }

        if (dt > 0.0001) {
          var vx = (pointer.x - previousPointer.x) / dt * 0.045;
          var vy = (pointer.y - previousPointer.y) / dt * 0.045;
          pointerVel.x += (clamp(vx, -2, 2) - pointerVel.x) * Math.min(1, dt * 7);
          pointerVel.y += (clamp(vy, -2, 2) - pointerVel.y) * Math.min(1, dt * 7);
        }

        press += (pressTarget - press) * Math.min(1, dt * (moonMode ? 16 : 7));
        // The moon is slow to move but quick to answer: its glow flares the
        // moment a finger lands on it, and only then. A touch anywhere else
        // leaves it be.
        moonPress += ((moonGrab ? 1 : 0) - moonPress) * Math.min(1, dt * 16);
      }

      // The moon only moves while a finger that landed on it holds it. It is
      // heavy and the air is thick: it leans toward the finger slowly, never
      // overshoots, and when let go it loses its way within a moment. Near the
      // edge of the view it brakes, its outward speed falling off linearly to
      // nothing at the edge.
      function updateMoon(dt) {
        var g = moonGrab;
        var cap = MOON_MAX_SPEED * (reduceMotion ? 0.6 : 1);
        if (g) {
          var dx = g.x + g.moonOffX - pointer.x;
          var dy = g.y + g.moonOffY - pointer.y;
          var wx = dx * MOON_FOLLOW;
          var wy = dy * MOON_FOLLOW;
          var ws = Math.hypot(wx, wy);
          if (ws > cap) { wx *= cap / ws; wy *= cap / ws; }
          var k = Math.min(1, dt * MOON_GRIP);
          moonVel.x += (wx - moonVel.x) * k;
          moonVel.y += (wy - moonVel.y) * k;
        } else {
          var decay = Math.exp(-dt * MOON_DRAG);
          moonVel.x *= decay;
          moonVel.y *= decay;
        }
        var b = moonBounds();
        moonVel.x = brakeAxis(moonVel.x, pointer.x, b.x);
        moonVel.y = brakeAxis(moonVel.y, pointer.y, b.y);
        pointer.x = clamp(pointer.x + moonVel.x * dt, -b.x, b.x);
        pointer.y = clamp(pointer.y + moonVel.y * dt, -b.y, b.y);
      }

      // Outward speed limit falls linearly from full at MOON_BRAKE_ZONE from
      // the edge to zero at it; moving back inward is never limited.
      function brakeAxis(v, p, lim) {
        if (v === 0) return v;
        var room = (v > 0 ? lim - p : lim + p);
        var allow = MOON_MAX_SPEED * clamp(room / MOON_BRAKE_ZONE, 0, 1);
        return v > 0 ? Math.min(v, allow) : Math.max(v, -allow);
      }

      // How far the moon's centre may go: its disc stays just inside the view.
      function moonBounds() {
        var r = canvas.getBoundingClientRect();
        var m = Math.max(1, Math.min(r.width, r.height));
        return {
          x: Math.max(0, Math.max(1, r.width) / m - MOON_R * 1.1),
          y: Math.max(0, Math.max(1, r.height) / m - MOON_R * 1.1)
        };
      }

      function onMoon(x, y, isTouch) {
        return moonMode && Math.hypot(x - pointer.x, y - pointer.y) < MOON_R * (isTouch ? 1.7 : 1.3);
      }

      function moonRest() {
        var r = canvas.getBoundingClientRect();
        var w = Math.max(1, r.width);
        var h = Math.max(1, r.height);
        var m = Math.min(w, h);
        return { x: 0.42 * (w / m), y: 0.48 * (h / m) };
      }

      // ---- the camera ----
      // The view's half-extents in scene units, from the canvas as the
      // shader sees it (uRes / min(uRes)).
      function viewExt() {
        var w = Math.max(1, canvas.width);
        var h = Math.max(1, canvas.height);
        var m = Math.min(w, h);
        return { x: w / m, y: h / m };
      }

      // Star space turns slowly about a pole above the view. In skyScene
      // s = rot(t * 0.0011) * (q - pole) + pole, and GLSL's rot(a) turns a
      // vector by -a; these two keep JS in step with it.
      function sceneToStar(x, y) {
        var px = 0.35;
        var py = viewExt().y + 0.85;
        var a = time * 0.0011;
        var c = Math.cos(a);
        var s = Math.sin(a);
        var dx = x - px;
        var dy = y - py;
        return { x: px + c * dx + s * dy, y: py - s * dx + c * dy };
      }

      function starToScene(x, y) {
        var px = 0.35;
        var py = viewExt().y + 0.85;
        var a = time * 0.0011;
        var c = Math.cos(a);
        var s = Math.sin(a);
        var dx = x - px;
        var dy = y - py;
        return { x: px + c * dx - s * dy, y: py + s * dx + c * dy };
      }

      // The camera aims anywhere in the wide view, but not into the glow of
      // the towns along the bottom.
      function clampAim() {
        var e = viewExt();
        scopeAim.x = clamp(scopeAim.x, -e.x + 0.08, e.x - 0.08);
        scopeAim.y = clamp(scopeAim.y, -0.75 * e.y, e.y - 0.08);
      }

      // A new special star somewhere in view: above the lowest quarter of the
      // sky, clear of the moon and of the others.
      function spawnQuarry(i, instant) {
        var e = viewExt();
        var x = 0;
        var y = 0;
        for (var tries = 0; tries < 30; tries++) {
          x = (Math.random() * 2 - 1) * (e.x - 0.15);
          y = -0.5 * e.y + Math.random() * (1.5 * e.y - 0.15);
          var ok = !(moonMode && Math.hypot(x - pointer.x, y - pointer.y) < MOON_R * 2.5);
          for (var j = 0; ok && j < quarry.length; j++) {
            var o = quarry[j];
            if (!o || j === i) continue;
            var p = starToScene(o.sx, o.sy);
            if (Math.hypot(p.x - x, p.y - y) < 0.35) ok = false;
          }
          if (ok) break;
        }
        var st = sceneToStar(x, y);
        var seed = Math.random();
        quarry[i] = {
          sx: st.x,
          sy: st.y,
          kind: Math.floor(Math.random() * QUARRY_KINDS.length),
          seed: seed,
          name: 'VD ' + (1000 + Math.floor(seed * 9000)),
          w: instant ? 1 : 0,
          on: true,
          shotAt: -1,
          flare: 0
        };
      }

      // Each special star fades in over a few seconds. Once photographed it
      // stays a while, then makes way for a new one elsewhere; so does one
      // the sky's slow turning carries out of view.
      function updateQuarry(dt) {
        var n = clamp(Math.round(QUARRY_COUNT), 0, 6);
        var e = viewExt();
        for (var i = 0; i < 6; i++) {
          var Q = quarry[i];
          if (!Q) {
            if (i < n) spawnQuarry(i, false);
            continue;
          }
          if (i >= n) Q.on = false;
          if (Q.on) {
            if (Q.shotAt >= 0 && time - Q.shotAt > QUARRY_RESPAWN) Q.on = false;
            var p = starToScene(Q.sx, Q.sy);
            if (Math.abs(p.x) > e.x - 0.05 || p.y < -0.6 * e.y || p.y > e.y - 0.05) Q.on = false;
          }
          Q.w = clamp(Q.w + (Q.on ? dt : -dt) / 3, 0, 1);
          if (!Q.on && Q.w <= 0) {
            quarry[i] = null;
            if (i < n) spawnQuarry(i, false);
          }
        }
      }

      function uploadQuarry() {
        for (var i = 0; i < 6; i++) {
          var Q = quarry[i];
          var b = i * 4;
          if (!Q || Q.w <= 0) {
            quarryData[b + 3] = 0;
            quarryDataB[b] = -1;
            quarryDataB[b + 1] = 0;
            continue;
          }
          quarryData[b] = Q.sx;
          quarryData[b + 1] = Q.sy;
          quarryData[b + 2] = Q.kind + Q.seed * 0.998;
          quarryData[b + 3] = Q.w;
          quarryDataB[b] = Q.shotAt >= 0 ? time - Q.shotAt : -1;
          quarryDataB[b + 1] = Q.flare;
        }
        gl.uniform4fv(uniforms.quarry, quarryData);
        gl.uniform4fv(uniforms.quarryB, quarryDataB);
      }

      // ---- the visitor ----
      // Now and then (SAUCER_CHANCE) a picture of the moon brings a little
      // flying saucer: it comes out from behind the sunlit horn, swings once
      // round the front of the moon on a tilted orbit and slips away behind
      // the dark side. Photograph it and the camera is taken away from you.
      function spawnSaucer() {
        saucer = {
          age: -0.6,                       // it waits for the flash to clear
          dur: 5.8,
          a0: -1.35,
          a1: Math.PI + 1.4,
          ro: MOON_R * (1.55 + 0.25 * Math.random()),
          k: 0.26 + 0.12 * Math.random(),
          tilt: -0.35 + 0.45 * Math.random(),
          size: 0.017,
          fled: -1,
          fx: 0,
          fy: 0
        };
      }

      // Where the saucer is now: x, y in scene units, z (+ in front of the
      // moon, - behind it), size, opacity w and bank.
      function saucerNow(S) {
        var u = clamp(S.age / S.dur, 0, 1);
        var e = 0.65 * u + 0.35 * u * u * (3 - 2 * u);
        var a = S.a0 + (S.a1 - S.a0) * e;
        var ox = S.ro * Math.cos(a);
        var oy = -S.ro * S.k * Math.sin(a);
        var c = Math.cos(S.tilt);
        var s = Math.sin(S.tilt);
        var o = {
          x: pointer.x + c * ox - s * oy,
          y: pointer.y + s * ox + c * oy,
          z: Math.sin(a),
          size: S.size * (1 + 0.15 * Math.sin(a)),
          w: clamp(S.age / 0.3, 0, 1) * moonAmount,
          bank: S.tilt + 0.07 * Math.sin(S.age * 2.3)
        };
        if (S.fled >= 0) {
          // Caught: it shoots off, shrinking into the distance.
          var f = S.age - S.fled;
          o.x += S.fx * f * f * 2.6;
          o.y += S.fy * f * f * 2.6;
          o.size *= Math.max(0.15, 1 - f * 1.1);
          o.w *= clamp(1 - f / 0.8, 0, 1);
          o.z = 1;
        }
        return o;
      }

      function updateSaucer(dt) {
        if (!saucer) return;
        saucer.age += dt;
        if (saucer.fled >= 0 ? saucer.age - saucer.fled > 0.8 : saucer.age > saucer.dur) saucer = null;
      }

      function uploadSaucer() {
        saucerData[3] = 0;
        if (saucer && saucer.age > 0) {
          var o = saucerNow(saucer);
          saucerData[0] = o.x;
          saucerData[1] = o.y;
          saucerData[2] = o.z;
          saucerData[3] = o.w;
          saucerDataB[0] = o.bank;
          saucerDataB[1] = o.size;
          saucerDataB[2] = saucer.age;
        }
        gl.uniform4fv(uniforms.saucer, saucerData);
        gl.uniform4fv(uniforms.saucerB, saucerDataB);
        var G = critterGlint;
        if (G && time - G.at > 8) G = critterGlint = null;
        gl.uniform4f(uniforms.glint, G ? G.cell : 0, G ? G.code : 0, G ? time - G.at : -1, G && G.red ? 1 : 0);
        gl.uniform1f(uniforms.flash, Math.min(1e3, time - flashAt));
      }

      // Is the saucer in the reticle's ring, and not hidden behind the moon?
      function saucerInShot() {
        if (!saucer || saucer.fled >= 0 || saucer.age <= 0) return false;
        var o = saucerNow(saucer);
        if (o.w < 0.4) return false;
        if (o.z < 0 && Math.hypot(o.x - pointer.x, o.y - pointer.y) < MOON_R) return false;
        var tol = Math.max(SNAP_TOL / Math.max(1, SCOPE_ZOOM), o.size * 1.4);
        return Math.hypot(o.x - scopeAim.x, o.y - scopeAim.y) < tol;
      }

      function moonInShot() {
        return moonMode && moonAmount > 0.5 &&
          Math.hypot(pointer.x - scopeAim.x, pointer.y - scopeAim.y) < MOON_R * 1.15;
      }

      function caughtSaucer() {
        var o = saucerNow(saucer);
        var dx = o.x - pointer.x;
        var dy = o.y - pointer.y + 0.25;
        var l = Math.hypot(dx, dy) || 1;
        saucer.fled = saucer.age;
        saucer.fx = dx / l;
        saucer.fy = dy / l;
        setScope(false);
        showShot('<b>unidentified</b> &middot; the picture came out blank', 'miss', 5200);
        audio.visitor();
        try { if (navigator.vibrate) navigator.vibrate([30, 80, 30, 80, 120]); } catch (err) { /* optional */ }
      }

      var scopeUi = document.getElementById('scopeUi');
      var reticleRing = document.getElementById('reticleRing');
      var reticleCross = document.getElementById('reticleCross');
      var reticleTicks = document.getElementById('reticleTicks');
      var shotCard = document.getElementById('shot');
      var flashEl = document.getElementById('flash');
      var shotTimer = 0;
      var scopeHintTimer = 0;
      var reticleFor = '';

      // Sizes the reticle to the lens: the ring is SNAP_TOL, so a star inside
      // it is in the picture.
      function layoutReticle() {
        var key = SCOPE_LENS + '/' + SNAP_TOL + '/' + window.innerWidth + 'x' + window.innerHeight;
        if (key === reticleFor) return;
        reticleFor = key;
        var w = window.innerWidth || 1;
        var h = window.innerHeight || 1;
        document.documentElement.style.setProperty('--lens', (SCOPE_LENS * Math.min(w, h) / 2).toFixed(1) + 'px');
        var r = clamp(SNAP_TOL / Math.max(0.05, SCOPE_LENS) * 100, 2, 60);
        reticleRing.setAttribute('r', r.toFixed(2));
        var g = r + 5;
        reticleCross.setAttribute('d',
          'M' + g + ' 0H62M-' + g + ' 0H-62M0 ' + g + 'V62M0 -' + g + 'V-62');
        var t = '';
        for (var k = 1; k <= 3; k++) {
          var at = (g + (62 - g) * k / 4).toFixed(1);
          t += 'M' + at + ' -2V2M-' + at + ' -2V2M-2 ' + at + 'H2M-2 -' + at + 'H2';
        }
        reticleTicks.setAttribute('d', t);
      }

      function showHintFor(html, ms) {
        hint.innerHTML = html;
        hint.classList.remove('gone');
        clearTimeout(hintTimer);
        clearTimeout(scopeHintTimer);
        scopeHintTimer = setTimeout(function () { hint.classList.add('gone'); }, ms);
      }

      function setScope(on) {
        on = !!on;
        if (on === scope) return;
        scope = on;
        scopeGrab = null;
        scopeVel.x = 0;
        scopeVel.y = 0;
        scopeKeys.x = 0;
        scopeKeys.y = 0;
        if (on) {
          if (!sky) setSky(true);
          setTuneOpen(false);
          // Look where the finger last was: usually the gap just made.
          scopeAim.x = hasMoved ? user.x : 0;
          scopeAim.y = hasMoved ? user.y : 0.2;
          clampAim();
          if (pendingTapBloom) { clearTimeout(pendingTapBloom); pendingTapBloom = 0; }
          lastTapAt = 0;
          var touchy = document.body.classList.contains('touch') ||
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
          showHintFor(touchy ? 'drag: aim &middot; tap: take the picture'
            : 'drag or arrows: aim &middot; click or space: take the picture &middot; Z: back', 5200);
        }
        document.body.classList.toggle('scoping', on);
        scopeButton.setAttribute('aria-pressed', on ? 'true' : 'false');
        scopeButton.setAttribute('aria-label', 'the camera: ' + (on ? 'on' : 'off'));
        audio.contact(on ? 'light' : 'dark', 0, 0.35);
      }

      function updateScope(dt) {
        scopeAmount += ((scope ? 1 : 0) - scopeAmount) * Math.min(1, dt * 2.6);
        if (Math.abs(scopeAmount - (scope ? 1 : 0)) < 0.002) scopeAmount = scope ? 1 : 0;
        if (scopeGrab) return;
        var Z = Math.max(1, SCOPE_ZOOM);
        if (scopeKeys.x || scopeKeys.y) {
          var sp = 0.32 / Z;
          var k = Math.min(1, dt * 8);
          scopeVel.x += (scopeKeys.x * sp - scopeVel.x) * k;
          scopeVel.y += (scopeKeys.y * sp - scopeVel.y) * k;
        } else {
          var decay = Math.exp(-dt * 4);
          scopeVel.x *= decay;
          scopeVel.y *= decay;
        }
        scopeAim.x += scopeVel.x * dt;
        scopeAim.y += scopeVel.y * dt;
        clampAim();
      }

      // uView: zooming in moves the aim point to the middle of the screen as
      // the magnification grows, and the housing closes in around the lens.
      function writeView() {
        var e = ease(clamp(scopeAmount, 0, 1));
        var Z = Math.max(1, SCOPE_ZOOM);
        var zoom = Math.exp(Math.log(Z) * e);
        var k = Z > 1.0001 ? (1 - 1 / zoom) / (1 - 1 / Z) : 0;
        var ex = viewExt();
        var far = Math.hypot(ex.x, ex.y) + 0.1;
        var lensR = scopeAmount < 0.001 ? 1e4 : SCOPE_LENS + (far - SCOPE_LENS) * (1 - e);
        gl.uniform4f(uniforms.view, scopeAim.x * k, scopeAim.y * k, zoom, lensR);
        gl.uniform1f(uniforms.scope, e);
      }

      function scopeDown(e) {
        e.preventDefault();
        unlockAudio();
        lastActivity = performance.now();
        if (e.pointerType === 'touch') document.body.classList.add('touch');
        if (scopeGrab) return;   // one finger aims
        var pos = toScene(e.clientX, e.clientY);
        scopeGrab = { id: e.pointerId, px: e.clientX, py: e.clientY, x: pos.x, y: pos.y,
                      moved: false, t: performance.now(), vx: 0, vy: 0 };
        scopeVel.x = 0;
        scopeVel.y = 0;
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        document.body.classList.add('dragging');
      }

      // Dragging moves the sky with the finger, like a map.
      function scopeMove(e) {
        var g = scopeGrab;
        var pos = toScene(e.clientX, e.clientY);
        if (!g.moved && Math.hypot(e.clientX - g.px, e.clientY - g.py) > 7) g.moved = true;
        var Z = Math.max(1, SCOPE_ZOOM);
        var dx = (pos.x - g.x) / Z;
        var dy = (pos.y - g.y) / Z;
        g.x = pos.x;
        g.y = pos.y;
        scopeAim.x -= dx;
        scopeAim.y -= dy;
        clampAim();
        var now = performance.now();
        var dts = Math.max(4, now - g.t) / 1000;
        g.t = now;
        g.vx += (-dx / dts - g.vx) * 0.5;
        g.vy += (-dy / dts - g.vy) * 0.5;
        lastActivity = now;
      }

      function scopeRelease(e) {
        var g = scopeGrab;
        scopeGrab = null;
        document.body.classList.remove('dragging');
        if (!g.moved) {
          if (e.type === 'pointerup') shutter();
        } else if (performance.now() - g.t < 80) {
          // A flick carries the camera on a little.
          var cap = 0.9 / Math.max(1, SCOPE_ZOOM);
          var s = Math.hypot(g.vx, g.vy);
          var f = s > cap ? cap / s : 1;
          scopeVel.x = g.vx * f;
          scopeVel.y = g.vy * f;
        }
      }

      function showShot(html, cls, ms) {
        shotCard.innerHTML = html;
        shotCard.className = 'shot ' + cls;
        void shotCard.offsetWidth;
        shotCard.classList.add('show');
        clearTimeout(shotTimer);
        shotTimer = setTimeout(function () { shotCard.classList.remove('show'); }, ms || 3200);
      }

      // The shutter: a flash and a click at once; whether a star is in the
      // picture is settled a frame or two later (stepShot, then resolveShot),
      // once the sky over it has been read back from the GPU.
      function shutter() {
        var now = performance.now();
        if (!scope || scopeAmount < 0.9 || shotPending) return;
        if (now - lastShutterAt < SHUTTER_COOLDOWN * 1000) return;
        lastShutterAt = now;
        flashEl.classList.remove('go');
        void flashEl.offsetWidth;
        flashEl.classList.add('go');
        flashAt = time;
        audio.shutter(0);
        if (saucerInShot()) {
          caughtSaucer();
          return;
        }
        if (lampInShot()) {
          caughtLamp();
          return;
        }
        // On the ride, ask the GPU first whether a creature in the pines is
        // in the ring; if not, look for a star (aimShot).
        if (rideAmount > 0.5) {
          shotPending = { critter: true, x: scopeAim.x, y: scopeAim.y };
          return;
        }
        aimShot();
      }

      // The stars and the moon: what the picture holds when no creature does.
      function aimShot() {
        var best = null;
        var bestD = 1e9;
        var bestP = null;
        for (var i = 0; i < quarry.length; i++) {
          var Q = quarry[i];
          if (!Q || !Q.on || Q.w < 0.6) continue;
          var p = starToScene(Q.sx, Q.sy);
          var d = Math.hypot(p.x - scopeAim.x, p.y - scopeAim.y);
          if (d < bestD) { bestD = d; best = Q; bestP = p; }
        }
        var tol = SNAP_TOL / Math.max(1, SCOPE_ZOOM);
        if (!best || bestD > tol) {
          if (moonInShot()) {
            showShot('the moon &middot; lovely, but not for the log', 'miss', 2200);
            if (!saucer && Math.random() < SAUCER_CHANCE) spawnSaucer();
            return;
          }
          showShot('nothing in the crosshair', 'miss', 2200);
          return;
        }
        shotPending = { Q: best, d: bestD / tol };
      }

      // Draws one pixel of the sky at scene point (x, y) into a 1x1 target
      // with uProbe set, and starts reading back how clear it is (0..1). Runs
      // right after the main draw, so every other uniform is already in
      // place. The read goes into a pixel buffer behind a fence and is picked
      // up a frame or two later (stepShot): a plain readPixels waits for the
      // GPU to finish everything, which stalled the phone for ~100 ms.
      function probeStart(x, y, reach) {
        ensureProbeTarget();
        gl.bindFramebuffer(gl.FRAMEBUFFER, probeTarget.fb);
        gl.viewport(0, 0, 1, 1);
        gl.uniform3f(uniforms.probe, x, y, 1 + (reach || 0));
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probeTarget.pbo);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        var fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        gl.flush();
        gl.uniform3f(uniforms.probe, 0, 0, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        return fence;
      }

      // Made once at start, so the first shot doesn't pay for it.
      function ensureProbeTarget() {
        if (!probeTarget) {
          var tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
          var fb = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
          var pbo = gl.createBuffer();
          gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
          gl.bufferData(gl.PIXEL_PACK_BUFFER, 4, gl.STREAM_READ);
          gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
          probeTarget = { tex: tex, fb: fb, pbo: pbo, px: new Uint8Array(4) };
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, maskTexture);
        }
      }

      // Called after each main draw while a shot is in hand: the first time it
      // starts the probe, then it waits (without blocking) for the GPU's answer.
      function stepShot() {
        var s = shotPending;
        if (!s.fence) {
          var p = s.warm ? { x: 0, y: 0 } : s.critter ? s : starToScene(s.Q.sx, s.Q.sy);
          s.fence = probeStart(p.x, p.y, s.critter ? SNAP_TOL / Math.max(1, SCOPE_ZOOM) : 0);
          s.frames = 0;
          return;
        }
        s.frames++;
        var st = gl.clientWaitSync(s.fence, 0, 0);
        if (st !== gl.ALREADY_SIGNALED && st !== gl.CONDITION_SATISFIED && s.frames < 30) return;
        gl.deleteSync(s.fence);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probeTarget.pbo);
        gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, probeTarget.px);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        shotPending = null;
        if (s.critter) resolveCritter(probeTarget.px[1], probeTarget.px[2]);
        else if (!s.warm) resolveShot(s, probeTarget.px[0] / 255);
      }

      // A creature in the ring: its eyes glint in the flash; a red-eyed one
      // snarls, softly.
      function resolveCritter(cell, b) {
        if (!(b & 1)) {
          if (scope) aimShot();
          return;
        }
        var code = (b >> 1) & 7;
        var kind = CRITTER_KINDS[Math.min(2, (b >> 4) & 3)];
        var red = !!((b >> 6) & 1);
        critterGlint = { cell: cell, code: code, at: flashAt, red: red };
        if (red) {
          showShot('<b>a ' + kind + '</b> &middot; its eyes are red', 'creepy', 3800);
          audio.snarl(0);
          try { if (navigator.vibrate) navigator.vibrate([0, 120, 40, 60]); } catch (err) { /* optional */ }
        } else {
          var line = kind === 'squirrel' ? 'its eyes caught the flash'
            : kind === 'nest' ? 'something in it looked back' : 'awake now';
          showShot('<b>a ' + kind + '</b> &middot; ' + line, 'hit', 3200);
        }
      }

      function starsText(n) {
        var s = '';
        for (var i = 0; i < 3; i++) s += i < n ? '★' : '☆';
        return s;
      }

      function resolveShot(s, clear) {
        var Q = s.Q;
        if (clear < SNAP_CLEAR) {
          showShot('too cloudy &middot; wait for a gap', 'miss', 2600);
          return;
        }
        var centred = 1 - clamp(s.d, 0, 1);
        var clearQ = SNAP_CLEAR >= 0.999 ? 1 : clamp((clear - SNAP_CLEAR) / (1 - SNAP_CLEAR), 0, 1);
        var q = 0.5 * centred + 0.5 * clearQ;
        var score = q > 0.72 ? 3 : q > 0.4 ? 2 : 1;
        // The flourish plays once through before it can play again: a
        // picture taken while it is still going is logged, but quietly.
        var flourish = !(Q.shotAt >= 0 && time - Q.shotAt < FLOURISH_LEN);
        if (flourish) {
          Q.shotAt = time;
          Q.flare = 0.55 + 0.15 * score;
        }
        var res = recordFind(Q, score);
        var tag = res === 'new' ? 'new' : res === 'better' ? 'a better picture' : 'already in the log';
        if (res !== 'again') addPoints(res === 'new' ? 10 * score : 5);
        showShot('<b>' + Q.name + '</b> &middot; ' + QUARRY_KINDS[Q.kind] + ' &middot; <span class="stars">' +
          starsText(score) + '</span> &middot; ' + tag, 'hit', 4200);
        if (!flourish) return;
        audio.aperture('light', 0, 0.9);
        try { if (navigator.vibrate) navigator.vibrate([8, 40, 18]); } catch (err) { /* optional */ }
      }

      // ---- the logbook ----
      // Every star photographed, newest first, kept in opal.void.log.
      var logPanel = document.getElementById('log');
      var logList = document.getElementById('logList');
      var logSummary = document.getElementById('logSummary');
      var logEntries = [];

      function loadLog() {
        try {
          var a = JSON.parse(localStorage.getItem('opal.void.log') || '[]');
          if (!Array.isArray(a)) return;
          logEntries = a.filter(function (x) {
            return x && typeof x.id === 'string' && typeof x.name === 'string' &&
              QUARRY_KINDS.indexOf(x.kind) >= 0 && x.score >= 1 && x.score <= 3 && isFinite(x.when);
          }).slice(0, 200);
        } catch (e) { /* private or damaged */ }
      }

      function saveLog() {
        try { localStorage.setItem('opal.void.log', JSON.stringify(logEntries)); } catch (e) { /* private */ }
      }

      // 'new', 'better' (a higher score for a star already logged) or 'again'.
      function recordFind(Q, score) {
        var kind = QUARRY_KINDS[Q.kind];
        var id = Q.name + '/' + kind;
        var res = 'new';
        for (var i = 0; i < logEntries.length; i++) {
          var x = logEntries[i];
          if (x.id !== id) continue;
          res = score > x.score ? 'better' : 'again';
          if (res === 'better') { x.score = score; x.when = Date.now(); }
          logEntries.splice(i, 1);
          logEntries.unshift(x);
          break;
        }
        if (res === 'new') {
          logEntries.unshift({ id: id, name: Q.name, kind: kind, score: score, when: Date.now() });
          if (logEntries.length > 200) logEntries.length = 200;
        }
        saveLog();
        renderLog();
        return res;
      }

      function renderLog() {
        var n = logEntries.length;
        renderLogSummary();
        logList.textContent = '';
        if (n === 0) {
          var empty = document.createElement('li');
          empty.className = 'log-empty';
          empty.textContent = 'No stars yet. Part the cloud, then look through the camera (Z) and take a picture of one of the rarer stars.';
          logList.appendChild(empty);
          return;
        }
        logEntries.forEach(function (x) {
          var li = document.createElement('li');
          var sw = document.createElement('span');
          sw.className = 'log-swatch sw-' + x.kind;
          var nm = document.createElement('span');
          nm.className = 'log-name';
          nm.textContent = x.name;
          var kd = document.createElement('span');
          kd.className = 'log-kind';
          kd.textContent = x.kind;
          var st = document.createElement('span');
          st.className = 'log-stars';
          st.textContent = starsText(x.score);
          var when = document.createElement('span');
          when.className = 'log-when';
          try {
            when.textContent = new Date(x.when).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
          } catch (e) { when.textContent = ''; }
          li.appendChild(sw);
          li.appendChild(nm);
          li.appendChild(kd);
          li.appendChild(st);
          li.appendChild(when);
          logList.appendChild(li);
        });
      }

      function renderLogSummary() {
        var kinds = {};
        logEntries.forEach(function (x) { kinds[x.kind] = (kinds[x.kind] || 0) + 1; });
        var n = logEntries.length;
        var bits = [];
        if (n > 0) {
          bits.push(n + (n === 1 ? ' star' : ' stars'));
          bits.push(QUARRY_KINDS.filter(function (k) { return kinds[k]; }).map(function (k) { return kinds[k] + ' ' + k; }).join(', '));
        }
        logSummary.textContent = bits.join(' · ');
      }

      function setLogOpen(open) {
        if (open) setTuneOpen(false);
        document.body.classList.toggle('logging', !!open);
        logPanel.setAttribute('aria-hidden', open ? 'false' : 'true');
      }

      // ---- points ----
      // Kept quietly in opal.void.points and not shown anywhere for now.
      var pointsTotal = 0;
      try {
        var savedPoints = parseInt(localStorage.getItem('opal.void.points'), 10);
        if (isFinite(savedPoints) && savedPoints > 0) pointsTotal = savedPoints;
      } catch (e) { /* private */ }

      function addPoints(n) {
        pointsTotal += n;
        try { localStorage.setItem('opal.void.points', String(pointsTotal)); } catch (e) { /* private */ }
      }

      // ---- the moon's cycle ----
      // Dust you blow into the moon sinks into it with a spark on the rim, and
      // each mote waxes it a little from its crescent. Dust that only drifts
      // there passes behind it. Full, it has its moment, holds for a while,
      // then wanes back on its own.
      var MOON_SIP = 0.0035;         // one mote's share of the cycle, at 1200 motes on a 4:3 view
      var MOON_GULP = 0.10;          // the most of the cycle it takes in at once; it refills over 4 s
      var STEER_HOLD = 1.6;          // seconds a mote still counts as blown after your wind lets it go
      var MOON_SINK = 0.7;           // seconds a sinking mote's spark lasts
      var MOON_FULL_HOLD = 20;       // scene seconds it stays full
      var MOON_WANE = 90;            // scene seconds from full back to the crescent
      var moonCharge = 0;
      var moonShown = 0;             // moonCharge, eased, as drawn
      var moonFullUntil = -1;
      var moonWaning = false;
      var moonFlare = 0;
      var moonSipGlow = 0;           // the halo's brief swell as dust sinks in
      var moonThirst = MOON_GULP;    // how much it can take in right now
      var moonPaid = 0;              // tenths of the cycle already scored

      // Can the moon take in dust now? Not while held, not while full, and
      // not past one gulp at a time: the rest of a big stroke passes behind.
      function moonDrinks() {
        return !moonGrab && moonFullUntil < 0 && moonThirst > 0 && moonMode && moonAmount > 0.9 && skyAmount > 0.9 && scopeAmount < 0.5;
      }

      function moonSip() {
        // Thinner dust (fewer motes, or a taller screen) brings fewer motes
        // per stroke, so each is worth more: a stroke fills the same anywhere.
        var e = viewExt();
        var density = activeParticles / (4 * e.x * e.y);
        var gain = MOON_SIP * clamp(225 / density, 0.5, 8);
        moonThirst -= gain;
        moonCharge = Math.min(1, moonCharge + gain);
        moonSipGlow = Math.min(1, moonSipGlow + 0.22);
        var tenths = Math.floor(moonCharge * 10 + 1e-6);
        while (moonPaid < tenths) {
          moonPaid++;
          if (moonPaid < 10) addPoints(10);
        }
        if (moonCharge >= 1) fullMoon();
      }

      function fullMoon() {
        moonCharge = 1;
        moonFullUntil = time + MOON_FULL_HOLD;
        moonWaning = false;
        moonFlare = 1;
        moonPaid = 10;
        addShock(pointer.x, pointer.y, 0.95, MOON_SHOCK_REACH);
        burstParticles(pointer.x, pointer.y, reduceMotion ? 14 : 46, reduceMotion ? 0.7 : 1.25);
        impulseParticles(pointer.x, pointer.y, 0.7, reduceMotion ? 0.25 : 0.6);
        audio.aperture('light', scenePan(pointer.x), 1.0);
        addPoints(100);
        showShot('<b>full moon</b>', 'hit', 3600);
        try { if (navigator.vibrate) navigator.vibrate([14, 50, 14, 50, 40]); } catch (err) { /* optional */ }
      }

      function updateMoonCycle(dt) {
        moonFlare *= Math.exp(-dt / 1.6);
        moonSipGlow *= Math.exp(-dt / 0.5);
        moonThirst = Math.min(MOON_GULP, moonThirst + MOON_GULP / 4 * dt);
        if (moonFullUntil >= 0) {
          if (time >= moonFullUntil) {
            moonFullUntil = -1;
            moonWaning = true;
          }
        } else if (moonWaning) {
          moonCharge -= dt / MOON_WANE;
          if (moonCharge <= 0) {
            moonCharge = 0;
            moonWaning = false;
          }
          // What the moon has lost can be earned again.
          moonPaid = Math.min(moonPaid, Math.floor(moonCharge * 10 + 1e-6));
        }
        moonShown += (moonCharge - moonShown) * Math.min(1, dt * 2.5);
      }

      // ---- the streetlamp ----
      // A rare sight on the ride. It warms the pines and creatures around it
      // until you photograph it dark; for a while after, the sky is darker too.
      var LAMP_REACH = 0.85;         // how fast it passes, like a tree in that lane
      var LAMP_FIRST = [50, 120];    // scene seconds before the first one
      var LAMP_EVERY = [120, 240];   // and between later ones
      var LAMP_DARK = 30;            // scene seconds the sky stays darker
      var lamp = null;
      var nextLampAt = time + LAMP_FIRST[0] + Math.random() * (LAMP_FIRST[1] - LAMP_FIRST[0]);
      var skyDark = 0;
      var skyDarkUntil = -1;

      function spawnLamp() {
        lamp = {
          side: Math.random() < 0.5 ? -1 : 1,
          wy: viewExt().y + 0.32 + travel * LAMP_REACH,
          shotAt: -1,
          seed: Math.random() * 50
        };
      }

      function lampHead() {
        return { x: lamp.side * viewExt().x * 0.62, y: lamp.wy - travel * LAMP_REACH };
      }

      // Its light now: a slight hum, then a stutter and dark once photographed.
      function lampLightNow() {
        if (!lamp) return 0;
        if (lamp.shotAt < 0) {
          return reduceMotion ? 0.96 : 0.95 + 0.05 * Math.sin(time * 31 + lamp.seed) * Math.sin(time * 7.3);
        }
        var a = time - lamp.shotAt;
        if (a >= 0.95) return 0;
        var left = 1 - a / 0.95;
        return reduceMotion ? left : left * (Math.sin(a * 47) > -0.2 ? 1 : 0.12);
      }

      function updateLamp(dt) {
        if (!ride) nextLampAt = Math.max(nextLampAt, time + 20);
        if (!lamp && ride && sky && rideAmount > 0.95 && skyAmount > 0.95 && !stillMode && time > nextLampAt) spawnLamp();
        if (lamp && (rideAmount <= 0 || lampHead().y < -viewExt().y - 0.5)) {
          lamp = null;
          nextLampAt = time + LAMP_EVERY[0] + Math.random() * (LAMP_EVERY[1] - LAMP_EVERY[0]);
        }
        var want = time < skyDarkUntil ? 1 : 0;
        skyDark += (want - skyDark) * Math.min(1, dt * (want ? 0.9 : 0.35));
        if (skyDark < 0.001 && !want) skyDark = 0;
      }

      function lampInShot() {
        if (!lamp || lamp.shotAt >= 0 || rideAmount < 0.5) return false;
        var h = lampHead();
        var tol = Math.max(SNAP_TOL / Math.max(1, SCOPE_ZOOM), 0.045);
        return Math.hypot(h.x - scopeAim.x, h.y - scopeAim.y) < tol;
      }

      function caughtLamp() {
        var h = lampHead();
        lamp.shotAt = time;
        skyDarkUntil = time + LAMP_DARK;
        addPoints(50);
        showShot('<b>streetlamp</b> &middot; dark now &middot; the stars come closer', 'hit', 4200);
        audio.aperture('dark', scenePan(h.x), 0.8);
        try { if (navigator.vibrate) navigator.vibrate([10, 30, 10, 60, 24]); } catch (err) { /* optional */ }
      }

      function uploadGame() {
        gl.uniform3f(uniforms.moonCycle, moonShown, moonFlare, moonSipGlow);
        if (lamp) {
          var h = lampHead();
          gl.uniform4f(uniforms.lamp, h.x, h.y, lampLightNow(), rideAmount);
        } else {
          gl.uniform4f(uniforms.lamp, 0, 0, 0, 0);
        }
        gl.uniform1f(uniforms.skyDark, skyDark);
      }

      function frame(now) {
        if (!running) return;
        raf = requestAnimationFrame(frame);
        if (!last) last = now;
        var dt = (now - last) / 1000;
        last = now;
        adaptRenderScale(dt * 1000);
        if (dt > 0.06) dt = 0.06;
        if (dt < 0) dt = 0;
        time += dt * 0.92;
        labTick(dt);
        if (!reduceMotion && !down && time > nextPulse) {
          addShock(pointer.x, pointer.y, 0.26, moonMode ? MOON_SHOCK_REACH : 1);
          burstParticles(pointer.x, pointer.y, 8, 0.42);
          impulseParticles(pointer.x, pointer.y, 0.40, 0.14);
          nextPulse = time + 8 + Math.random() * 7;
        }

        updateOrb(dt);
        updateScope(dt);
        updateQuarry(dt);
        updateSaucer(dt);
        updateMoonCycle(dt);
        updateLamp(dt);
        layoutReticle();
        moonBreath *= Math.exp(-dt / moonBreathLife);
        moonAmount += ((moonMode ? 1 : 0) - moonAmount) * Math.min(1, dt * 2.2);
        if (Math.abs(moonAmount - (moonMode ? 1 : 0)) < 0.001) moonAmount = moonMode ? 1 : 0;
        moonGusts();

        // The pines keep passing while the ride fades in and out.
        rideAmount += ((ride ? 1 : 0) - rideAmount) * Math.min(1, dt * 1.3);
        if (rideAmount < 0.001 && !ride) rideAmount = 0;
        // Through the camera the ride slows to a crawl, so a creature can be followed.
        if (rideAmount > 0) travel += dt * 0.16 * settings.pace * (reduceMotion ? 0.35 : 1) * (1 - 0.8 * scopeAmount);

        // The wind only blows under the sky; the void keeps its mask still.
        skyAmount += ((sky ? 1 : 0) - skyAmount) * Math.min(1, dt * 1.1);
        if (Math.abs(skyAmount - (sky ? 1 : 0)) < 0.001) skyAmount = sky ? 1 : 0;
        drift += dt * SKY_WIND * skyAmount * (reduceMotion ? 0.35 : 1);

        if (paletteMix < 1) {
          paletteMix = Math.min(1, paletteMix + dt / 0.95);
          writePalette();
        }

        fadeMask(dt);
        updateMarks(dt);
        updateShocks();
        updateFlyers(dt);
        updateLights(dt);
        updateAttractors();
        updateAudio(dt);
        updateParticles(dt);
        uploadParticles();
        uploadLights();
        uploadMask();
        stepFlow(dt);
        gl.useProgram(program);
        uploadMarks();
        gl.uniform4fv(uniforms.shocks, shockData);
        gl.uniform4fv(uniforms.lights, lightData);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, maskTexture);
        gl.uniform1i(uniforms.mask, 0);
        gl.uniform2f(uniforms.res, canvas.width, canvas.height);
        gl.uniform1f(uniforms.time, time);
        gl.uniform2f(uniforms.pointer, pointer.x, pointer.y);
        gl.uniform2f(uniforms.pointerVel, pointerVel.x, pointerVel.y);
        // uPress lights the pearl for any touch, but the moon only for its own.
        gl.uniform1f(uniforms.press, press + (moonPress - press) * moonAmount);
        gl.uniform1f(uniforms.veil, settings.veil);
        gl.uniform1f(uniforms.erode, erodeForTrail());
        gl.uniform1f(uniforms.ride, rideAmount);
        gl.uniform1f(uniforms.travel, travel);
        gl.uniform1f(uniforms.pines, pinesFine ? 1 : 0);
        gl.uniform1f(uniforms.sky, skyAmount);
        gl.uniform1f(uniforms.drift, drift);
        gl.uniform1f(uniforms.flowOn, flowOK ? 1 : 0);
        gl.uniform1f(uniforms.moonOn, moonAmount);
        gl.uniform4fv(uniforms.fly, flyData);
        gl.uniform4fv(uniforms.flyB, flyDataB);
        writeView();
        uploadQuarry();
        uploadSaucer();
        uploadGame();
        if (flowOK) {
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, flow.sky.tex);
          gl.uniform1i(uniforms.flow, 1);
          gl.activeTexture(gl.TEXTURE2);
          gl.bindTexture(gl.TEXTURE_2D, flow.v[flow.cur].tex);
          gl.uniform1i(uniforms.wind, 2);
          gl.activeTexture(gl.TEXTURE0);
        }
        // The shutter's probe draws into its own target before the screen is
        // touched this frame (like the wind passes): switching targets
        // halfway through the screen's draw costs a tiled phone GPU dearly.
        if (shotPending) stepShot();
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        drawParticles();

        if (!document.body.classList.contains('ready')) document.body.classList.add('ready');
      }

      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      function syncActiveState() {
        var anyPainting = false;
        active.forEach(function (state) { if (state.painting) anyPainting = true; });
        painting = anyPainting;
        pressTarget = active.size > 0 ? 1 : 0;
        if (active.size > 0) document.body.classList.add('dragging');
        else document.body.classList.remove('dragging');
      }

      function reflectBrushMode() {
        document.body.classList.toggle('light-mode', lightMode);
        if (modeName) modeName.textContent = lightMode ? 'brush · light' : 'brush · dark';
        if (modeChip) {
          modeChip.setAttribute('aria-label', 'brush: ' + (lightMode ? 'light' : 'dark') + '; double-tap to switch');
        }
      }

      function toggleBrushMode() {
        lightMode = !lightMode;
        reflectBrushMode();
        audio.contact(lightMode ? 'light' : 'dark', scenePan(pointer.x), 0.5);
        try {
          if (navigator.vibrate) navigator.vibrate(lightMode ? [10, 28, 14] : 12);
        } catch (err) { /* vibration is optional */ }
      }

      canvas.addEventListener('pointerdown', function (e) {
        if (e.button !== undefined && e.button !== 0 && e.button !== 2) return;
        // Through the camera a finger aims instead of blowing the cloud.
        if (scope) { scopeDown(e); return; }
        var isTouch = e.pointerType === 'touch';
        // Mouse/pen keeps its single-pointer left/right behavior.
        if (!isTouch && active.size > 0) return;
        e.preventDefault();
        unlockAudio();
        lastActivity = performance.now();
        dismissHintSoon();
        pressTarget = 1;
        nextPulse = time + 7 + Math.random() * 5;
        stillMode = false;
        document.body.classList.add('dragging');

        var pos = toScene(e.clientX, e.clientY);
        var now = performance.now();
        var lone = active.size === 0;
        var tapToggle = false;
        if (isTouch) {
          document.body.classList.add('touch');
          if (lone && lastTapAt && now - lastTapAt < TAP_MS &&
              Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 32) {
            // Hold the flip until release: if this second touch turns into a
            // drag, it should paint instead of switching the brush.
            tapToggle = true;
            lastTapAt = 0;
            if (pendingTapBloom) {
              clearTimeout(pendingTapBloom);
              pendingTapBloom = 0;
            }
          }
        }

        var kind = isTouch ? (lightMode ? 'light' : 'dark') : (e.button === 2 ? 'light' : 'dark');

        var state = {
          id: e.pointerId,
          kind: kind,
          touch: isTouch,
          lone: lone,
          tapToggle: tapToggle,
          sx: pos.x,
          sy: pos.y,
          x: pos.x,
          y: pos.y,
          px: e.clientX,
          py: e.clientY,
          moved: false,
          seeded: false,
          painting: false,
          lastPaint: { x: pos.x, y: pos.y },
          lastPaintAt: time,
          lastLight: { x: pos.x, y: pos.y },
          lastLightAt: time
        };
        // A finger that lands on the moon takes hold of it instead of painting.
        if (!moonGrab && !tapToggle && onMoon(pos.x, pos.y, isTouch)) {
          state.moon = true;
          state.moonOffX = pointer.x - pos.x;
          state.moonOffY = pointer.y - pos.y;
          moonGrab = state;
          state.moonSince = time;
          moonLane = Math.random() * 4;
          document.body.classList.add('holding-moon');
        }
        active.set(e.pointerId, state);
        if (!down) {
          down = state;
          user.x = pos.x;
          user.y = pos.y;
          hasMoved = true;
          // The pearl jumps to the finger; the moon sets off toward it.
          if (!moonMode) {
            pointer.x = pos.x;
            pointer.y = pos.y;
          }
        }
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        if (!tapToggle) audio.contact(kind, scenePan(pos.x), 0.75);
        if (!isTouch && e.button !== 2 && !state.moon) addMark(pos.x, pos.y, 0.125, 18, 0.90, 0.20);
        syncActiveState();
      });

      window.addEventListener('pointermove', function (e) {
        if (scopeGrab && e.pointerId === scopeGrab.id) { scopeMove(e); return; }
        if (scope && !active.has(e.pointerId)) return;
        var state = active.get(e.pointerId);
        if (!state) {
          if (e.target !== canvas) return;
          lastActivity = performance.now();
          // The moon is dragged, never led by a hover: it only moves when it
          // is taken hold of. Over it, the cursor offers a grab.
          if (moonMode) {
            var h = toScene(e.clientX, e.clientY);
            canvas.style.cursor = onMoon(h.x, h.y, false) ? 'grab' : '';
            return;
          }
          var hover = toScene(e.clientX, e.clientY);
          user.x = hover.x;
          user.y = hover.y;
          hasMoved = true;
          return;
        }

        lastActivity = performance.now();
        var pos = toScene(e.clientX, e.clientY);
        state.x = pos.x;
        state.y = pos.y;

        if (!state.moved && Math.hypot(e.clientX - state.px, e.clientY - state.py) > 7) {
          state.moved = true;
          state.painting = true;
          state.tapToggle = false;
        }

        if (state === down) {
          user.x = pos.x;
          user.y = pos.y;
          hasMoved = true;
        }

        if (state.painting && !state.moon) {
          if (state.kind === 'light') {
            if (!state.seeded) {
              state.lastLight = null;
              paintLightAt(state.sx, state.sy, state);
              state.seeded = true;
            }
            paintLightAt(pos.x, pos.y, state);
          } else {
            if (!state.seeded) {
              state.lastPaint = null;
              paintAt(state.sx, state.sy, false, state);
              state.seeded = true;
            }
            var from = state.lastPaint || { x: state.sx, y: state.sy };
            var gap = Math.hypot(pos.x - from.x, pos.y - from.y);
            var steps = Math.min(3, Math.max(1, Math.ceil(gap / 0.040)));
            for (var st = 1; st < steps; st++) {
              var f = st / steps;
              paintAt(from.x + (pos.x - from.x) * f, from.y + (pos.y - from.y) * f, true, state);
            }
            paintAt(pos.x, pos.y, false, state);
            if (sky && flowOK) gustAt(pos.x, pos.y, state);
          }
        }
        syncActiveState();
      }, { passive: true });

      function release(e) {
        if (scopeGrab && e.pointerId === scopeGrab.id) { scopeRelease(e); return; }
        var state = active.get(e.pointerId);
        if (!state) return;
        active.delete(e.pointerId);
        if (moonGrab === state) {
          moonGrab = null;
          // After a real hold or drag the moon keeps its clearing for a while,
          // the longer it was held the longer. A quick tap does so through
          // its bloom instead, which a double-tap (a brush flip) cancels.
          var held = time - state.moonSince;
          if (state.moved || held > 0.25) {
            moonBreathLife = MOON_BREATH_LIFE * (1 + 0.5 * Math.min(1, held / 3));
            moonBreath = Math.max(moonBreath, moonPress);
          }
          document.body.classList.remove('holding-moon');
        }

        if (down === state) {
          down = null;
          active.forEach(function (remaining) { if (!down) down = remaining; });
          if (down) {
            user.x = down.x;
            user.y = down.y;
            hasMoved = true;
          }
        }

        if (!state.moved) {
          if (state.tapToggle) {
            if (e.type === 'pointerup' && active.size === 0) toggleBrushMode();
          } else if (state.touch && state.lone && active.size === 0) {
            // Hold the tap's bloom so a second tap can flip the brush instead.
            lastTapAt = performance.now();
            lastTapX = state.px;
            lastTapY = state.py;
            pendingTapKind = state.kind;
            clearTimeout(pendingTapBloom);
            pendingTapBloom = setTimeout(function () {
              pendingTapBloom = 0;
              lastTapAt = 0;
              if (state.moon) bloom(pointer.x, pointer.y, true);
              else if (pendingTapKind === 'light') lightBloom(state.sx, state.sy);
              else bloom(state.sx, state.sy);
            }, TAP_BLOOM_MS);
          } else if (state.moon) {
            bloom(pointer.x, pointer.y, true);
          } else if (state.kind === 'light') {
            lightBloom(state.sx, state.sy);
          } else {
            bloom(state.sx, state.sy);
          }
        }

        if (active.size === 0) {
          painting = false;
          pressTarget = 0;
          document.body.classList.remove('dragging');
        } else {
          syncActiveState();
        }
      }

      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
      window.addEventListener('blur', function () {
        active.clear();
        down = null;
        moonGrab = null;
        scopeGrab = null;
        scopeKeys.x = 0;
        scopeKeys.y = 0;
        document.body.classList.remove('holding-moon');
        painting = false;
        pressTarget = 0;
        document.body.classList.remove('dragging');
        if (pendingTapBloom) { clearTimeout(pendingTapBloom); pendingTapBloom = 0; }
        lastTapAt = 0;
      });

      moodButton.addEventListener('click', function () {
        setMood(moodIndex + 1, false);
        lastActivity = performance.now();
      });

      soundButton.addEventListener('click', function () {
        setSound(!audio.wanted);
        lastActivity = performance.now();
      });

      tuneButton.addEventListener('click', function () {
        setTuneOpen(!document.body.classList.contains('tuning'));
      });
      panelClose.addEventListener('click', function () { setTuneOpen(false); });
      rideButton.addEventListener('click', function () {
        setRide(!ride);
        lastActivity = performance.now();
      });
      skyButton.addEventListener('click', function () {
        setSky(!sky);
        lastActivity = performance.now();
      });
      scopeButton.addEventListener('click', function () {
        unlockAudio();
        setScope(!scope);
        scopeButton.blur();   // so Space takes the picture instead of pressing this again
        lastActivity = performance.now();
      });
      document.getElementById('logOpen').addEventListener('click', function () {
        setLogOpen(!document.body.classList.contains('logging'));
      });
      document.getElementById('logTune').addEventListener('click', function () { setLogOpen(true); });
      document.getElementById('logClose').addEventListener('click', function () { setLogOpen(false); });
      [brushInput, trailInput, particlesInput, velocityInput, veilInput, curveInput, paceInput, ink0Input, ink1Input, ink2Input].forEach(function (input) {
        input.addEventListener('input', tuneChanged);
      });
      stillButton.addEventListener('click', stillVeil);
      writeButton.addEventListener('click', useWritePreset);
      resetButton.addEventListener('click', resetTune);

      document.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        var tag = e.target && e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.key === 'm' || e.key === 'M') {
          setMood(moodIndex + 1, false);
          e.preventDefault();
        } else if (e.key === 't' || e.key === 'T') {
          setTuneOpen(!document.body.classList.contains('tuning'));
          e.preventDefault();
        } else if (e.key === 'Escape') {
          var anyOpen = document.body.classList.contains('tuning') || document.body.classList.contains('labbing') ||
            document.body.classList.contains('logging');
          setTuneOpen(false);
          setLabOpen(false);
          setLogOpen(false);
          if (!anyOpen && scope) setScope(false);
        } else if (e.key === 'z' || e.key === 'Z') {
          setScope(!scope);
          e.preventDefault();
        } else if (e.key === 'g' || e.key === 'G') {
          setLogOpen(!document.body.classList.contains('logging'));
          e.preventDefault();
        } else if (scope && e.key === ' ') {
          if (!e.repeat) shutter();
          e.preventDefault();
        } else if (scope && SCOPE_ARROWS[e.key]) {
          var arrow = SCOPE_ARROWS[e.key];
          if (arrow[0]) scopeKeys.x = arrow[0];
          if (arrow[1]) scopeKeys.y = arrow[1];
          e.preventDefault();
        } else if (e.key === 'l' || e.key === 'L') {
          setLabOpen(!document.body.classList.contains('labbing'));
          e.preventDefault();
        } else if (e.key === 'c' || e.key === 'C') {
          stillVeil();
          e.preventDefault();
        } else if (e.key === 's' || e.key === 'S') {
          setSound(!audio.wanted);
          e.preventDefault();
        } else if (e.key === 'r' || e.key === 'R') {
          setRide(!ride);
          e.preventDefault();
        } else if (e.key === 'p' || e.key === 'P') {
          setPines(!pinesFine);
          e.preventDefault();
        } else if (e.key === 'k' || e.key === 'K') {
          setSky(!sky);
          e.preventDefault();
        } else if (e.key === 'b' || e.key === 'B') {
          setCursor(!moonMode);
          e.preventDefault();
        } else if (e.key === 'f' || e.key === 'F') {
          // Send a flyer over now (only under the sky): mostly for testing.
          if (sky) launchFlyers(e.shiftKey ? 'owl' : 'bat');
          e.preventDefault();
        } else if (e.key === 'j' || e.key === 'J') {
          // Bring a streetlamp along the ride now: mostly for testing.
          if (ride && sky) spawnLamp();
          e.preventDefault();
        }
      });

      document.addEventListener('keyup', function (e) {
        var arrow = SCOPE_ARROWS[e.key];
        if (!arrow) return;
        if (arrow[0] && scopeKeys.x === arrow[0]) scopeKeys.x = 0;
        if (arrow[1] && scopeKeys.y === arrow[1]) scopeKeys.y = 0;
      });

      window.addEventListener('resize', resize);

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          running = false;
          cancelAnimationFrame(raf);
          audio.suspend();
        } else if (!running) {
          running = true;
          last = 0;
          audio.resume();
          raf = requestAnimationFrame(frame);
        }
      });

      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
        hint.innerHTML = 'drag: part &middot; double-tap: switch';
        var panelHint = document.querySelector('.panel-hint');
        if (panelHint) panelHint.innerHTML = 'drag &middot; part &nbsp; double-tap &middot; switch';
      }


      // Sound is on by default; it starts with the first touch or click
      // (browsers only allow audio after a gesture). Turning it off sticks.
      var savedSound = true;
      try { savedSound = localStorage.getItem('opal.void.sound') !== 'off'; } catch (e) { /* private */ }
      if (!audio.supported) {
        soundButton.disabled = true;
        soundButton.title = 'sound unavailable';
      } else if (savedSound) {
        audio.wanted = true;
      }
      reflectSound();

      // The ride is on by default; turning it off sticks.
      var savedRide = true;
      try { savedRide = localStorage.getItem('opal.void.ride') !== 'off'; } catch (e) { /* private */ }
      setRide(savedRide, true);
      rideAmount = ride ? 1 : 0;
      var savedPines = 'fine';
      try { savedPines = localStorage.getItem('opal.void.pines') || 'fine'; } catch (e) { /* private */ }
      setPines(savedPines !== 'classic', true);
      pinesButton.addEventListener('click', function () { setPines(!pinesFine); });

      // The moon is the default cursor; the pearl is one tap of `cursor` away.
      var savedCursor = 'moon';
      try { savedCursor = localStorage.getItem('opal.void.cursor') || 'moon'; } catch (e) { /* private */ }
      setCursor(savedCursor !== 'pearl', true);
      moonAmount = moonMode ? 1 : 0;
      cursorButton.addEventListener('click', function () { setCursor(!moonMode); });

      // The sky is the default scene; the void is one tap of `sky` away.
      var savedSky = true;
      try { savedSky = localStorage.getItem('opal.void.sky') !== 'off'; } catch (e) { /* private */ }
      setSky(savedSky, true);
      skyAmount = sky ? 1 : 0;

      function start() {
        setMoodFromStore();
        syncTuneControls();
        writeInk();
        reflectBrushMode();
        initMaskTexture();
        resize();
        if (moonMode) {
          var rest = moonRest();
          pointer.x = rest.x;
          pointer.y = rest.y;
        }
        for (var qi = 0; qi < clamp(Math.round(QUARRY_COUNT), 0, 6); qi++) spawnQuarry(qi, true);
        loadLog();
        renderLog();
        ensureProbeTarget();
        // One throwaway probe at load: the first picture after launch hitched
        // (~54 ms on the phone, later ones ~25), so pay that setup now.
        shotPending = { warm: true };
        raf = requestAnimationFrame(frame);
        hintTimer = setTimeout(function () { hint.classList.add('gone'); }, 11000);
      }

      start();

      // ---- lab: begin ----
      // The lab (L, or ?lab in the URL): a drawer that lists VoidDrag's
      // parameters, lets you change them while it runs, and shows where each
      // one lives and every line that reads it. Nothing here runs until the
      // drawer is first opened, apart from labTick's early return. Constants
      // changed here last until reload; tune values save as they always do.
      // The source scanner skips the lines between the begin and end markers,
      // so the lab never lists itself.
      var LAB_GROUPS = [
        { id: 'tune', title: 'tune panel', note: 'The settings object: loaded from localStorage (opal.tune), changed by the tune panel (T). The lab moves the panel\u2019s own sliders, so changes save exactly as they would there.' },
        { id: 'wind', title: 'brush & wind', note: 'Under the sky a dark stroke is wind. gustAt() turns the finger\u2019s speed into gusts; stepFlow() hands them to a three-pass GPU wind sim (velocity \u2192 cloud map \u2192 sky view) that tears and heals the cloud.' },
        { id: 'streams', title: 'stroke streams', note: 'A stroke under the sky leaves a channel of moving air along its path. streamPoint() samples the path; updateParticles() sucks dust toward it and carries it along. Widths are in brush radii (0.075 \u00d7 brush).' },
        { id: 'dust', title: 'dust physics', note: 'updateParticles() runs every mote every frame: each force adds to the velocity, then drag and the speed cap pull it back. Units are scene units (screen height = 2) and seconds.' },
        { id: 'motes', title: 'night motes', note: 'How the dust looks and drifts under the night sky (sky on, K). The brightness values are only used while the sky is up.' },
        { id: 'moon', title: 'the moon', note: 'The moon cursor (cursor \u00b7 moon, B). updateMoon() moves it only while a finger that landed on it holds it; moonGusts() is the air it moves.' },
        { id: 'events', title: 'ripples & flyers', note: 'Ripple rings from taps and the idle pulse, and the rare bat or owl (F sends one now, Shift+F an owl).' },
        { id: 'camera', title: 'the camera', note: 'The stargazer’s camera (Z). Through the lens a drag aims and a tap takes the picture. A few special stars (the quarry) are hidden in the sky; one inside the reticle’s ring under clear enough sky goes in the logbook (G).' },
        { id: 'timing', title: 'sky & touch timing', note: 'The sky\u2019s steady drift and the touch tap timings.' },
        { id: 'struct', title: 'structural (read-only)', note: 'These size arrays, textures or shader uniform arrays when the page starts, or are read once at startup. Changing one means editing the file and reloading, and several must match a size written into the shader.' },
        { id: 'shader', title: 'shader constants (read-only)', note: 'GLSL constants compiled into the fragment shader. Changing one means editing the shader text and reloading. Watch out: a backtick in a GLSL comment ends the JS template string and blanks the page.' }
      ];

      // n: the name (and the variable it reads/writes); find: what to search the
      // source for; g: group; min/max/step: the lab's range (tune ones come from
      // the panel's own slider); ro: read-only; snap: keep to whole steps.
      var LAB_PARAMS = [
        // --- tune panel ---
        { n: 'brush', g: 'tune', tune: true, find: ['settings.brush'],
          what: 'Brush width: one multiplier on the radius of everything a stroke or tap touches.',
          small: 'Gust splats are 0.075 \u00d7 brush wide (gustAt), marks and light blooms scale by it (addMark, addLight), dust is stirred within 0.20 + 0.10 \u00d7 brush and orbits light at 0.07 + 0.05 \u00d7 brush (updateParticles).',
          large: 'Stream widths are measured in brush radii, so a wide brush also cuts wide channels that pull dust in from further away. Over a session wide strokes clear most of the cloud; narrow ones write lines.' },
        { n: 'trail', g: 'tune', tune: true, find: ['settings.trail', 'erodeForTrail', 'uErode'],
          what: 'How long a mark lasts. Under the sky it sets how fast parted cloud heals; in the void it fades the darkness mask and erodes its edge.',
          small: 'Each mark\u2019s life is multiplied by trail (addMark). In the void the shader\u2019s edge threshold is uErode = 0.38 \u00d7 (1 \u2212 (trail/8)^0.55), so low trails shrink a stroke into itself with a wobbled edge.',
          large: 'Under the sky the heal time constant is (1.5 + 3.2 \u00d7 trail) \u00d7 healScale() seconds, about 7.9 s at 2.0 (stepFlow, healSky). In the void the mask fades with max(1.5, 16 \u00d7 trail) s (fadeMask). At 7.95 and up nothing fades or erodes: the field keeps everything until still (C).' },
        { n: 'particles', g: 'tune', tune: true, snap: true, find: ['settings.particles', 'activeParticles'],
          what: 'How many dust motes are simulated and drawn.',
          small: 'Sets activeParticles. The pool always holds MAX_PARTICLES; updateParticles and uploadParticles just loop over the first N, so motes past N stop where they are and are not drawn.',
          large: 'The density of the dust that makes the wind visible. Cost grows linearly: every mote tests every puff, stream, ripple, light and stirrer each frame.' },
        { n: 'velocity', g: 'tune', tune: true, find: ['settings.velocity', 'vscale'],
          what: 'Gain on everything that moves the dust.',
          small: 'Becomes vscale in updateParticles and multiplies every acceleration there (drift, puffs, streams, ripples, light, stirring) and the speeds dust is carried at. At 0 the stirring loop is skipped entirely.',
          large: 'Low values make the dust heavy and calm; high ones make it race along strokes. DUST_MAX_SPEED still caps it, so past a point you see more dust at the cap rather than faster dust.' },
        { n: 'veil', g: 'tune', tune: true, find: ['settings.veil', 'uVeil'],
          what: 'Brightness of the living veil: the glowing surface of the void.',
          small: 'Sent every frame as the uVeil uniform. In the shader it multiplies the veil\u2019s shell glow (value = shell \u00d7 fibrous \u00d7 breath \u00d7 uVeil) and its rim light.',
          large: 'The light level of the whole void: below 1 the veil sinks into the dark, above 1 it glows, and the overlay colour brightens by 0.75 + 0.5 \u00d7 uVeil.' },
        { n: 'pace', g: 'tune', tune: true, find: ['settings.pace'],
          what: 'Speed of the ride: the pine tops marching down both sides.',
          small: 'travel grows by dt \u00d7 0.16 \u00d7 pace (frame) and the shader draws the canopy at uTravel. The dust also falls behind at 0.12 \u00d7 pace (updateParticles).',
          large: 'Only shows with the ride on (R). Faster pace streams the trees by and lets the dust drift down the view.' },
        { n: 'curve', g: 'tune', tune: true, find: ['settings.curve', 'uInkCurve'],
          what: 'Bias of the three-stop ink ramp toward its low or high stop.',
          small: 'In the shader the ramp position t (0 = low ink, 1 = high ink) becomes pow(t, 2^(curve \u00d7 1.8)): \u22121 is a power of 0.29 (lifts toward high), +1 a power of 3.5 (sinks toward low).',

        { n: 'ink0', g: 'tune', tune: true, color: true, find: ['settings.ink0', 'uInk'],
          what: 'The low ink stop: colour of the dim parts of the veil, light and dust.',
          small: 'writeInk() converts it to linear RGB (hexToRgb, linear) into inkLinear and sends it as uInk[0].',

        { n: 'ink1', g: 'tune', tune: true, color: true, find: ['settings.ink1', 'uInk'],
          what: 'The mid ink stop.', small: 'Sent as uInk[1] by writeInk().', large: 'The colour most of the veil sits at.' },
        { n: 'ink2', g: 'tune', tune: true, color: true, find: ['settings.ink2', 'uInk'],
          what: 'The high ink stop: the brightest highlights.', small: 'Sent as uInk[2] by writeInk().', large: 'Recolours highlights, light blooms and bright dust.' },

        // --- brush & wind ---
        { n: 'GUST_TOP', g: 'wind', min: 0.1, max: 4, step: 0.05,
          what: 'The fastest air a drag can push into the wind field (scene units/s).',
          small: 'In gustAt the push is GUST_TOP \u00d7 (1 \u2212 e^(\u2212speed / GUST_KNEE)): it rises with drag speed and levels off at this ceiling.',
          large: 'How violently a flick tears the cloud and how far it throws the torn edges. High values rip long streaks; low ones only nudge.' },
        { n: 'GUST_KNEE', g: 'wind', min: 0.1, max: 5, step: 0.05,
          what: 'The drag speed at which the push reaches about 63% of GUST_TOP.',
          small: 'It is the divisor in e^(\u2212speed / GUST_KNEE). A low knee means even a slow drag pushes at nearly full strength; a high one means you have to flick.',
          large: 'The feel of the brush: touchy (low) or needing effort (high).' },
        { n: 'GUST_GRIP_FAST', g: 'wind', min: 0, max: 1, step: 0.01,

          small: 'grip = 0.55 \u00d7 brushScale() \u00d7 gusty / (1 + GUST_GRIP_FAST \u00d7 speed). At 0 a flick grips as hard as a slow drag.',

        { n: 'GUST_BREATH', g: 'wind', min: 0, max: 1, step: 0.01,

          large: '0 gives even, blade-like strokes; high values give pulsing, uneven gusts.' },
        { n: 'BRUSH_UNDER_MOON', g: 'wind', min: 0, max: 1.5, step: 0.05,
          what: 'Cloud-brush strength while the moon is the cursor (1 = as strong as with the pearl).',
          small: 'brushScale() fades from 1 to this as the moon fades in. gustAt multiplies the grip by it and the push by 0.4 + 0.6 \u00d7 it; addMark and bloom scale strengths by it.',
          large: 'With the moon cursor strokes are deliberately gentler. Set it to 1 to brush as hard as in pearl mode (B).' },
        { n: 'HEAL_UNDER_MOON', g: 'wind', min: 1, max: 8, step: 0.1,
          what: 'How many times longer parted cloud takes to close while the moon is the cursor.',
          small: 'healScale() = 1 + (HEAL_UNDER_MOON \u2212 1) \u00d7 moonAmount multiplies the heal time constant: uRelax in stepFlow and the mask fade in healSky.',
          large: 'High values keep every opening for a long time with the moon; 1 heals as quickly as with the pearl.' },
        { n: 'PUFF_LIFE', g: 'wind', min: 0.1, max: 8, step: 0.1,
          what: 'Seconds a puff (the air a gust leaves moving) is still felt by the dust.',
          small: 'updatePuffs weights a puff by e^(\u2212age / 0.6) and widens it by 80% a second, then removes it after PUFF_LIFE.',
          large: 'A lesson in hidden limits: the weight is already ~3% at 2 s, so raising this changes almost nothing. Lowering it below ~1 s cuts the dust\u2019s after-swirl short.' },
        { n: 'FLOW_LONG', g: 'wind', min: 64, max: 768, step: 32, snap: true, noSweep: true,
          what: 'Resolution of the GPU wind grid along the long side of the screen.',
          small: 'flowDims() turns it into FLOW_W \u00d7 FLOW_H. stepFlow notices the change and calls flow.rebuild(), which recreates the textures and clears the wind field.',
          large: 'Coarse grids tear in soft, blocky steps and are cheap; fine grids tear crisply and cost GPU time (the cell count grows with the square). No sweep: each change rebuilds the textures.' },

        { n: 'STREAM_LIFE', g: 'streams', min: 0.3, max: 15, step: 0.1,
          what: 'Seconds a stretch of a stroke\u2019s path keeps channelling dust.',
          small: 'updateStreams drops samples older than this. updateParticles fades their pull over the last 60%: 1 \u2212 smoothstep(0.4 \u00d7 life, life, age).',

        { n: 'STREAM_CORE', g: 'streams', min: 0.2, max: 5, step: 0.1,

        { n: 'STREAM_REACH', g: 'streams', min: 0.5, max: 12, step: 0.1,

        { n: 'STREAM_FLOW_MIN', g: 'streams', min: 0, max: 2, step: 0.02,

          small: 'flow = min(STREAM_FLOW_MAX, STREAM_FLOW_MIN + drawSpeed \u00d7 STREAM_CARRY) \u00d7 velocity.',

        { n: 'STIR_MAX', g: 'dust', min: 0.1, max: 6, step: 0.1,
