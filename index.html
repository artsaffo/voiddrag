<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07070a">
  <meta name="description" content="VoidDrag — a soft void where light remembers your touch.">
  <title>VoidDrag — a quiet place for light</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='g' cx='35%25' cy='28%25'><stop offset='0' stop-color='%23ece4d6'/><stop offset='.55' stop-color='%238e8981'/><stop offset='1' stop-color='%23151517'/></radialGradient></defs><circle cx='32' cy='32' r='27' fill='url(%23g)'/></svg>">
  <style>
    :root {
      --ink: #ece5d9;
      --ink-soft: rgba(236, 229, 217, 0.7);
      --ink-dim: rgba(236, 229, 217, 0.46);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      background: #07070a;
    }

    body {
      overflow: hidden;
      -webkit-touch-callout: none;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      -webkit-user-select: none;
      user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    :focus-visible {
      outline: 1px solid rgba(236, 229, 217, 0.85);
      outline-offset: 3px;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      background: #07070a;
      cursor: crosshair;
      opacity: 0;
      touch-action: none;
      transition: opacity 1.8s var(--ease);
    }

    body.ready #stage { opacity: 1; }
    body.dragging #stage { cursor: grabbing; }

    .mark {
      position: fixed;
      z-index: 3;
      top: max(19px, env(safe-area-inset-top));
      left: max(21px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .mark-main {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--serif);
      font-size: 23px;
      line-height: 1;
      letter-spacing: 0.13em;
      color: var(--ink);
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.42);
    }

    .mark-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f0e8da, #8e8981 55%, #17171a);
      box-shadow: 0 0 14px rgba(226, 216, 198, 0.4);
    }

    .mark small {
      display: block;
      margin: 9px 0 0 17px;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(236, 229, 217, 0.42);
      text-shadow: 0 1px 14px rgba(0, 0, 0, 0.45);
    }

    .top-actions {
      position: fixed;
      z-index: 4;
      top: max(16px, env(safe-area-inset-top));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mood {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 8px;
      border: 1px solid rgba(236, 229, 217, 0.18);
      border-radius: 999px;
      background: rgba(8, 8, 10, 0.36);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--ink-soft);
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
    }

    .mood:hover {
      background: rgba(236, 229, 217, 0.09);
      color: var(--ink);
    }

    .sound {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 11px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      background: rgba(8, 8, 10, 0.34);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(236, 229, 217, 0.52);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: lowercase;
      transition: background 0.3s var(--ease), color 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .sound:hover {
      background: rgba(236, 229, 217, 0.09);
      color: var(--ink);
      border-color: rgba(236, 229, 217, 0.3);
    }

    .sound-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(236, 229, 217, 0.25);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      transition: background 0.5s var(--ease), box-shadow 0.5s var(--ease);
    }

    .sound[aria-pressed="true"] .sound-dot {
      background: var(--ink);
      box-shadow: 0 0 9px rgba(236, 229, 217, 0.55);
    }

    .sound:disabled { opacity: 0.35; cursor: default; }

    .mood-dot {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22), 0 1px 5px rgba(0, 0, 0, 0.25);
      transition: background 0.9s var(--ease), transform 0.3s var(--ease);
    }

    .mood:hover .mood-dot { transform: scale(1.08); }

    .mood-name {
      min-width: 25px;
      font-size: 9px;
      letter-spacing: 0.14em;
      color: rgba(236, 229, 217, 0.58);
      text-align: left;
      text-transform: lowercase;
    }

    .hint {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      width: min(92vw, 560px);
      margin: 0;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.13em;
      line-height: 1.7;
      text-align: center;
      color: rgba(236, 229, 217, 0.62);
      text-shadow: 0 1px 18px rgba(0, 0, 0, 0.72);
      pointer-events: none;
      transition: opacity 1.4s var(--ease);
    }

    .hint.gone { opacity: 0 !important; }

    body.touch .hint { bottom: max(84px, env(safe-area-inset-bottom)); }
    body.tuning .hint { opacity: 0; }

    .mode {
      position: fixed;
      z-index: 3;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: none;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      background: rgba(8, 8, 10, 0.34);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(236, 229, 217, 0.55);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      pointer-events: none;
      transition: background 0.4s var(--ease), color 0.4s var(--ease), border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }

    body.touch .mode { display: inline-flex; }

    .mode-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(236, 229, 217, 0.3);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      transition: background 0.4s var(--ease), box-shadow 0.4s var(--ease), transform 0.4s var(--ease);
    }

    body.light-mode .mode {
      color: var(--ink);
      border-color: rgba(255, 226, 184, 0.4);
      background: rgba(236, 229, 217, 0.09);
      box-shadow: 0 0 24px rgba(255, 214, 158, 0.12);
    }

    body.light-mode .mode-dot {
      background: #ffe6bd;
      box-shadow: 0 0 11px rgba(255, 220, 170, 0.8);
      transform: scale(1.15);
    }

    .bottom-actions {
      position: fixed;
      z-index: 4;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ride-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(236, 229, 217, 0.25);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      transition: background 0.5s var(--ease), box-shadow 0.5s var(--ease);
    }

    .ride[aria-pressed="true"] {
      color: var(--ink);
      border-color: rgba(150, 190, 150, 0.38);
    }

    .ride[aria-pressed="true"] .ride-dot {
      background: #86b08a;
      box-shadow: 0 0 10px rgba(120, 180, 128, 0.6);
    }

    .sky[aria-pressed="true"] {
      border-color: rgba(170, 190, 230, 0.38);
    }

    .sky[aria-pressed="true"] .ride-dot {
      background: #c9d6f2;
      box-shadow: 0 0 10px rgba(180, 200, 245, 0.65);
    }

    .tune, .ride {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      background: rgba(8, 8, 10, 0.34);
      color: rgba(236, 229, 217, 0.55);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.3s var(--ease), color 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .tune:hover, body.tuning .tune, .ride:hover {
      background: rgba(236, 229, 217, 0.09);
      color: var(--ink);
      border-color: rgba(236, 229, 217, 0.3);
    }

    .panel {
      position: fixed;
      z-index: 5;
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(max(18px, env(safe-area-inset-bottom)) + 42px);
      width: min(296px, calc(100vw - 36px));
      padding: 12px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 14px;
      background: rgba(8, 8, 10, 0.82);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--ink-soft);
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px);
      transition: opacity 0.22s var(--ease), transform 0.22s var(--ease), visibility 0.22s;
    }

    body.tuning .panel {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .panel { max-height: calc(100vh - 90px); overflow-y: auto; }

    .ink-row {
      display: grid;
      grid-template-columns: 42px repeat(3, 28px) minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      margin: 10px 2px;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--ink-dim);
    }

    .ink-row input[type="color"] {
      width: 28px;
      height: 22px;
      padding: 0;
      border: 1px solid rgba(236, 229, 217, 0.2);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .ink-preview {
      height: 10px;
      margin-left: 2px;
      border-radius: 999px;
      border: 1px solid rgba(236, 229, 217, 0.12);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 6px;
      color: var(--ink);
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .panel-close {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      color: var(--ink-dim);
      font-size: 16px;
      line-height: 1;
    }

    .panel-close:hover { background: rgba(236, 229, 217, 0.08); color: var(--ink); }

    .control {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 36px;
      align-items: center;
      gap: 8px;
      margin: 9px 2px;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--ink-dim);
    }

    .control input[type="range"] {
      width: 100%;
      height: 18px;
      margin: 0;
      accent-color: rgba(236, 229, 217, 0.72);
      cursor: pointer;
    }

    .control output {
      color: var(--ink-soft);
      font-family: var(--mono, ui-monospace, monospace);
      font-size: 10px;
      text-align: right;
    }

    .panel-actions {
      display: flex;
      gap: 7px;
      margin: 12px 2px 2px;
    }

    .panel-actions button {
      flex: 1;
      min-height: 28px;
      border: 1px solid rgba(236, 229, 217, 0.16);
      border-radius: 999px;
      color: var(--ink-soft);
      font-size: 10px;
      letter-spacing: 0.08em;
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
    }

    .panel-actions button:hover { background: rgba(236, 229, 217, 0.08); color: var(--ink); }

    .panel-hint {
      margin: 8px 2px 0;
      color: rgba(236, 229, 217, 0.56);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .panel-note {
      margin: 9px 2px 0;
      color: rgba(236, 229, 217, 0.32);
      font-size: 9px;
      letter-spacing: 0.05em;
    }

    @media (max-width: 520px) {
      .bottom-actions { right: max(13px, env(safe-area-inset-right)); bottom: max(15px, env(safe-area-inset-bottom)); gap: 6px; }
      .panel {
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        width: auto;
        bottom: calc(max(15px, env(safe-area-inset-bottom)) + 40px);
      }
    }

    .fallback {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: #08080b;
      text-align: center;
      font-family: var(--serif);
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1.25;
    }

    .fallback.is-open { display: grid; }

    .fallback p { max-width: 520px; margin: 0; }

    @media (max-width: 520px) {
      .mark-main { font-size: 21px; }
      .mark small { margin-top: 7px; font-size: 7px; letter-spacing: 0.2em; }
      .top-actions { top: max(13px, env(safe-area-inset-top)); right: max(13px, env(safe-area-inset-right)); gap: 6px; }
      .mood { padding: 6px 9px 6px 6px; gap: 7px; }
      .sound { padding: 6px 8px; gap: 5px; font-size: 8px; }
      .mood-dot { width: 17px; height: 17px; }
      .mood-name { font-size: 8px; }
      .hint { bottom: max(20px, env(safe-area-inset-bottom)); font-size: 9px; letter-spacing: 0.1em; }
    }

    @media (pointer: coarse) {
      .sound, .mood { min-height: 36px; }
      .mode {
        display: inline-flex;
        bottom: max(30px, env(safe-area-inset-bottom));
        min-height: 36px;
        padding: 9px 13px;
      }
      .bottom-actions { bottom: max(30px, env(safe-area-inset-bottom)); }
      .tune, .ride {
        min-height: 36px;
        padding: 9px 13px;
      }
      .panel {
        bottom: calc(max(30px, env(safe-area-inset-bottom)) + 48px);
      }
      .hint { bottom: max(84px, env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <div class="mark" aria-hidden="true">
    <div class="mark-main"><span class="mark-dot"></span>VoidDrag</div>
    <small>a quiet place for light</small>
  </div>

  <div class="top-actions">
    <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="sound: off" title="sound off (S)">
      <span class="sound-dot"></span><span>sound</span>
    </button>
    <button class="mood" id="mood" type="button" aria-label="change the mood" title="change the mood">
      <span class="mood-dot" id="moodDot"></span>
      <span class="mood-name" id="moodName">ash</span>
    </button>
  </div>

  <p class="hint" id="hint">left: part &middot; right: illuminate</p>

  <div class="mode" id="mode" role="status" aria-live="polite" aria-atomic="true" aria-label="brush: dark; double-tap to switch"><span class="mode-dot"></span><span id="modeName">brush &middot; dark</span></div>

  <div class="bottom-actions">
    <button class="ride sky" id="sky" type="button" aria-pressed="true" aria-label="the night sky: on" title="the night sky (K)">
      <span class="ride-dot"></span><span>sky</span>
    </button>
    <button class="ride" id="ride" type="button" aria-pressed="false" aria-label="ride beneath the pines: off" title="ride beneath the pines (R)">
      <span class="ride-dot"></span><span>ride</span>
    </button>
    <button class="tune" id="tune" type="button" aria-label="tune the field" aria-expanded="false" title="tune the field">tune</button>
  </div>

  <section class="panel" id="panel" aria-hidden="true" aria-label="tune the field">
    <div class="panel-head"><span>tune</span><button class="panel-close" id="panelClose" type="button" aria-label="close tuning">&times;</button></div>
    <label class="control" title="How wide the brush is."><span>brush</span><input id="brush" type="range" min="0.4" max="1.4" step="0.05" value="0.80"><output id="brushOut">0.80</output></label>
    <label class="control" title="How long a mark persists. Raise it to write a whole word."><span>trail</span><input id="trail" type="range" min="0.3" max="8" step="0.1" value="2.0"><output id="trailOut">2.0</output></label>
    <label class="control" title="How many dust motes are active."><span>particles</span><input id="particles" type="range" min="150" max="1200" step="50" value="600"><output id="particlesOut">600</output></label>
    <label class="control" title="How strongly strokes move the dust."><span>velocity</span><input id="velocity" type="range" min="0" max="2.5" step="0.05" value="1.00"><output id="velocityOut">1.00</output></label>
    <label class="control" title="Brightness of the living veil."><span>veil</span><input id="veil" type="range" min="0.3" max="1.6" step="0.05" value="1.00"><output id="veilOut">1.00</output></label>
    <label class="control" title="How fast the pines pass on the ride."><span>pace</span><input id="pace" type="range" min="0.2" max="2.5" step="0.05" value="1.00"><output id="paceOut">1.00</output></label>
    <div class="ink-row" title="Three color stops for the veil, illumination and particles."><span>ink</span><input id="ink0" type="color" value="#4a4848" aria-label="ink low" title="low ink"><input id="ink1" type="color" value="#9b958b" aria-label="ink mid" title="mid ink"><input id="ink2" type="color" value="#e6dccd" aria-label="ink high" title="high ink"><span class="ink-preview" id="inkPreview"></span></div>
    <label class="control" title="Bias the ink ramp toward the low or high stops."><span>curve</span><input id="curve" type="range" min="-1" max="1" step="0.05" value="0.00"><output id="curveOut">0.00</output></label>
    <div class="panel-actions"><button id="pines" type="button" aria-pressed="true" title="pine style: fine needles or the classic silhouette (P)">pines &middot; fine</button></div>
    <div class="panel-actions"><button id="still"type="button" title="clear the field">still</button><button id="write" type="button" title="smaller brush, longer trail">write</button><button id="reset" type="button">reset</button></div>
    <p class="panel-hint">left &middot; part &nbsp; right &middot; light</p>
    <p class="panel-note">T tune &middot; C still &middot; M mood &middot; S sound &middot; R ride &middot; P pines &middot; K sky</p>
  </section>

  <div class="fallback" id="fallback" role="alert">
    <p>VoidDrag needs WebGL2.<br>Try a recent browser.</p>
  </div>

  <script>
    (function () {
      'use strict';

      var MAX_MARKS = 512;
      var MAX_PARTICLES = 1200;
      var activeParticles = 600;
      var MAX_SHOCKS = 8;
      var particleData = new Float32Array(MAX_PARTICLES * 3 * 4);
      var particleBuffer = null;
      var particleVao = null;
      var particleProgram = null;
      var particleAttribs = {};
      var particleUniforms = {};
      var particles = [];
      var shockData = new Float32Array(MAX_SHOCKS * 4);
      var shocks = [];
      var lastShockAt = 0;
      var canvas = document.getElementById('stage');
      var hint = document.getElementById('hint');
      var moodButton = document.getElementById('mood');
      var moodDot = document.getElementById('moodDot');
      var moodName = document.getElementById('moodName');
      var fallback = document.getElementById('fallback');
      var soundButton = document.getElementById('sound');
      var modeChip = document.getElementById('mode');
      var modeName = document.getElementById('modeName');
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var audio = new VoidAudio();
      var tuneButton = document.getElementById('tune');
      var panel = document.getElementById('panel');
      var panelClose = document.getElementById('panelClose');
      var brushInput = document.getElementById('brush');
      var trailInput = document.getElementById('trail');
      var particlesInput = document.getElementById('particles');
      var velocityInput = document.getElementById('velocity');
      var veilInput = document.getElementById('veil');
      var ink0Input = document.getElementById('ink0');
      var ink1Input = document.getElementById('ink1');
      var ink2Input = document.getElementById('ink2');
      var curveInput = document.getElementById('curve');
      var paceInput = document.getElementById('pace');
      var paceOut = document.getElementById('paceOut');
      var rideButton = document.getElementById('ride');
      var ride = false;
      var rideAmount = 0;
      var travel = Math.random() * 40;
      // Pine style: 'fine' (branches, needles, wind, falling needles) or the
      // original 'classic' silhouettes, kept as an option.
      var pinesButton = document.getElementById('pines');
      var pinesFine = true;
      var skyButton = document.getElementById('sky');
      var sky = true;
      var skyAmount = 1;
      // Wind offset in scene units. Clouds and the parted mask both live in
      // this shifted space, so a parted hole drifts with the cloud around it.
      var drift = 0;
      var SKY_WIND = 0.026;
      var skyHealAcc = 0;
      var inkPreview = document.getElementById('inkPreview');
      var brushOut = document.getElementById('brushOut');

#define TAU 6.28318530718

mat2 rot(float a) {

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

vec2 hash22(vec2 p) {
  float n = hash21(p);
  return vec2(n, hash21(p + n + 17.17));
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p, int oct) {
  float sum = 0.0;
  float amp = 0.5;
  float norm = 0.0;
  for (int i = 0; i < 6; i++) {
    if (i >= oct) break;
    sum += amp * vnoise(p);
    norm += amp;
    p = rot(0.61) * p * 2.03 + vec2(7.3, -3.1);
    amp *= 0.5;
  }
  return sum / max(norm, 0.0001);
}

vec3 pal(float t) {

  float i = floor(t);
  float f = fract(t);
  f = f * f * (3.0 - 2.0 * f);
  int a = int(i);
  int b = min(a + 1, 4);
  return mix(uPal[a], uPal[b], f);
}

// Smooth cubic B-spline lookup built from four bilinear taps. Plain bilinear
// shows the wind grid as kinks wherever the cloud tears sharply.
vec4 texCubic(sampler2D t, vec2 uv) {
  vec2 ts = vec2(textureSize(t, 0));
  vec2 p = uv * ts - 0.5;
  vec2 i = floor(p);
  vec2 f = p - i;
  vec2 f2 = f * f;
  vec2 f3 = f2 * f;
  vec2 w0 = (-f3 + 3.0 * f2 - 3.0 * f + 1.0) / 6.0;
  vec2 w1 = (3.0 * f3 - 6.0 * f2 + 4.0) / 6.0;
  vec2 w2 = (-3.0 * f3 + 3.0 * f2 + 3.0 * f + 1.0) / 6.0;
  vec2 w3 = f3 / 6.0;
  vec2 g0 = w0 + w1;
  vec2 g1 = w2 + w3;
  vec2 h0 = (i - 0.5 + w1 / g0) / ts;
  vec2 h1 = (i + 1.5 + w3 / g1) / ts;
  return g0.y * (g0.x * texture(t, h0) + g1.x * texture(t, vec2(h1.x, h0.y)))
       + g1.y * (g0.x * texture(t, vec2(h0.x, h1.y)) + g1.x * texture(t, h1));
}

vec2 aspect(vec2 frag) {
  return (frag * 2.0 - uRes) / min(uRes.x, uRes.y);
}

vec3 finish(vec3 c, vec2 uv) {
  c = max(c, 0.0);
  c = 1.0 - exp(-c * 1.22);
  c = pow(c, vec3(0.45454545));

  c *= mix(1.0, vig, 0.50);
  float g = hash21(gl_FragCoord.xy * 1.17 + fract(uTime) * 371.0) - 0.5;
  c += g * 0.034;
  return clamp(c, 0.0, 1.0);
}

vec3 voidColor(vec2 p, float t) {
  float cloud = fbm(p * 1.05 + vec2(t * 0.006, -t * 0.004), 4);
  vec3 c = uPal[0] * (0.95 + 0.32 * cloud);
  c += uPal[1] * (0.11 + 0.09 * cloud);
  c += vec3(0.0031, 0.0029, 0.0033);
  c *= 0.84 + 0.26 * smoothstep(-1.0, 1.0, p.y);
  c += uPal[1] * 0.035 * exp(-length(p - vec2(-0.35, 0.35)) * 1.2);
  return c;
}

vec3 starField(vec2 p, float t) {
  vec3 c = vec3(0.0);

  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float scale = 18.0 + fi * 21.0;
    vec2 sp = p * scale + vec2(fi * 17.0, fi * 29.0);
    vec2 id = floor(sp);
    vec2 f = fract(sp) - 0.5;
    float h = hash21(id + fi * 5.0);
    float threshold = 0.970 + fi * 0.006;
    if (h < threshold) continue;

    vec2 o = (hash22(id + 3.0) - 0.5) * 0.70;
    float tw = 0.55 + 0.45 * sin(t * (0.8 + fi * 0.6) + h * 67.0);
    float d = length(f - o);
    float dotPart = exp(-d * d * 1400.0);
    float halo = exp(-d * d * 42.0);
    c += uPal[4] * dotPart * tw * (0.12 + 0.08 * fi);
    c += uPal[3] * halo * 0.0100 * tw;
  }

  vec2 bp = p * 2.2 + vec2(1.3, -0.6);
  vec2 bid = floor(bp);
  vec2 bf = fract(bp) - 0.5;
  float bh = hash21(bid + 9.0);
  if (bh > 0.86) {
    vec2 bo = (hash22(bid + 1.0) - 0.5) * 0.8;
    float bd = length(bf - bo);
    c += uPal[3] * exp(-bd * bd * 10.0) * 0.012;
  }

  return c;
}

float voronoiEdge(vec2 p, float t, float scale, out float cellRand, out float f1, out vec2 featureDir) {
  vec2 q = p * scale;
  vec2 n = floor(q);
  vec2 f = fract(q);
  float d1 = 8.0;
  float d2 = 8.0;
  vec2 id1 = vec2(0.0);
  vec2 nearestR = vec2(0.0);

  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 g = vec2(float(x), float(y));
      vec2 h = hash22(n + g);
      vec2 o = 0.5 + 0.42 * vec2(
        sin(t * 0.24 + TAU * h.x + (n + g).x * 0.7),
        cos(t * 0.21 + TAU * h.y + (n + g).y * 0.6)
      );
      vec2 r = g + o - f;
      float d = dot(r, r);
      if (d < d1) {
        d2 = d1;
        d1 = d;
        id1 = n + g;
        nearestR = r;
      } else if (d < d2) {
        d2 = d;
      }
    }
  }

  cellRand = hash21(id1 + 0.37);
  f1 = sqrt(d1) / scale;
  featureDir = normalize(nearestR + 1e-4);
  return (sqrt(d2) - sqrt(d1)) / scale;
}

vec3 inkRamp(float t) {
  t = clamp(t, 0.0, 1.0);
  if (t < 0.5) return mix(uInk[0], uInk[1], t * 2.0);
  return mix(uInk[1], uInk[2], (t - 0.5) * 2.0);
}


float darkDust(vec2 p, float t, float scale, float size, float seed) {
  vec2 sp = p * scale;
  vec2 flow = vec2(
    sin(p.y * 2.2 + t * 0.18 + seed * 2.3),
    cos(p.x * 2.0 - t * 0.15 + seed * 1.7)
  ) * 0.085;
  sp += flow;
  vec2 id = floor(sp);
  vec2 f = fract(sp) - 0.5;
  float h = hash21(id + seed);
  if (h < 0.27) return 0.0;
  vec2 o = (hash22(id + seed + 3.0) - 0.5) * 0.66;
  o += 0.15 * vec2(
    sin(t * (0.22 + h * 0.50) + h * TAU),
    cos(t * (0.19 + h * 0.40) + h * 13.0)
  );
  float d = length(f - o);
  float core = smoothstep(size, 0.0, d);
  float tw = 0.55 + 0.45 * sin(t * (0.40 + h * 0.70) + h * 31.0);
  return core * tw;
}

// One pine as seen flat on your back: the tip is the part nearest the zenith
// and the trunk runs straight away from it, so every tree leans in toward the
// middle of the sky. Tiers flare and tuck back; the edge is bristled.
float pine(vec2 p, vec2 tip, float h, float size, out float fringe) {
  fringe = 0.0;
  vec2 d = normalize(tip);
  vec2 r = p - tip;
  float s = dot(r, d);
  if (s < -0.012) return 0.0;
  float w = abs(dot(r, vec2(-d.y, d.x)));
  float body = size * (0.150 * (1.0 - exp(-s * 5.0 / size)) + 0.045 * s);
  if (w > body + 0.035) return 0.0;
  float tier = 0.052 * size * (0.8 + 0.4 * h);
  float flare = fract(s / tier + h * 7.0);
  float hw = body * (0.40 + 0.60 * flare);
  float grown = smoothstep(0.0, 0.07, s);
  float bristle = abs(fract(s * 44.0 / size + w * 26.0 + h * 3.0) - 0.5) * 2.0;
  hw += (bristle - 0.5) * 0.018 * size * grown;
  hw += (vnoise(vec2(s, w) * 36.0 + h * 91.0) - 0.5) * 0.022 * size * grown;
  hw = max(hw, 0.0035);
  float aa = 1.5 / min(uRes.x, uRes.y);
  float m = smoothstep(aa, -aa, w - hw) * smoothstep(-0.012, 0.0, s);
  fringe = m * (1.0 - smoothstep(0.0, 0.020 * size, hw - w));
  return m;
}

// Wind through the canopy: broad gust fronts rolling across the sky in one
// direction. Sampled per pixel in scrolled world space, so a gust travels
// through a tree branch by branch instead of bending all of it at once.
const vec2 PINE_WIND = vec2(0.857, 0.514);

float pineGust(vec2 wp, float t) {
  float a = dot(wp, PINE_WIND);
  float b = dot(wp, vec2(-PINE_WIND.y, PINE_WIND.x));
  float front = vnoise(vec2(a * 1.1 - t * 0.34, b * 0.55 + t * 0.02));
  float g = smoothstep(0.48, 0.86, front);
  float spell = 0.5 + 0.5 * sin(t * 0.071 + 1.3 * sin(t * 0.029));
  return g * (0.30 + 0.70 * spell);
}

float tierSway(float id, float h, float t) {
  float r = hash21(vec2(id, h * 53.0 + 1.3));
  return sin(t * (1.9 + 1.3 * r) + r * TAU);
}

// The fine pine: the classic outline grown into branches. Each tier is a whorl
// whose drooping lower edge is a branch; needles hang off its rib in
// herringbone tufts and bristle past the outline, and the crown behind is
// dense with a few holes of sky. Wind bends tips and leaves the trunk be:
// offsets grow with distance from the axis, and each tier flutters on its own.
float pineFine(vec2 p, vec2 tip, float h, float size, float t, float gust, vec2 wdir,
               out float fringe, out float shade) {
  fringe = 0.0;
  shade = 0.0;
  vec2 d = normalize(tip);
  vec2 n = vec2(-d.y, d.x);
  vec2 r = p - tip;
  float s = dot(r, d);
  if (s < -0.03 * size) return 0.0;
  float x = dot(r, n);
  float sp = max(s, 0.0);
  float body = size * (0.150 * (1.0 - exp(-sp * 5.0 / size)) + 0.045 * sp);
  if (abs(x) > body + 0.05 * size) return 0.0;

  float tierLen = 0.052 * size * (0.8 + 0.4 * h);
  float sf = s / tierLen + h * 7.0;
  float id = floor(sf);
  float tf0 = fract(sf);
  // Each tier flutters on its own; neighbours meet halfway at the seam so a
  // branch never jumps.
  float swA = tierSway(id - 1.0, h, t);
  float swB = tierSway(id, h, t);
  float swC = tierSway(id + 1.0, h, t);
  float sw = mix(swB, 0.5 * (swB + swC), smoothstep(0.80, 1.0, tf0));
  sw = mix(sw, 0.5 * (swA + swB), 1.0 - smoothstep(0.0, 0.20, tf0));

  float flex = clamp(abs(x) / max(body, 0.004), 0.0, 1.4);
  flex *= flex;
  float crown = exp(-sp * 2.5 / size);
  vec2 wl = vec2(dot(wdir, n), dot(wdir, d));
  float bend = size * (flex * (gust * 0.026 + (0.0035 + 0.0060 * gust) * sw)
                     + crown * (gust * 0.014 + 0.004 * sin(t * 0.47 + h * 19.0)));
  x -= wl.x * bend;
  s -= wl.y * bend * 0.6 + sw * flex * 0.0025 * size;

  sp = max(s, 0.0);
  body = size * (0.150 * (1.0 - exp(-sp * 5.0 / size)) + 0.045 * sp);
  sf = s / tierLen + h * 7.0;
  id = floor(sf);
  float tf = fract(sf);
  float ax = abs(x);
  float ub = ax / max(body, 1e-4);
  float px = 1.0 / min(uRes.x, uRes.y);
  float aa = px * 0.9;

  // Signed depth inside the tier's drooping lower edge, along the trunk.
  float ds = (tf - (ub - 0.40) / 0.60) * tierLen;
  float run = 0.60 * body;
  float slopeFix = run / sqrt(run * run + tierLen * tierLen);

  // The branch rib sits a little inside the outline; needles leave it on both
  // sides, swept toward the branch tip, shorter and thinner toward its end.
  float nl = tierLen * 0.70;
  float across = (ds - nl * 0.55) * slopeFix;
  // Needles are thinner than a pixel on most screens: draw them a crisp pixel
  // wide and let their real width set how dark they are. Two crossing sets,
  // a few missing, so the skirt reads as a brush and not a comb.
  float branchOn = 1.0 - smoothstep(1.02, 1.10, ub);
  float tipShort = 1.0 - 0.45 * smoothstep(0.70, 1.05, ub);
  float needles = 0.0;
  for (int set = 0; set < 2; set++) {
    float fs = float(set);
    float spacing = (0.012 - 0.0025 * fs) * size;
    float sweep = 0.95 - 0.38 * fs;
    float droop = (1.4 + 1.2 * fs) / size;
    float q = (ax - abs(across) * sweep - across * across * droop) / spacing + h * 13.0 + fs * 0.37;
    float nh = hash21(vec2(floor(q), id * 7.0 + h * 31.0 + sign(across) + fs * 17.0));
    if (nh < 0.18) continue;
    float lenN = nl * slopeFix * (0.50 + 0.40 * nh) * tipShort * (1.0 - 0.18 * fs);
    float onNeedle = 1.0 - smoothstep(lenN * 0.70, lenN, abs(across));
    float distN = abs(fract(q) - 0.5) * spacing * 0.72;
    float realW = (0.00030 + 0.00022 * size) * (1.0 - 0.6 * clamp(abs(across) / max(lenN, 1e-4), 0.0, 1.0));
    float drawW = max(realW, 0.5 * px);
    needles = max(needles, smoothstep(drawW + aa, drawW - aa * 0.5, distN) * onNeedle
                * clamp(realW / drawW * 1.4, 0.35, 1.0));
  }
  needles *= branchOn;

  float ribReal = (0.0004 + 0.0008 * size) * (1.0 - 0.6 * clamp(ub, 0.0, 1.0));
  float ribW = max(ribReal, 0.5 * px);
  float rib = smoothstep(ribW + aa, ribW - aa * 0.5, abs(across)) * (1.0 - smoothstep(0.92, 1.02, ub))
            * clamp(ribReal / ribW * 1.4, 0.45, 1.0);

  // The dense crown behind the skirt: a lumpy edge, opened by a few holes of
  // sky toward the branch tips.
  float clump = vnoise(vec2(ax, s) * (30.0 / size) + h * 91.0 + id * 3.1);
  float lump = vnoise(vec2(ax * 90.0 / size, id * 5.3 + h * 17.0)) * 0.65
             + vnoise(vec2(ax * 260.0 / size, id * 2.1 + h * 5.0)) * 0.35;
  float holes = smoothstep(0.55, 0.95, ub) * smoothstep(0.58, 0.78, clump);
  float massAt = nl * (0.80 + 0.90 * (lump - 0.5)) * slopeFix;
  float mass = smoothstep(-aa, aa, ds * slopeFix - massAt) * (1.0 - holes);

  float top = smoothstep(-0.012, 0.0, s);
  float cov = max(mass, max(needles, rib * 0.95)) * top;
  fringe = max(needles, rib) * (1.0 - mass) * top;
  shade = (1.0 - smoothstep(0.0, 0.9, ub)) * mass;
  return cov;
}

vec3 segT(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return vec3(length(pa - ba * h), h, 0.0);
}

// Now and then a needle pair lets go: it drifts with the wind, sways, tumbles
// edge-on and back, and grows as it falls toward you until it slips out of
// focus. Cells over the scrolled sky each roll a long cycle; most stay empty,
// and the open middle of the sky, far from the trees, seldom gets one.
vec4 fallingNeedles(vec2 p, vec2 ext, float lit, float t) {
  float px = 1.0 / min(uRes.x, uRes.y);
  float cell = 0.5;
  vec2 fp = vec2(p.x, p.y + uTravel * 0.85);
  vec2 c0 = floor(fp / cell);
  float cover = 0.0;
  float dry = 0.0;
  float glint = 0.0;
  for (int j = -1; j <= 1; j++) {
    for (int i = -1; i <= 1; i++) {
      vec2 cid = c0 + vec2(float(i), float(j));
      vec2 hc = hash22(cid * 1.37 + 4.1);
      float period = 24.0 + 20.0 * hc.x;
      float cyc = t / period + hc.y;
      float k0 = floor(cyc);
      float age = fract(cyc) * period;
      vec2 hr = hash22(cid + k0 * 7.31 + 0.5);
      float life = 7.0 + 5.0 * hr.x;
      if (age > life) continue;
      vec2 start = (cid + hash22(cid * 0.71 + k0 * 1.93 + 9.0)) * cell;
      float fromTrees = smoothstep(0.20, 0.55, abs(start.x) / ext.x);
      if (hr.y > 0.42 * fromTrees) continue;
      vec2 hq = hash22(cid * 3.3 + k0 * 2.17 + 1.7);
      float k = age / life;

      float gust = pineGust(start, t);
      vec2 center = start
        + PINE_WIND * (0.10 + 0.16 * hq.x + 0.10 * gust) * k * (1.0 + 0.6 * k)
        + vec2(sin(age * 1.15 + hq.y * TAU), 0.6 * sin(age * 0.83 + hq.x * TAU)) * (0.018 + 0.012 * hq.y)
        + normalize(start + 1e-3) * 0.05 * k * k;
      vec2 lp = fp - center;
      if (dot(lp, lp) > 0.04) continue;

      float scale = mix(0.8, 2.4, k * k) * (0.8 + 0.4 * hq.y);
      float fade = smoothstep(0.0, 0.12, k) * (1.0 - smoothstep(0.72, 1.0, k));
      float blur = px * (1.0 + 7.0 * smoothstep(0.55, 1.0, k));
      float spin = (hq.y > 0.5 ? 1.0 : -1.0) * (0.35 + 0.6 * hq.y);
      float ang = hq.x * TAU + age * spin + 0.5 * sin(age * 1.7 + hq.x * 9.0);
      float turn = cos(age * (0.5 + 0.5 * hq.x) + hq.y * 5.0);
      float flip = 0.30 + 0.70 * abs(turn);
      float len = 0.050 * scale * flip;
      float spread = 0.16 + 0.07 * sin(age * 0.9 + hq.x * 4.0);
      vec2 d0 = vec2(cos(ang), sin(ang));
      vec2 base = -d0 * len * 0.5;
      vec3 a1 = segT(lp, base, base + vec2(cos(ang + spread), sin(ang + spread)) * len);
      vec3 a2 = segT(lp, base, base + vec2(cos(ang - spread), sin(ang - spread)) * len);
      if (hq.x < 0.22) a2.x = 1e3;
      float th = 0.0011 * scale;
      float e1 = a1.x - th * (1.0 - 0.6 * a1.y);
      float e2 = a2.x - th * (1.0 - 0.6 * a2.y);
      float sheath = length(lp - base) - th * 1.5;
      float e = min(min(e1, e2), sheath);
      float m = (1.0 - smoothstep(-blur, blur, e)) * clamp((th + px) / (th + blur), 0.2, 1.0) * fade;
      if (m > cover) {
        cover = m;
        dry = step(0.7, hc.x);
        // Turned flat to the sky, the waxy needle catches a little of it.
        glint = smoothstep(0.80, 1.0, abs(turn));
      }
    }
  }
  vec3 green = vec3(0.010, 0.022, 0.012) + uPal[2] * 0.05;
  vec3 brown = vec3(0.030, 0.020, 0.011) + uPal[2] * 0.04;
  vec3 c = mix(green, brown, dry) + vec3(0.010, 0.030, 0.013) * lit * 2.2;
  c += (uPal[3] * 0.05 + vec3(0.004, 0.010, 0.005)) * glint;
  return vec4(c, cover);
}

// The ride: three lanes of pines on each side of the path. A tip only ever
// slides straight down the view; shorter, nearer trees sit further out and
// pass faster, which is all the parallax there is.
vec4 canopy(vec2 p, float lit) {
  vec2 ext = uRes / min(uRes.x, uRes.y);
  float side = p.x < 0.0 ? -1.0 : 1.0;
  vec2 mp = vec2(abs(p.x), p.y);
  vec3 deep = vec3(0.0016, 0.0050, 0.0028);
  vec3 needle = vec3(0.010, 0.030, 0.013);
  vec3 rgb = vec3(0.0);
  float alpha = 0.0;
  bool fine = uPines > 0.5;

  for (int L = 0; L < 3; L++) {
    float fl = float(L);
    float reach = 0.50 + 0.23 * fl;
    float lane = ext.x * reach;
    float spacing = 0.46 + 0.09 * fl;
    float scroll = uTravel * reach + fl * 3.7;
    float size = 0.80 + 0.28 * fl;
    float c0 = floor((-ext.y - 0.30 + scroll) / spacing);
    float cover = 0.0;
    float edge = 0.0;
    float shade = 0.0;
    float gust = 0.0;
    vec2 wm = vec2(PINE_WIND.x * side, PINE_WIND.y);
    if (fine) gust = pineGust(vec2(p.x, p.y + scroll), uTime);

    for (int k = 0; k < 14; k++) {
      float c = c0 + float(k);
      vec2 hh = hash22(vec2(c, fl * 13.0 + side * 5.0 + 2.0));
      float ty = (c + 0.2 + 0.6 * hh.y) * spacing - scroll;
      if (ty > ext.y + 0.30) break;
      vec2 tip = vec2(lane * (0.86 + 0.28 * hh.x), ty);
      float fr;
      float sh = 0.0;
      float sz = size * (0.80 + 0.40 * hh.y);
      float a = fine
        ? pineFine(mp, tip, hh.x, sz, uTime + fl * 11.0 + hh.y * 5.0, gust, wm, fr, sh)
        : pine(mp, tip, hh.x, sz, fr);
      cover = max(cover, a);
      edge = max(edge, fr);
      shade = max(shade, sh);
    }

    vec3 c = deep * (1.5 - 0.3 * fl) + uPal[2] * (0.08 - 0.03 * fl);
    c *= 1.0 - 0.35 * shade;
    // A passing gust turns the needles and they catch a little more sky.
    c += needle * edge * (0.26 + 0.10 * fl) * (fine ? 0.45 + 1.4 * gust : 1.0);
    c += needle * lit * (1.5 + 2.6 * edge);
    rgb = mix(rgb, c, cover);
    alpha += cover * (1.0 - alpha);
  }

  if (fine) {
    vec4 fall = fallingNeedles(p, ext, lit, uTime);
    rgb = mix(alpha > 0.001 ? rgb : fall.rgb, fall.rgb, fall.a);
    alpha += fall.a * (1.0 - alpha);
  }

  return vec4(rgb, alpha);
}

vec3 voidScene(vec2 q, float maskRaw, float lightSum) {
  vec3 col = voidColor(q, uTime);
  col += starField(q, uTime);

  // On the ride the sky lifts a little, so the pines read as silhouettes.
  if (uRide > 0.001) {
    float skyX = q.x / (1.25 * uRes.x / min(uRes.x, uRes.y));
    float sky = (0.62 + 0.38 * fbm(q * 0.8 + vec2(0.0, uTravel * 0.05), 3)) * exp(-skyX * skyX);
    col += mix(uPal[2], uPal[3], 0.22) * sky * 0.40 * uRide;
  }

  vec2 distortion = vec2(
    fbm(q * 1.7 + vec2(uTime * 0.020, -uTime * 0.014), 3),
    fbm(q * 1.7 + vec2(4.7, 2.1) - uTime * 0.017, 3)
  ) - 0.5;

  vec2 masked = q + distortion * 0.055;
  float maskSum = 0.0;

  float wobble = (vnoise(q * 7.0 + vec2(uTime * 0.035, -uTime * 0.028)) - 0.5) * (0.030 + uErode * 0.12);
  maskSum = smoothstep(clamp(uErode + wobble, 0.0, 0.999), 1.0, maskRaw);

  float reveal = 1.0 - exp(-maskSum * 1.30);
  reveal *= 0.78 + 0.22 * fbm(q * 2.4 + vec2(uTime * 0.015, -uTime * 0.011), 3);

  // Shockwaves are only a displacement of the field; they are never drawn as rings.
  float scrAspect = uRes.x / uRes.y;
  float breath = sin(uTime * 0.11 + sin(uTime * 0.037) * 1.7);
  vec2 shockDisp = vec2(0.0);
  float shockEnergy = 0.0;

  for (int i = 0; i < 8; i++) {
    vec4 sh = uShocks[i];
    if (sh.w <= 0.001) continue;
    vec2 d = q - sh.xy;
    float dist = length(d);
    float age = sh.z;
    float front = age * 0.82;
    float width = 0.055 + age * 0.055;
    float env = exp(-pow((dist - front) / width, 2.0));
    env *= exp(-age * 0.62) * sh.w;
    float warp = sin(d.x * 7.0 + age * 2.1) * cos(d.y * 6.0 - age * 1.7);
    vec2 dir = normalize(d + 0.0001);
    dir = rot(warp * 1.9) * dir;
    shockDisp += dir * env * 0.105;
    shockDisp += vec2(-dir.y, dir.x) * env * 0.052 * sin(age * 3.3 + dist * 7.0);
    shockEnergy += env;
  }

  vec2 shockUv = vec2(shockDisp.x / (2.0 * scrAspect), shockDisp.y * 0.5);

  // The pattern is now a living veil. Touch removes it; the subject is the negative space.
  float veilTime = uTime * 0.045;
  vec2 vp = q * 2.15 + shockDisp * 0.8;
  float w1 = fbm(vp * 0.68 + vec2(veilTime, -veilTime * 0.72), 3);
  float w2 = fbm(vp * 1.02 + w1 * 1.7 + vec2(-veilTime * 0.85, veilTime * 0.63), 3);
  vec2 wp = vp + vec2(w1, w2) * 1.65;

  float n = fbm(wp, 5);
  float filament = pow(max(0.0, 1.0 - abs(n * 2.0 - 1.0)), 7.5);
  float micro = fbm(wp * 2.7 + vec2(veilTime * 0.7, -veilTime * 0.5), 3);
  float veil = filament * (0.45 + 0.55 * micro);

  float rawMask = maskSum;
  float shape = rawMask + (vnoise(q * 9.0 + vec2(uTime * 0.050, -uTime * 0.030)) - 0.5) * 0.050 * smoothstep(0.0, 0.12, rawMask);
  float local = smoothstep(0.0, 0.26, shape);
  float hole = smoothstep(0.28, 0.88, shape);
  float rim = exp(-pow((shape - 0.34) / 0.11, 2.0));
  float shell = local * (1.0 - hole);
  float fibrous = 0.16 + 0.84 * filament;
  float light = 1.0 - exp(-lightSum * 1.15);

  float inkT = clamp(0.5 + 0.5 * sin(q.x * 1.3 + q.y * 0.9 + uTime * 0.02), 0.0, 1.0);
  inkT = pow(inkT, exp2(uInkCurve * 1.8));
  vec3 ink = inkRamp(inkT);

  float value = shell * fibrous * breath * uVeil;
  float lightFade = 1.0 - light * 0.90;
  col += ink * value * 0.85 * lightFade;
  col += ink * rim * local * uVeil * (0.014 + min(shockEnergy, 1.2) * 0.010) * lightFade;
  col += inkRamp(0.82) * light * 0.10;

  // The stroke is not a hollow outline: its center becomes an opaque void,
  // then it tears open at the edge in a broken, fibrous rift.
  float erase = 1.0 - exp(-lightSum * 2.6);
  float abyssDepth = smoothstep(0.02, 0.82, shape);
  abyssDepth *= 0.92 + 0.08 * vnoise(q * 13.0 + vec2(uTime * 0.035, -uTime * 0.025));
  abyssDepth *= 1.0 - erase * 0.985;
  float penumbra = smoothstep(0.0, 0.34, shape) * (1.0 - smoothstep(0.40, 0.86, shape));
  col *= 1.0 - penumbra * 0.20 * (1.0 - erase * 0.75);
  vec3 abyss = vec3(0.0008, 0.0009, 0.0013) + ink * 0.004 * (0.35 + 0.65 * micro);
  col = mix(col, abyss, abyssDepth * 0.94);

  // Fine dust lives only inside the painted rift. It is clipped by the mask,
  // so the darkness is the container rather than a separate particle field.
  float dustMask = smoothstep(0.24, 0.82, shape) * (1.0 - erase * 0.985);
  float dustA = darkDust(q + shockDisp * 0.28, uTime, 13.0, 0.070, 1.7);
  float dustB = darkDust(q + shockDisp * 0.48, uTime, 31.0, 0.045, 8.3);
  vec3 dustCol = mix(inkRamp(0.94), vec3(0.72, 0.69, 0.62), 0.30);
  col += dustCol * dustMask * (dustA * 0.140 + dustB * 0.070) * (1.0 + min(shockEnergy, 1.0) * 0.35);

  float crackFade = 1.0 - erase * 0.96;
  float rift = exp(-pow((shape - 0.24) / (0.020 + 0.014 * micro), 2.0));
  float crackNoise = fbm(q * 11.0 + vec2(uTime * 0.020, -uTime * 0.017), 3);
  float cracks = rift * smoothstep(0.48, 0.66, crackNoise) * (0.35 + 0.65 * filament);
  float hairline = exp(-pow((shape - 0.24 - 0.010 * sin(q.x * 28.0 - q.y * 24.0 + uTime * 0.10)) / (0.004 + 0.003 * micro), 2.0));
  vec3 crackColor = mix(inkRamp(0.96), vec3(0.90, 0.85, 0.77), 0.30);
  float edgeLine = 1.0 - smoothstep(0.0, 0.012, abs(shape - 0.235 - 0.006 * sin(q.x * 19.0 + q.y * 17.0 - uTime * 0.07)));
  float edgeBreak = smoothstep(0.42, 0.64, fbm(q * 17.0 + vec2(-uTime * 0.015, uTime * 0.011), 2));
  col += crackColor * rift * 0.026 * crackFade;
  col += crackColor * cracks * 0.34 * crackFade;
  col += crackColor * hairline * smoothstep(0.50, 0.68, crackNoise) * 0.10 * crackFade;
  col += crackColor * edgeLine * edgeBreak * 0.30 * crackFade;
  return col;
}

// ---------------------------------------------------------------------------
// The sky. Here the subject is the night itself: haze and cloud cover it, a
// touch parts them, and the stars are what you find underneath. The parted
// cloud drifts on with the wind and closes back over by itself.
// ---------------------------------------------------------------------------

vec3 starTint(float h) {
  vec3 hot = vec3(0.66, 0.77, 1.00);
  vec3 sun = vec3(1.00, 0.96, 0.89);
  vec3 cool = vec3(1.00, 0.74, 0.50);
  h = h * h * (3.0 - 2.0 * h);
  return h < 0.5 ? mix(hot, sun, h * 2.0) : mix(sun, cool, (h - 0.5) * 2.0);
}

// Stars are rare, tiny specks of glow: most barely there, a few carrying
// faint flare spikes. Each shimmers slowly on its own clock and now and then
// catches a brief glint. excite (0..1) is how hard the air over it is being
// stirred: it quickens and deepens the shimmer and draws the flares out.
// Tuning: STAR_* below.
#define STAR_KEEP_NEAR 0.060   // share of cells holding a near (flared) star
#define STAR_KEEP_FAR 0.030    // share of cells holding a far speck
#define STAR_BRIGHT 1.0        // overall star brightness
#define STAR_SHIMMER 0.22      // idle shimmer depth
#define STAR_SHIMMER_STIR 0.55 // extra shimmer depth when stirred
vec3 skyStars(vec2 s, float excite, float t) {
  vec3 c = vec3(0.0);
  float pxPerUnit = 0.5 * min(uRes.x, uRes.y);
  for (int i = 0; i < 2; i++) {
    float fi = float(i);
    float scale = 9.0 + fi * 14.0;                     // 9 near, 23 far
    vec2 sp = s * scale + vec2(fi * 31.7, fi * 17.3);
    vec2 id = floor(sp);
    vec2 f = fract(sp) - 0.5;
    float h = hash21(id + fi * 11.0);
    if (h > mix(STAR_KEEP_NEAR, STAR_KEEP_FAR, fi)) continue;
    vec2 o = (hash22(id + 7.0 + fi) - 0.5) * 0.36;
    float hb = hash21(id + 41.0 + fi);
    vec2 dp = (f - o) * pxPerUnit / scale;             // offset in pixels
    float d2 = dot(dp, dp);

    // Shimmer: two slow beating sines, plus a rare sharp glint.
    float ph = hb * 61.0 + h * 173.0;
    float rate = 1.0 + 1.8 * excite;
    float slow = sin(t * (0.31 + 0.45 * hb) * rate + ph)
               * (0.6 + 0.4 * sin(t * (0.83 + 1.1 * fract(h * 37.0)) * rate + ph * 1.7));
    float glint = pow(max(0.0, sin(t * (0.13 + 0.11 * fract(h * 53.0)) * (1.0 + 4.0 * excite) + ph * 3.1)), 28.0);
    float depth = STAR_SHIMMER + STAR_SHIMMER_STIR * excite;
    float tw = max(0.12, 1.0 + depth * slow + (0.5 + 1.3 * excite) * glint);

    float b = (0.020 + 0.17 * pow(hb, 4.0)) * (1.0 - fi * 0.6) * STAR_BRIGHT;
    b *= 1.0 + 0.35 * excite;
    float core = exp(-d2 / (0.55 + 0.6 * hb));
    float halo = exp(-sqrt(d2) / (1.4 + 1.8 * hb)) * 0.10;
    float glow = core + halo;

    // Flares: a thin, faint cross, tilted a little per star, only on the
    // brighter near stars. They breathe with the glint and stretch when stirred.
    if (i == 0) {
      float fl = smoothstep(0.55, 0.95, hb);
      if (fl > 0.0) {
        vec2 r = rot(0.35 + (h / STAR_KEEP_NEAR - 0.5) * 0.5) * dp;
        float len = 2.2 + 3.5 * hb + 3.0 * excite + 3.0 * glint;
        float spikes = exp(-abs(r.y) * 2.2 - abs(r.x) / len)
                     + exp(-abs(r.x) * 2.2 - abs(r.y) / len);
        glow += spikes * fl * (0.10 + 0.25 * glint + 0.20 * excite);
      }
    }

    // Fade out before the cell edge so no glow is cut off by its neighbour.
    float win = 1.0 - smoothstep(0.36, 0.5, max(abs(f.x), abs(f.y)));
    vec3 tint = mix(vec3(1.0), starTint(hash21(id + 3.3 + fi)), 0.6);
    c += tint * glow * b * tw * win;
  }
  return c;
}

float cloudField(vec2 c, float t) {
  vec2 w = vec2(
    fbm(c * 0.85 + vec2(0.0, t * 0.012), 3),
    fbm(c * 0.85 + vec2(5.2, 1.3) - t * 0.009, 3)
  );
  return fbm(c * 1.30 + (w - 0.5) * 1.5 + vec2(t * 0.006, -t * 0.002), 5);
}

vec3 skyScene(vec2 q, float maskRaw, vec4 flow, float excite, float light, float t) {
  vec2 ext = uRes / min(uRes.x, uRes.y);
  float hgt = q.y + ext.y;                           // height above the bottom edge
  float horizon = exp(-hgt * 2.4);                   // 1 at the bottom, 0 high up

  // The sky turns very slowly about a pole above the top of the view.
  vec2 pole = vec2(0.35, ext.y + 0.85);
  vec2 s = rot(t * 0.0011) * (q - pole) + pole;

  // Clear sky: deep blue at the zenith, a warm glow of distant towns low down.
  vec3 zenith = vec3(0.0012, 0.0017, 0.0040);
  vec3 low = vec3(0.0085, 0.0074, 0.0070);
  vec3 sky = mix(zenith, low, horizon);

  float extinction = 1.0 - horizon * 0.75;
  sky += skyStars(s, excite, t) * extinction;

  // Clouds live in wind space; the parted mask is sampled in the same space,
  // so a parted hole drifts along with the cloud around it.
  // A gust carries the cloud itself: sample it where it was blown from.
  vec2 c = vec2(q.x - uDrift - flow.x, q.y - flow.y) * vec2(0.62, 1.05);
  float n = cloudField(c, t);
  float density = smoothstep(0.34, 0.70, n);
  float det = clamp(flow.w, 0.0, 2.0);
  float thin = clamp(1.0 - det, 0.0, 1.0);
  float pile = clamp(det - 1.0, 0.0, 1.0);
  density = clamp(density * mix(1.0, det, 0.6) + pile * 0.15, 0.0, 1.0);
  float fine = fbm(c * 4.2 + vec2(-t * 0.010, t * 0.006), 3);
  float haze = 0.935 + 0.05 * horizon;
  float veil = 1.0 - (1.0 - haze) * (1.0 - density * 0.995);

  // Parting: thin haze and wisps give way first; thick cloud resists a little.
  float edgeN = fbm(c * 6.0 + vec2(t * 0.03, -t * 0.02), 3);
  // With the wind field, cloud opens where a gust has pulled it thin or torn
  // it; without it, the painted mask parts it as before.
  float part;
  if (uFlowOn > 0.5) {
    // Stretched cloud thins in proportion to the stretch, ragged with its own
    // texture; only a hard gust tears it clean through.
    float stretch = thin * (0.75 + 0.55 * (edgeN - 0.5) + 0.45 * (0.5 - n));
    float torn = smoothstep(0.15, 0.95, flow.z + (edgeN - 0.5) * 0.35 - density * 0.15);
    part = clamp(max(stretch * 1.15, torn), 0.0, 1.0);
  } else {
    float pv = maskRaw * 1.35 - uErode * 0.55 + (edgeN - 0.5) * 0.62 + (0.5 - n) * 0.55 - density * 0.12;
    part = smoothstep(0.10, 0.85, pv);
  }
  if (uFlowOn < 0.5) part *= part * (3.0 - 2.0 * part);
  float opacity = veil * (1.0 - part);

  // Night cloud is lit from below by sky glow: warmer and brighter low down,
  // brightest where it is thickest, with a little texture in it.
  vec3 tint = uPal[3] / max(dot(uPal[3], vec3(0.3333)), 1e-4);
  vec3 hazeCol = mix(vec3(0.0042, 0.0046, 0.0060), vec3(0.0170, 0.0135, 0.0110), horizon);
  vec3 cloudCol = mix(vec3(0.0150, 0.0156, 0.0182), vec3(0.0420, 0.0320, 0.0235), horizon);
  cloudCol *= (0.45 + 0.95 * density + 0.45 * (fine - 0.5)) * (1.0 + pile * 0.25);
  vec3 overCol = mix(hazeCol, cloudCol, density);
  overCol = mix(overCol, overCol * tint, 0.35);
  overCol *= 0.75 + 0.5 * uVeil;

  vec3 col = mix(sky, overCol, opacity);

  // A faint silver lining where the cloud has just been pulled thin.
  float rim = part * (1.0 - part) * 4.0 * veil;
  col += overCol * rim * (0.18 + 0.30 * fine);

  // Illumination lights the underside of whatever cloud is left.
  col += mix(vec3(0.050, 0.047, 0.043), inkRamp(0.82) * 0.06, 0.4) * light * (0.25 + 0.75 * opacity);

  return col;
}

void main() {
  vec2 uv = aspect(gl_FragCoord.xy);
  vec2 pd = uv - uPointer;

  float lens = exp(-dot(pd, pd) * 16.0);
  vec2 q = uv - pd * lens * (0.052 + 0.020 * uPress);

  // The mask is accumulated in a separate texture, so old marks do not have
  // to be deleted to make room for new ones. It lives in wind space (shifted
  // by uDrift) and wraps horizontally, so parted cloud travels with the wind.
  float maskAspect = uRes.x / max(1.0, uRes.y);
  vec2 maskExtent = vec2(max(1.0, maskAspect), max(1.0, 1.0 / maskAspect));
  vec2 maskUv = vec2((q.x - uDrift) / (2.0 * maskExtent.x) + 0.5, clamp(0.5 - q.y / (2.0 * maskExtent.y), 0.001, 0.999));
  float maskRaw = texture(uMask, maskUv).a;

  float lightSum = 0.0;
  for (int i = 0; i < 24; i++) {
    vec4 l = uLights[i];
    if (l.w <= 0.001) continue;
    vec2 d = q - l.xy;
    lightSum += exp(-dot(d, d) / (l.z * l.z) * 1.8) * l.w;
  }
  float light = 1.0 - exp(-lightSum * 1.15);

  vec3 col = vec3(0.0);
  if (uSky < 0.999) col = voidScene(q, maskRaw, lightSum);
  if (uSky > 0.001) {
    vec4 flow = vec4(0.0, 0.0, 0.0, 1.0);
    // How stirred the air is here: live wind speed, plus a little that lingers
    // while the cloud is still torn or pushed aside. A held finger counts too.
    float excite = maskRaw * 0.7;
    if (uFlowOn > 0.5) {
      vec2 fuv = vec2((q.x - uDrift) / (2.0 * maskExtent.x) + 0.5, q.y / (2.0 * maskExtent.y) + 0.5);
      flow = texCubic(uFlow, fuv);
      float wind = length(texCubic(uWind, fuv).xy);
      excite = 1.0 - exp(-(wind * 1.4 + flow.z * 0.6 + length(flow.xy) * 1.0));
    }
    excite = clamp(excite + uPress * exp(-dot(pd, pd) * 28.0) * 0.6, 0.0, 1.0);
    col = mix(col, skyScene(q, maskRaw, flow, excite, light, uTime), uSky);
  }

  // The pines pass in front of everything in the sky, painted dark included.
  // Light reaches them: an illuminated stroke turns the needles green.
  if (uRide > 0.001) {
    vec4 can = canopy(q, light);
    col = mix(col, can.rgb, can.a * uRide);
  }

  // The orb: a small pearl with a little chromatic mischief.
  float orbCore = exp(-dot(pd, pd) * 1500.0);
  float orbInner = exp(-dot(pd, pd) * 220.0);
  float orbHalo = exp(-dot(pd, pd) * 8.0);
  vec3 orbTint = mix(uPal[4], vec3(1.0, 0.96, 0.89), 0.30);
  float pulse = 0.90 + 0.12 * sin(uTime * 0.7) + 0.22 * uPress;

precision highp float;
out vec4 o;
uniform vec2 uGrid;
uniform vec2 uExt;
uniform float uDt;
uniform float uTime;
uniform float uDrift;
uniform vec4 uSplatA[16];
uniform vec4 uSplatB[16];
uniform int uSplats;
uniform vec4 uLights[24];

float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1.0, 0.0)), f.x),

vec2 toScene(vec2 uv) { return vec2((uv.x - 0.5) * 2.0 * uExt.x + uDrift, (uv.y - 0.5) * 2.0 * uExt.y); }
vec2 wrapD(vec2 d) { float per = 2.0 * uExt.x; d.x -= per * floor(d.x / per + 0.5); return d; }

// A gust is a soft streak stretched along its own direction.
float splatShape(vec2 x, int i, out vec2 d) {
  vec4 a = uSplatA[i];
  vec2 vel = uSplatB[i].xy;
  d = wrapD(x - a.xy);
  float r = a.z;
  float spd = length(vel);
  if (spd < 1e-4) return exp(-dot(d, d) / (r * r));
  vec2 dir = vel / spd;
  float along = dot(d, dir);
  float perp = dot(d, vec2(-dir.y, dir.x));
  float l = r * (1.0 + min(spd, 3.0) * 0.9);
  return exp(-perp * perp / (r * r) - along * along / (l * l));

float calmAt(vec2 x) {
  float c = 0.0;
  for (int i = 0; i < 24; i++) {
    vec4 l = uLights[i];

    vec2 d = wrapD(x - l.xy);

}

uniform sampler2D uVel;
